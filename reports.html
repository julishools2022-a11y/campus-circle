<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reports | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}

        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
        .back-btn{color:var(--muted);text-decoration:none;width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0;}
        .header h1{font-size:1.05rem;font-weight:800;}
        .header .subtitle{font-size:0.78rem;color:var(--muted);margin-top:2px;}

        .wrap{padding:16px;}
        .section-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
        .section-card h3{font-size:0.9rem;font-weight:800;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;}

        select,input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;margin-bottom:12px;}
        select:focus,input:focus{border-color:var(--primary);outline:none;}

        /* REPORT TYPE TABS */
        .tab-row{display:flex;gap:0;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:16px;}
        .tab-btn{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:9px;font-weight:700;font-size:0.75rem;color:var(--muted);cursor:pointer;font-family:'Outfit',sans-serif;transition:0.2s;text-align:center;}
        .tab-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;box-shadow:0 3px 10px rgba(61,114,180,0.3);}

        /* STATS */
        .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
        .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
        .stat-box .val{font-size:1.3rem;font-weight:800;color:var(--accent);}
        .stat-box .label{font-size:0.7rem;color:var(--muted);margin-top:2px;}

        /* EXPORT BUTTONS */
        .export-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
        .export-btn{flex:1;min-width:80px;padding:10px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:0.2s;}
        .export-btn:active{transform:scale(0.96);}
        .export-btn.excel{border-color:rgba(34,197,94,0.3);color:var(--success);}
        .export-btn.csv{border-color:rgba(61,114,180,0.3);color:var(--accent);}
        .export-btn.print{border-color:rgba(245,158,11,0.3);color:var(--warning);}

        /* RESULT TABLE */
        .report-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin:12px 0;}
        .report-table{width:100%;border-collapse:collapse;font-size:0.78rem;min-width:400px;}
        .report-table th{background:var(--surface2);color:var(--accent);padding:8px 10px;text-align:left;font-weight:700;white-space:nowrap;}
        .report-table td{padding:8px 10px;border-top:1px solid var(--border);color:var(--text);}
        .report-table tr:hover td{background:rgba(255,255,255,0.02);}
        .winner-row td{color:var(--success);font-weight:700;}
        .winner-row td:first-child::before{content:'🏆 ';}

        /* TURNOUT BAR */
        .turnout-item{margin-bottom:12px;}
        .turnout-label{font-size:0.8rem;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;}
        .turnout-label span{color:var(--muted);}
        .progress-track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;}

        /* AUDIT LOG */
        .audit-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;}
        .audit-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;}
        .audit-info .action{font-size:0.82rem;font-weight:700;}
        .audit-info .detail{font-size:0.72rem;color:var(--muted);margin-top:2px;}
        .audit-info .time{font-size:0.68rem;color:var(--muted);margin-top:2px;}

        .empty-state{text-align:center;padding:30px 20px;color:var(--muted);}
        .empty-state i{font-size:2rem;opacity:0.2;display:block;margin-bottom:10px;}

        .access-denied{text-align:center;padding:60px 20px;color:var(--muted);}
        .access-denied i{font-size:2.5rem;opacity:0.3;display:block;margin-bottom:12px;}

        .spinner-center{text-align:center;padding:60px 0;}
        .spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* PRINT STYLES */
        @media print {
            body{background:white;color:black;font-family:Arial,sans-serif;}
            .header,.tab-row,.export-row,select,input{display:none!important;}
            .section-card{border:1px solid #ccc;border-radius:0;box-shadow:none;}
            .report-table th{background:#eee;color:black;}
            .report-table td{color:black;border-color:#ccc;}
            .stat-box{background:#f5f5f5;border-color:#ccc;}
            .stat-box .val{color:#333;}
            .stat-box .label{color:#666;}
            .print-header{display:block!important;}
        }
        .print-header{display:none;text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #333;}
        .print-header h2{font-size:1.2rem;font-weight:800;}
        .print-header p{font-size:0.85rem;color:#666;}
    </style>
</head>
<body>

<div class="header">
    <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1>Reports</h1>
        <div class="subtitle">Turnout, results &amp; audit exports</div>
    </div>
</div>

<div id="content">
    <div class="spinner-center"><div class="spinner"></div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentAdmin = null;
    let elections = [];
    let allStudents = [];
    let currentTab = 'results';
    let selectedElectionId = null;

    function fmt(date) {
        if (!date) return '-';
        const d = date.toDate ? date.toDate() : new Date(date);
        return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    window.onload = () => {
        const matric = sessionStorage.getItem('voterMatric');
        if (!matric) { window.location.href = 'evoting-login.html'; return; }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'evoting-login.html'; return; }

            try {
                const studentRef = doc(db, 'students', matric);
                const studentSnap = await getDoc(studentRef);
                if (!studentSnap.exists() || studentSnap.data().authUid !== user.uid) {
                    window.location.href = 'evoting-login.html'; return;
                }

                const admin = studentSnap.data();
                currentAdmin = { matric, ...admin };

                if (!admin.isAdmin) {
                    document.getElementById('content').innerHTML = `<div class="access-denied"><i class="fa-solid fa-lock"></i><h3 style="color:var(--text);margin-bottom:6px;">Access Restricted</h3><p>Admin access required.</p></div>`;
                    return;
                }

                await loadData();
                renderPage();

            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML = `<div class="access-denied"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong. Please try again.</p></div>`;
            }
        });
    };

    async function loadData() {
        const [electionsSnap, studentsSnap] = await Promise.all([
            getDocs(collection(db, 'elections')),
            getDocs(collection(db, 'students'))
        ]);
        let allElections = electionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allStudents = studentsSnap.docs.map(d => ({ docId: d.id, ...d.data() }));

        // Scope filter for non-super admins
        const role = currentAdmin.adminRole;
        const scope = currentAdmin.adminScope || {};
        if (role === 'faculty_admin') {
            allElections = allElections.filter(e => e.scope?.faculty === scope.faculty);
        } else if (role === 'department_admin') {
            allElections = allElections.filter(e => e.type === 'department' && e.scope?.faculty === scope.faculty && e.scope?.department === scope.department);
        }
        elections = allElections;

        if (elections.length) selectedElectionId = elections[0].id;
    }

    function renderPage() {
        document.getElementById('content').innerHTML = `
        <div class="wrap">
            <div class="tab-row">
                <button class="tab-btn ${currentTab === 'results' ? 'active' : ''}" onclick="switchTab('results')"><i class="fa-solid fa-chart-bar"></i> Results</button>
                <button class="tab-btn ${currentTab === 'turnout' ? 'active' : ''}" onclick="switchTab('turnout')"><i class="fa-solid fa-users"></i> Turnout</button>
                <button class="tab-btn ${currentTab === 'students' ? 'active' : ''}" onclick="switchTab('students')"><i class="fa-solid fa-id-card"></i> Register</button>
                <button class="tab-btn ${currentTab === 'audit' ? 'active' : ''}" onclick="switchTab('audit')"><i class="fa-solid fa-shield-halved"></i> Audit</button>
            </div>

            <select id="election-select" onchange="selectElection(this.value)">
                ${elections.length ? elections.map(e => `<option value="${e.id}" ${e.id === selectedElectionId ? 'selected' : ''}>${e.title}</option>`).join('') : '<option value="">No elections available</option>'}
            </select>

            <div id="tab-content"></div>
        </div>`;

        renderTabContent();
    }

    window.switchTab = function(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const idx = ['results','turnout','students','audit'].indexOf(tab);
        document.querySelectorAll('.tab-btn')[idx]?.classList.add('active');
        renderTabContent();
    };

    window.selectElection = function(id) {
        selectedElectionId = id;
        renderTabContent();
    };

    async function renderTabContent() {
        const container = document.getElementById('tab-content');
        container.innerHTML = `<div class="spinner-center"><div class="spinner"></div></div>`;

        if (!selectedElectionId && currentTab !== 'students' && currentTab !== 'audit') {
            container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No elections available.</p></div>`;
            return;
        }

        if (currentTab === 'results') await renderResults(container);
        else if (currentTab === 'turnout') await renderTurnout(container);
        else if (currentTab === 'students') renderStudentRegister(container);
        else if (currentTab === 'audit') await renderAuditLog(container);
    }

    // ── RESULTS REPORT ───────────────────────────────────────────────────────
    async function renderResults(container) {
        const election = elections.find(e => e.id === selectedElectionId);
        if (!election) { container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>Select an election.</p></div>`; return; }

        const [candSnap, counterSnap] = await Promise.all([
            getDocs(query(collection(db, 'candidates'), where('electionId', '==', selectedElectionId))),
            getDoc(doc(db, 'voteCounters', selectedElectionId))
        ]);

        const candidates = candSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const counter = counterSnap.exists() ? counterSnap.data() : { candidateCounts: {}, totalVotesCast: 0 };
        const candidateCounts = counter.candidateCounts || {};
        const totalVotesCast = counter.totalVotesCast || 0;

        const positions = election.positions || [];
        let tableRows = [];

        positions.forEach(pos => {
            const posCandidates = candidates.filter(c => c.position === pos)
                .map(c => ({ ...c, votes: candidateCounts[c.id] || 0 }))
                .sort((a, b) => b.votes - a.votes);

            const posTotal = posCandidates.reduce((s, c) => s + c.votes, 0);
            posCandidates.forEach((c, i) => {
                const pct = posTotal > 0 ? ((c.votes / posTotal) * 100).toFixed(1) : '0.0';
                tableRows.push({ position: pos, name: c.fullName, votes: c.votes, pct, winner: i === 0 && c.votes > 0 });
            });
        });

        container.innerHTML = `
            <div class="print-header"><h2>${election.title}</h2><p>Election Results · Generated ${new Date().toLocaleString('en-GB')}</p></div>
            <div class="section-card">
                <h3><i class="fa-solid fa-chart-bar"></i> Election Results</h3>
                <div class="stats-grid">
                    <div class="stat-box"><div class="val">${totalVotesCast}</div><div class="label">Total Votes</div></div>
                    <div class="stat-box"><div class="val">${positions.length}</div><div class="label">Positions</div></div>
                    <div class="stat-box"><div class="val">${candidates.length}</div><div class="label">Candidates</div></div>
                    <div class="stat-box"><div class="val">${election.status?.toUpperCase()}</div><div class="label">Status</div></div>
                </div>
                <div class="report-table-wrap">
                    <table class="report-table">
                        <thead><tr><th>Position</th><th>Candidate</th><th>Votes</th><th>%</th></tr></thead>
                        <tbody>
                            ${tableRows.map(r => `
                                <tr class="${r.winner ? 'winner-row' : ''}">
                                    <td>${r.position}</td>
                                    <td>${r.name}</td>
                                    <td>${r.votes}</td>
                                    <td>${r.pct}%</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="export-row">
                    <button class="export-btn excel" onclick="exportResultsExcel('${selectedElectionId}')"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="export-btn csv" onclick="exportResultsCSV('${selectedElectionId}')"><i class="fa-solid fa-file-csv"></i> CSV</button>
                    <button class="export-btn print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
                </div>
            </div>`;

        window._resultsData = { election, tableRows, totalVotesCast };
    }

    // ── TURNOUT REPORT ───────────────────────────────────────────────────────
    async function renderTurnout(container) {
        const election = elections.find(e => e.id === selectedElectionId);
        if (!election) { container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>Select an election.</p></div>`; return; }

        const counterSnap = await getDoc(doc(db, 'voteCounters', selectedElectionId));
        const totalVotesCast = counterSnap.exists() ? (counterSnap.data().totalVotesCast || 0) : 0;

        // Eligible voters based on scope
        let eligibleStudents = allStudents;
        if (election.type === 'faculty') eligibleStudents = allStudents.filter(s => s.faculty === election.scope?.faculty);
        if (election.type === 'department') eligibleStudents = allStudents.filter(s => s.faculty === election.scope?.faculty && s.department === election.scope?.department);

        const totalEligible = eligibleStudents.length;
        const turnoutPct = totalEligible > 0 ? ((totalVotesCast / totalEligible) * 100).toFixed(1) : '0.0';

        // Faculty breakdown
        const faculties = [...new Set(eligibleStudents.map(s => s.faculty).filter(Boolean))];

        container.innerHTML = `
            <div class="print-header"><h2>${election.title}</h2><p>Voter Turnout Report · Generated ${new Date().toLocaleString('en-GB')}</p></div>
            <div class="section-card">
                <h3><i class="fa-solid fa-users"></i> Voter Turnout</h3>
                <div class="stats-grid">
                    <div class="stat-box"><div class="val">${totalEligible}</div><div class="label">Eligible Voters</div></div>
                    <div class="stat-box"><div class="val">${totalVotesCast}</div><div class="label">Votes Cast</div></div>
                    <div class="stat-box"><div class="val">${turnoutPct}%</div><div class="label">Turnout</div></div>
                    <div class="stat-box"><div class="val">${totalEligible - totalVotesCast}</div><div class="label">Did Not Vote</div></div>
                </div>

                <div class="turnout-item">
                    <div class="turnout-label"><strong>Overall Turnout</strong><span>${turnoutPct}%</span></div>
                    <div class="progress-track"><div class="progress-fill" style="width:${turnoutPct}%"></div></div>
                </div>

                ${faculties.map(fac => {
                    const facStudents = eligibleStudents.filter(s => s.faculty === fac);
                    const facPct = facStudents.length > 0 ? Math.round((Math.min(totalVotesCast, facStudents.length) / facStudents.length) * 100) : 0;
                    return `<div class="turnout-item">
                        <div class="turnout-label"><span>${fac}</span><span>${facStudents.length} eligible</span></div>
                        <div class="progress-track"><div class="progress-fill" style="width:${facPct}%"></div></div>
                    </div>`;
                }).join('')}

                <div class="export-row">
                    <button class="export-btn excel" onclick="exportTurnoutExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="export-btn print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
                </div>
            </div>`;

        window._turnoutData = { election, totalEligible, totalVotesCast, turnoutPct };
    }

    // ── STUDENT REGISTER ─────────────────────────────────────────────────────
    function renderStudentRegister(container) {
        const role = currentAdmin.adminRole;
        const scope = currentAdmin.adminScope || {};

        let filtered = allStudents;
        if (role === 'faculty_admin') filtered = allStudents.filter(s => s.faculty === scope.faculty);
        if (role === 'department_admin') filtered = allStudents.filter(s => s.faculty === scope.faculty && s.department === scope.department);

        const activated = filtered.filter(s => s.isActivated).length;

        container.innerHTML = `
            <div class="print-header"><h2>Student Register</h2><p>Generated ${new Date().toLocaleString('en-GB')}</p></div>
            <div class="section-card">
                <h3><i class="fa-solid fa-id-card"></i> Student Register (${filtered.length})</h3>
                <div class="stats-grid">
                    <div class="stat-box"><div class="val">${filtered.length}</div><div class="label">Total Students</div></div>
                    <div class="stat-box"><div class="val">${activated}</div><div class="label">Activated</div></div>
                    <div class="stat-box"><div class="val">${filtered.length - activated}</div><div class="label">Not Activated</div></div>
                </div>
                <input placeholder="Filter by name, matric, dept..." oninput="filterStudentTable(this.value,'student-reg-table')">
                <div class="report-table-wrap">
                    <table class="report-table" id="student-reg-table">
                        <thead><tr><th>Matric</th><th>Name</th><th>Faculty</th><th>Dept</th><th>Level</th><th>Activated</th></tr></thead>
                        <tbody>
                            ${filtered.map(s => `
                                <tr>
                                    <td>${s.matricNumber || '-'}</td>
                                    <td>${s.fullName || '-'}</td>
                                    <td>${s.faculty || '-'}</td>
                                    <td>${s.department || '-'}</td>
                                    <td>${s.level || '-'}</td>
                                    <td>${s.isActivated ? '✅' : '⬜'}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="export-row">
                    <button class="export-btn excel" onclick="exportStudentExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="export-btn csv" onclick="exportStudentCSV()"><i class="fa-solid fa-file-csv"></i> CSV</button>
                    <button class="export-btn print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
                </div>
            </div>`;

        window._studentData = filtered;
    }

    window.filterStudentTable = function(value, tableId) {
        const term = value.toLowerCase();
        const rows = document.querySelectorAll(`#${tableId} tbody tr`);
        rows.forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    };

    // ── AUDIT LOG ────────────────────────────────────────────────────────────
    async function renderAuditLog(container) {
        const batchSnap = await getDocs(collection(db, 'importBatches'));
        const batches = batchSnap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.uploadedAt?.toDate?.() || 0) - (a.uploadedAt?.toDate?.() || 0));

        const actionIcons = {
            import: { icon: 'fa-file-import', bg: 'rgba(61,114,180,0.15)', color: 'var(--accent)' },
        };

        let html = `
            <div class="section-card">
                <h3><i class="fa-solid fa-shield-halved"></i> Import History</h3>
                ${batches.length ? batches.map(b => `
                    <div class="audit-item">
                        <div class="audit-icon" style="background:rgba(61,114,180,0.15);color:var(--accent);"><i class="fa-solid fa-file-import"></i></div>
                        <div class="audit-info">
                            <div class="action">Bulk Import · ${b.fileName || 'Unknown file'}</div>
                            <div class="detail">
                                ${b.imported} imported · ${b.duplicates} duplicates · ${b.errors} errors · by ${b.uploadedBy}
                            </div>
                            <div class="time">${fmt(b.uploadedAt)}</div>
                        </div>
                    </div>`).join('') : `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No import history yet.</p></div>`}
            </div>

            <div class="section-card">
                <h3><i class="fa-solid fa-list-check"></i> Election Activity</h3>
                ${elections.map(e => `
                    <div class="audit-item">
                        <div class="audit-icon" style="background:rgba(34,197,94,0.12);color:var(--success);"><i class="fa-solid fa-square-poll-vertical"></i></div>
                        <div class="audit-info">
                            <div class="action">${e.title}</div>
                            <div class="detail">
                                Status: ${e.status?.toUpperCase()} · Type: ${e.type} · Created by ${e.createdBy}
                            </div>
                            <div class="time">Created ${fmt(e.createdAt)} · Ends ${fmt(e.endDate)}</div>
                        </div>
                    </div>`).join('') || `<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No elections yet.</p></div>`}
            </div>`;

        container.innerHTML = html;
    }

    // ── EXPORT FUNCTIONS ─────────────────────────────────────────────────────
    window.exportResultsExcel = function() {
        if (!window._resultsData) return;
        const { election, tableRows, totalVotesCast } = window._resultsData;
        const data = [
            ['Election', election.title],
            ['Status', election.status],
            ['Total Votes Cast', totalVotesCast],
            ['Generated', new Date().toLocaleString('en-GB')],
            [],
            ['Position', 'Candidate', 'Votes', 'Percentage', 'Winner']
        ];
        tableRows.forEach(r => data.push([r.position, r.name, r.votes, r.pct + '%', r.winner ? 'YES' : '']));

        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Results');
        XLSX.writeFile(wb, `${election.title.replace(/\s+/g,'_')}_results.xlsx`);
    };

    window.exportResultsCSV = function() {
        if (!window._resultsData) return;
        const { election, tableRows } = window._resultsData;
        let csv = 'Position,Candidate,Votes,Percentage,Winner\n';
        tableRows.forEach(r => csv += `"${r.position}","${r.name}",${r.votes},${r.pct}%,${r.winner ? 'YES' : ''}\n`);
        downloadText(csv, `${election.title.replace(/\s+/g,'_')}_results.csv`, 'text/csv');
    };

    window.exportTurnoutExcel = function() {
        if (!window._turnoutData) return;
        const { election, totalEligible, totalVotesCast, turnoutPct } = window._turnoutData;
        const data = [
            ['Election', election.title],
            ['Eligible Voters', totalEligible],
            ['Votes Cast', totalVotesCast],
            ['Turnout', turnoutPct + '%'],
            ['Did Not Vote', totalEligible - totalVotesCast],
            ['Generated', new Date().toLocaleString('en-GB')]
        ];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Turnout');
        XLSX.writeFile(wb, `${election.title.replace(/\s+/g,'_')}_turnout.xlsx`);
    };

    window.exportStudentExcel = function() {
        if (!window._studentData) return;
        const data = [['Matric Number','Full Name','Faculty','Department','Level','Activated']];
        window._studentData.forEach(s => data.push([s.matricNumber||'',s.fullName||'',s.faculty||'',s.department||'',s.level||'',s.isActivated?'Yes':'No']));
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Students');
        XLSX.writeFile(wb, `student_register_${Date.now()}.xlsx`);
    };

    window.exportStudentCSV = function() {
        if (!window._studentData) return;
        let csv = 'Matric Number,Full Name,Faculty,Department,Level,Activated\n';
        window._studentData.forEach(s => csv += `"${s.matricNumber||''}","${s.fullName||''}","${s.faculty||''}","${s.department||''}","${s.level||''}","${s.isActivated?'Yes':'No'}"\n`);
        downloadText(csv, `student_register_${Date.now()}.csv`, 'text/csv');
    };

    function downloadText(content, filename, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }
</script>
</body>
</html>
