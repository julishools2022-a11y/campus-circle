<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>

    <div class="card">
        <h2>New Password</h2>
        <p style="color:#64748b; font-size:14px;">Enter a secure password for your account.</p>
        
        <input type="password" id="new-pass" placeholder="New Password">
        <button onclick="updatePassword()" id="btn">Update Password</button>
    </div>

    <script>
        const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function updatePassword() {
            const newPass = document.getElementById('new-pass').value;
            const btn = document.getElementById('btn');

            if(newPass.length < 6) return alert("Password must be at least 6 characters.");

            btn.disabled = true;
            btn.textContent = "Updating...";

            const { error } = await _supabase.auth.updateUser({ password: newPass });

            if (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.textContent = "Try Again";
            } else {
                alert("Success! Password changed.");
                window.location.href = "sign up.html";
            }
        }
    </script>
</body>
</html>
