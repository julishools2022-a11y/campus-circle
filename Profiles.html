<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>My Profile | Campus Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <style>
        :root {
            --bg: #0a1628;
            --surface: #112236;
            --surface2: #1a2f4a;
            --surface3: #0f1e35;
            --border: rgba(61,114,180,0.2);
            --primary: #3d72b4;
            --primary-bright: #5b9bd5;
            --accent: #64b5f6;
            --text: #e2eaf4;
            --text-muted: #7a9cc0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 50px; }

        /* HEADER */
        .header { background: var(--surface); padding: 14px 18px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; border-bottom: 1px solid var(--border); gap: 14px; }
        .back-btn { color: var(--text-muted); font-size: 1.1rem; text-decoration: none; }
        .header-title { font-size: 1.1rem; font-weight: 800; color: var(--text); }

        /* PROFILE HERO */
        .profile-hero {
            background: linear-gradient(135deg, #0d1f3c 0%, #1a3259 50%, #0f2444 100%);
            border-bottom: 1px solid var(--border);
            padding: 32px 20px 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .profile-hero::before {
            content: '';
            position: absolute;
            top: -40px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(61,114,180,0.2) 0%, transparent 70%);
            pointer-events: none;
        }
        .avatar {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-bright));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: white;
            margin: 0 auto 14px;
            box-shadow: 0 8px 25px rgba(61,114,180,0.4);
            position: relative; z-index: 1;
        }
        .user-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 5px; position: relative; z-index: 1; }
        .user-email { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 14px; position: relative; z-index: 1; }
        .user-badge {
            background: rgba(61,114,180,0.2);
            border: 1px solid rgba(61,114,180,0.4);
            color: var(--accent);
            padding: 5px 14px; border-radius: 20px;
            font-size: 0.82rem; font-weight: 700;
            display: inline-block; position: relative; z-index: 1;
        }
        .user-badge.admin { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: var(--warning); }

        /* TABS */
        .tabs-wrapper { padding: 0 16px; background: var(--bg); position: relative; margin-top: -20px; z-index: 10; }
        .tabs-container {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            gap: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .tab-btn {
            flex: 1; text-align: center; padding: 11px 5px;
            font-weight: 700; color: var(--text-muted);
            cursor: pointer; border-radius: 10px;
            transition: all 0.2s; font-size: 0.88rem;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-bright)); color: white; box-shadow: 0 4px 12px rgba(61,114,180,0.3); }
        .tab-btn i { font-size: 0.85rem; }

        .tab-content { display: none; padding: 16px; animation: fadeIn 0.25s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* SECTION TITLE */
        .section-title { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

        /* LIBRARY */
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; }
        .book-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px; text-align: center;
            display: flex; flex-direction: column;
            transition: border-color 0.2s;
        }
        .book-card:hover { border-color: rgba(61,114,180,0.5); }
        .book-icon { font-size: 2.2rem; color: var(--danger); margin-bottom: 10px; }
        .book-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; color: var(--text); }
        .btn-read { background: linear-gradient(135deg, #059669, var(--success)); color: white; border: none; padding: 10px; border-radius: 9px; font-weight: 700; width: 100%; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 0.85rem; }
        .btn-read:active { transform: scale(0.97); }

        /* NOTIFICATIONS */
        .notif-list { display: flex; flex-direction: column; gap: 10px; }
        .notif-card {
            background: var(--surface); border-left: 3px solid var(--primary);
            border: 1px solid var(--border); border-left-width: 3px;
            padding: 14px; border-radius: 12px;
        }
        .notif-card.commission { border-left-color: var(--success); }
        .notif-card.purchase { border-left-color: var(--success); }
        .notif-card.new-material { border-left-color: #8b5cf6; }
        .notif-header { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; color: var(--text); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .notif-time { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; flex-shrink: 0; }
        .notif-body { font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; }

        /* SETTINGS */
        .settings-menu { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .menu-item {
            padding: 17px 18px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 600; cursor: pointer; transition: background 0.15s;
            color: var(--text); text-decoration: none; font-size: 0.93rem;
        }
        .menu-item:hover { background: var(--surface2); }
        .menu-item:last-child { border-bottom: none; }
        .menu-item.logout { color: var(--danger); }
        .menu-item .menu-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 0.9rem; }

        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 2.8rem; margin-bottom: 14px; opacity: 0.35; display: block; }
        .empty-state h3 { color: var(--text); margin-bottom: 8px; font-size: 1rem; }
        .empty-state p { font-size: 0.88rem; margin-bottom: 14px; }
        .btn-store { background: linear-gradient(135deg, var(--primary), var(--primary-bright)); color: white; border: none; padding: 11px 22px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.9rem; }

        /* PDF VIEWER */
        .viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #070f1d; flex-direction: column; }
        .viewer-modal.open { display: flex; }
        .viewer-header { padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; color: var(--text); background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 10px; }
        .viewer-header-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
        #view-title { font-weight: 700; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #page-info { font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
        .viewer-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; padding: 6px 0; }
        .viewer-body canvas { display: block; max-width: 100%; margin: 3px auto; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
        img.view-img { max-width: 100%; object-fit: contain; display: block; margin: auto; }
        .btn-close-viewer { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; font-size: 0.88rem; }
        .viewer-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: var(--text); padding: 50px 30px; text-align: center; width: 100%; }
        .viewer-error { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text); padding: 40px 30px; text-align: center; width: 100%; }
        .viewer-error i { font-size: 3rem; color: var(--danger); }
        .viewer-error p { color: var(--text-muted); font-size: 0.9rem; max-width: 280px; margin: 0; }
    </style>
</head>
<body oncontextmenu="return false;">

    <header class="header">
        <a href="resources.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">My Dashboard</div>
    </header>

    <div class="profile-hero">
        <div class="avatar"><i class="fa-regular fa-user"></i></div>
        <div class="user-name" id="display-name">Loading...</div>
        <div class="user-email" id="display-email">...</div>
        <div class="user-badge" id="display-role">Student Account</div>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs-container">
            <div class="tab-btn active" onclick="switchTab('library', this)"><i class="fa-solid fa-book-bookmark"></i> Library</div>
            <div class="tab-btn" onclick="switchTab('notifs', this)"><i class="fa-solid fa-bell"></i> Alerts</div>
            <div class="tab-btn" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i> Settings</div>
        </div>
    </div>

    <!-- LIBRARY TAB -->
    <div id="tab-library" class="tab-content active">
        <div class="section-title">Purchased Materials</div>
        <div class="library-grid" id="my-books-container">
            <div class="empty-state" style="grid-column:1/-1;">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading your library...</p>
            </div>
        </div>
    </div>

    <!-- NOTIFICATIONS TAB -->
    <div id="tab-notifs" class="tab-content">
        <div class="section-title">Inbox & History</div>
        <div class="notif-list" id="notifs-container">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading alerts...</p>
            </div>
        </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content">
        <div class="section-title">Account</div>
        <div class="settings-menu">
            <a href="resources.html" class="menu-item">
                <span style="display:flex;align-items:center;">
                    <span class="menu-icon" style="background:rgba(61,114,180,0.15);color:var(--accent);"><i class="fa-solid fa-store"></i></span>
                    Browse Store
                </span>
                <i class="fa-solid fa-chevron-right" style="color:var(--text-muted);font-size:0.8rem;"></i>
            </a>
            <a href="study-companion.html" class="menu-item">
                <span style="display:flex;align-items:center;">
                    <span class="menu-icon" style="background:rgba(139,92,246,0.15);color:#a78bfa;"><i class="fa-solid fa-robot"></i></span>
                    AI Study Companion
                </span>
                <i class="fa-solid fa-chevron-right" style="color:var(--text-muted);font-size:0.8rem;"></i>
            </a>
            <a href="contact.html" class="menu-item">
                <span style="display:flex;align-items:center;">
                    <span class="menu-icon" style="background:rgba(16,185,129,0.15);color:var(--success);"><i class="fa-solid fa-headset"></i></span>
                    Support & Help
                </span>
                <i class="fa-solid fa-chevron-right" style="color:var(--text-muted);font-size:0.8rem;"></i>
            </a>
            <div class="menu-item logout" onclick="logout()">
                <span style="display:flex;align-items:center;">
                    <span class="menu-icon" style="background:rgba(239,68,68,0.1);color:var(--danger);"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                    Log Out
                </span>
            </div>
        </div>
    </div>

    <!-- PDF VIEWER -->
    <div id="fileViewer" class="viewer-modal">
        <div class="viewer-header">
            <div class="viewer-header-left">
                <span id="view-title">Reading Mode</span>
                <span id="page-info"></span>
            </div>
            <button class="btn-close-viewer" onclick="closeViewer()">✕ Close</button>
        </div>
        <div class="viewer-body" id="viewer-container">
            <div class="viewer-loading"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--accent)"></i><p>Loading...</p></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
        const GEMINI_PROXY_URL = `${supabaseUrl}/functions/v1/gemini-proxy`;
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let currentUser = null;

        async function initProfile() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) return window.location.href = 'index.html';
            currentUser = user;
            document.getElementById('display-email').innerText = user.email;
            document.getElementById('display-name').innerText = user.email.split('@')[0].toUpperCase();
            const { data: adminData } = await _supabase.from('admin_users').select('*').ilike('email', user.email).maybeSingle();
            if (adminData) {
                document.getElementById('display-role').innerText = "⚡ Admin / Course Rep";
                document.getElementById('display-role').classList.add('admin');
            }
            loadMyLibrary();
            loadMyNotifications();
        }

        async function loadMyLibrary() {
            const container = document.getElementById('my-books-container');
            const { data: transactions, error } = await _supabase.from('transactions').select('resource_id').eq('buyer_id', currentUser.id);
            if (error || !transactions || transactions.length === 0) {
                container.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-folder-open"></i><h3>Library is empty</h3><p>Books you purchase will appear here.</p><button class="btn-store" onclick="window.location.href='resources.html'">Go to Store</button></div>`;
                return;
            }
            const resourceIds = transactions.map(t => t.resource_id);
            const { data: books } = await _supabase.from('academic_resources').select('*').in('id', resourceIds);
            if (books?.length > 0) {
                container.innerHTML = books.map(book => {
                    const isImg = /\.(jpeg|jpg|png|webp)$/i.test(book.file_url);
                    const fileIcon = isImg ? "fa-camera" : "fa-file-pdf";
                    const safeUrl = encodeURIComponent(book.file_url);
                    const safeTitle = encodeURIComponent(book.title);
                    return `<div class="book-card"><div class="book-icon"><i class="fa-solid ${fileIcon}"></i></div><div class="book-title">${book.title}</div><button class="btn-read" onclick="openReader('${safeUrl}','${safeTitle}')"><i class="fa-solid fa-book-open"></i> Read</button></div>`;
                }).join('');
            } else {
                container.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-folder-open"></i><h3>No books found</h3></div>`;
            }
        }

        async function loadMyNotifications() {
            const container = document.getElementById('notifs-container');
            const { data, error } = await _supabase.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            if (error || !data || data.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-bell-slash"></i><h3>No Alerts Yet</h3><p>Your notifications and receipts will show up here.</p></div>`;
                return;
            }
            container.innerHTML = data.map(n => {
                const dateObj = new Date(n.created_at);
                const msg = n.message || '';
                const titleField = n.title || '';
                let cardClass = 'notif-card';
                let icon = `<i class="fa-solid fa-circle-info" style="color:var(--accent);margin-right:6px;"></i>`;
                let displayTitle = titleField || 'Notification';
                if (msg.includes('Cha-ching') || titleField.includes('Commission') || titleField.includes('Sale')) {
                    cardClass = 'notif-card commission'; icon = `<i class="fa-solid fa-money-bill-wave" style="color:var(--success);margin-right:6px;"></i>`; displayTitle = titleField || 'Commission Earned';
                } else if (msg.includes('Payment successful') || titleField.includes('Purchase')) {
                    cardClass = 'notif-card purchase'; icon = `<i class="fa-solid fa-circle-check" style="color:var(--success);margin-right:6px;"></i>`; displayTitle = titleField || 'Purchase Successful';
                } else if (msg.includes('New material') || titleField.includes('New Material')) {
                    cardClass = 'notif-card new-material'; icon = `<i class="fa-solid fa-book" style="color:#8b5cf6;margin-right:6px;"></i>`; displayTitle = titleField || 'New Material';
                }
                return `<div class="${cardClass}"><div class="notif-header"><span>${icon}${displayTitle}</span><span class="notif-time">${dateObj.toLocaleDateString()}</span></div><div class="notif-body">${msg}</div></div>`;
            }).join('');
        }

        function switchTab(tabId, clickedBtn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            clickedBtn.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function isGoogleDriveUrl(u) { return u && u.includes('drive.google.com'); }
        function extractDriveFileId(u) { let m = u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if (m) return m[1]; m = u.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m) return m[1]; m = u.match(/open\?id=([a-zA-Z0-9_-]+)/); if (m) return m[1]; return null; }
        function getDriveOpenUrl(u) { const id = extractDriveFileId(u); return id ? `https://drive.google.com/file/d/${id}/preview?rm=minimal` : u; }

        async function openReader(encodedUrl, encodedTitle) {
            const url = decodeURIComponent(encodedUrl);
            const title = decodeURIComponent(encodedTitle);
            document.getElementById('view-title').innerText = title;
            document.getElementById('page-info').innerText = '';
            const container = document.getElementById('viewer-container');
            document.getElementById('fileViewer').classList.add('open');
            document.body.style.overflow = 'hidden';

            // Images: show directly
            if (/\.(jpeg|jpg|png|webp|gif)$/i.test(url)) {
                container.innerHTML = `<img class="view-img" src="${url}">`;
                return;
            }

            container.innerHTML = `<div class="viewer-loading"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--accent)"></i><p>Fetching document...</p><p style="font-size:0.8rem;opacity:0.5;margin-top:5px;">Large files may take a moment</p></div>`;

            try {
                const resp = await fetch(GEMINI_PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${supabaseKey}` },
                    body: JSON.stringify({ action: 'fetch_pdf', pdf_url: url })
                });
                if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
                const json = await resp.json();
                if (!json.base64) throw new Error('No PDF data received');

                const binary = atob(json.base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                container.innerHTML = '';
                const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                const totalPages = pdf.numPages;
                document.getElementById('page-info').innerText = `${totalPages} pages`;
                const maxWidth = Math.min(window.innerWidth, 800);
                for (let p = 1; p <= totalPages; p++) {
                    const page = await pdf.getPage(p);
                    const baseVp = page.getViewport({ scale: 1 });
                    const viewport = page.getViewport({ scale: maxWidth / baseVp.width });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    container.appendChild(canvas);
                    document.getElementById('page-info').innerText = `${p}/${totalPages}`;
                }
                document.getElementById('page-info').innerText = `${totalPages} pages`;

            } catch (e) {
                console.error('PDF load error:', e);
                // Google Drive fallback — iframe with iOS timeout fallback
                if (isGoogleDriveUrl(url)) {
                    const fileId = extractDriveFileId(url);
                    const embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                    const openUrl = `https://drive.google.com/file/d/${fileId}/preview?rm=minimal`;
                    container.style.padding = "0";
                    container.style.position = "relative";
                    container.innerHTML = `
                        <iframe
                            id="drive-iframe"
                            src="${embedUrl}"
                            style="width:100%;height:100%;min-height:80vh;border:none;display:block;"
                            allow="autoplay"
                            sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
                        </iframe>
                        <div id="iframe-fallback" style="display:none;position:absolute;inset:0;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px 30px;">
                            <i class="fa-brands fa-google-drive" style="font-size:3.5rem;color:var(--accent);"></i>
                            <h3 style="margin:0;color:var(--text);">Open to Read</h3>
                            <p style="color:var(--text-muted);font-size:0.9rem;max-width:260px;">Your browser blocked the inline viewer. Tap below to read — it opens inside this tab.</p>
                            <a href="${openUrl}" target="_blank" style="background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;padding:14px 28px;border-radius:12px;font-weight:700;font-size:1rem;text-decoration:none;display:flex;align-items:center;gap:8px;">
                                <i class="fa-solid fa-book-open"></i> Read Material
                            </a>
                            <button onclick="closeViewer()" style="background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);padding:10px 22px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;">Close</button>
                        </div>`;

                    // Detect iframe block — if it fails to load within 6s show fallback button
                    let iframeLoaded = false;
                    const iframeEl = document.getElementById("drive-iframe");
                    iframeEl.onload = () => { iframeLoaded = true; };
                    setTimeout(() => {
                        if (!iframeLoaded) {
                            const fallback = document.getElementById("iframe-fallback");
                            if (fallback) { fallback.style.display = "flex"; }
                        }
                    }, 6000);
                } else {
                    container.innerHTML = `
                        <div class="viewer-error">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <h3 style="margin:0;">Could not load document</h3>
                            <p>${e.message || 'Please try again'}</p>
                            <button class="btn-close-viewer" style="margin-top:15px;" onclick="closeViewer()">Close</button>
                        </div>`;
                }
            }
        }

        function closeViewer() { document.getElementById('fileViewer').classList.remove('open'); document.getElementById('viewer-container').innerHTML = ''; document.getElementById('page-info').innerText = ''; document.body.style.overflow = ''; }

        async function logout() {
            if (confirm("Are you sure you want to log out?")) { await _supabase.auth.signOut(); window.location.href = 'index.html'; }
        }

        initProfile();
    </script>
</body>
</html>
