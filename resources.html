<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Library | Campus Circle</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-dark: #4338ca;
            --bg: #f8fafc; 
            --text: #1e293b; 
            --text-light: #64748b;
            --surface: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }

        .container { max-width: 600px; margin: 0 auto; padding-bottom: 80px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { text-decoration: none; color: var(--text); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        /* SEARCH */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 1rem; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }

        /* CATEGORIES */
        .cats { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .cat-btn { white-space: nowrap; padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: white; color: var(--text-light); font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* RESOURCE LIST */
        #resource-list { display: flex; flex-direction: column; gap: 15px; }
        
        .resource-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s; }
        .resource-card:active { transform: scale(0.98); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .file-icon { width: 45px; height: 45px; border-radius: 10px; background: #e0e7ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .card-info { flex: 1; margin-left: 15px; }
        .card-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 0.85rem; color: var(--text-light); }
        
        /* ACTION BUTTONS */
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-ai { flex: 1; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; text-decoration: none; }
        .btn-dl { width: 40px; background: #f1f5f9; color: var(--text); border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }

        /* FLOATING UPLOAD BTN */
        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4); text-decoration: none; transition: transform 0.2s; z-index: 100; }
        .fab:active { transform: scale(0.9); }

        /* LOADING */
        .skeleton { height: 100px; background: #e2e8f0; border-radius: 16px; margin-bottom: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        
        #empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i></a>
        <h2>Library</h2>
        <div style="width:40px;"></div> </div>

    <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="search" placeholder="Search textbooks, handouts..." onkeyup="filterResources()">
    </div>

    <div class="cats">
        <button class="cat-btn active" onclick="filterCat('all', this)">All</button>
        <button class="cat-btn" onclick="filterCat('100L', this)">100L</button>
        <button class="cat-btn" onclick="filterCat('200L', this)">200L</button>
        <button class="cat-btn" onclick="filterCat('300L', this)">300L</button>
        <button class="cat-btn" onclick="filterCat('400L', this)">400L</button>
    </div>

    <br>

    <div id="loading-area">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <div id="resource-list"></div>
    
    <div id="empty-state">
        <i class="fa-solid fa-folder-open" style="font-size:3rem; margin-bottom:10px; opacity:0.5;"></i>
        <p>No materials found here yet.</p>
    </div>
</div>

<a href="upload-material.html" class="fab"><i class="fa-solid fa-plus"></i></a>

<script>
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allResources = [];

    // 1. Fetch Data
    async function fetchResources() {
        try {
            const { data, error } = await _supabase
                .from('academic_resources')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;
            allResources = data;
            renderList(data);
        } catch (err) {
            console.error(err);
            alert("Error loading resources");
        } finally {
            document.getElementById('loading-area').style.display = 'none';
        }
    }

    // 2. Render List
    function renderList(items) {
        const list = document.getElementById('resource-list');
        const empty = document.getElementById('empty-state');
        list.innerHTML = '';

        if (items.length === 0) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        items.forEach(item => {
            const priceTag = item.softcopy_price > 0 ? `₦${item.softcopy_price}` : 'Free';
            
            // AI Link Construction
            const aiLink = `ai-study.html?url=${encodeURIComponent(item.file_url)}&title=${encodeURIComponent(item.title)}`;

            list.innerHTML += `
                <div class="resource-card">
                    <div class="card-top">
                        <div class="file-icon"><i class="fa-solid fa-file-pdf"></i></div>
                        <div class="card-info">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">
                                <span>${item.level}</span> • <span>${priceTag}</span>
                            </div>
                        </div>
                    </div>
                    <div class="actions">
                        <a href="${aiLink}" class="btn-ai">
                            <i class="fa-solid fa-robot"></i> Study with AI
                        </a>
                        <a href="${item.file_url}" target="_blank" class="btn-dl">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    </div>
                </div>
            `;
        });
    }

    // 3. Filters
    window.filterCat = (level, btn) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (level === 'all') {
            renderList(allResources);
        } else {
            const filtered = allResources.filter(r => r.level === level);
            renderList(filtered);
        }
    };

    window.filterResources = () => {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = allResources.filter(r => 
            r.title.toLowerCase().includes(query) || 
            (r.description && r.description.toLowerCase().includes(query))
        );
        renderList(filtered);
    };

    fetchResources();
</script>

</body>
    </html>
