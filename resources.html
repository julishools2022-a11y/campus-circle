<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Study Partner | Campus Circle</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; --chat-user: #4f46e5; --chat-ai: #e2e8f0; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* HEADER */
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        .back-btn { text-decoration: none; color: var(--text); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin: 0; font-size: 1.4rem; color: var(--primary); }

        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-weight: 600; color: #64748b; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* SECTIONS */
        #setup-box, #quiz-container, #flashcard-section, #chat-section { display: none; }
        
        /* SETUP BOX */
        #setup-box { background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        select { padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; width: 100%; margin: 15px 0; font-size: 1rem; background: #f8fafc; }
        
        /* LOADING */
        #loading-box { text-align: center; padding: 60px 20px; background: white; border-radius: 20px; display: none; }
        .spinner { font-size: 40px; color: var(--primary); animation: spin 1s infinite linear; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* QUIZ */
        .score-board { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; font-weight: 700; position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .quiz-card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #f1f5f9; scroll-margin-top: 80px; }
        .option { display: block; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 8px; cursor: pointer; transition: 0.2s; }
        .option:hover { background: #f1f5f9; }
        .option.correct { background: #dcfce7; border-color: #22c55e; color: #166534; pointer-events: none; }
        .option.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; opacity: 0.7; pointer-events: none; }
        .answered { pointer-events: none; }

        /* EXPLANATION BOX */
        .explanation { 
            display: none; 
            margin-top: 15px; 
            padding: 15px; 
            background: #f0f9ff; 
            border-left: 4px solid #0ea5e9; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            color: #0c4a6e; 
            line-height: 1.5;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }

        /* FLASHCARDS */
        .flashcard-container { height: 300px; cursor: pointer; perspective: 1000px; margin-bottom: 20px; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; border-radius: 20px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1); }
        .front { background: white; border: 2px solid var(--primary); }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }
        .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

        /* CHAT BOT */
        #chat-section { height: 60vh; display: flex; flex-direction: column; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .chat-history { flex: 1; overflow-y: auto; padding: 20px; background: #f8fafc; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; line-height: 1.5; font-size: 0.95rem; }
        .msg.user { background: var(--chat-user); color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 2px; }
        .msg.ai { background: var(--chat-ai); color: var(--text); align-self: flex-start; margin-right: auto; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        #chat-input { flex: 1; padding: 12px; border: 1px solid #e2e8f0; border-radius: 25px; background: #f8fafc; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* BTNS & UPLOAD */
        .action-btn { background: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 10px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .action-btn:active { transform: scale(0.98); }
        .secondary-btn { background: white; border: 1px solid #e2e8f0; color: var(--text); padding: 10px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #upload-box { display: none; text-align: center; padding: 40px; background: white; border-radius: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="resources.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
            <h2>AI Study Partner</h2>
            <span id="doc-title" style="font-size:0.9rem; color:#64748b;">Initializing...</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')"><i class="fa-solid fa-circle-question"></i> Quiz</button>
        <button class="tab-btn" onclick="switchTab('flashcard')"><i class="fa-solid fa-layer-group"></i> Flashcards</button>
        <button class="tab-btn" onclick="switchTab('chat')"><i class="fa-solid fa-robot"></i> Ask AI</button>
    </div>

    <div id="loading-box">
        <i class="fa-solid fa-circle-notch spinner"></i>
        <h3 id="loading-text" style="margin:0;">Reading PDF...</h3>
    </div>

    <div id="setup-box">
        <i class="fa-solid fa-sliders" style="font-size:3rem; color:var(--primary); margin-bottom:15px;"></i>
        <h3>Quiz Settings</h3>
        <p style="color:#64748b;">How many questions do you want?</p>
        
        <label style="text-align:left; display:block; font-weight:600; margin-bottom:5px;">Number of Questions</label>
        <select id="q-count">
            <option value="5">5 Questions (Quick)</option>
            <option value="10">10 Questions</option>
            <option value="20" selected>20 Questions</option>
            <option value="30">30 Questions</option>
            <option value="40">40 Questions</option>
            <option value="50">50 Questions (Intense)</option>
        </select>

        <button class="action-btn" onclick="startQuizGen()">GENERATE QUIZ</button>
    </div>

    <div id="quiz-container">
        <div class="score-board">
            <span>Score: <span id="current-score">0</span></span>
            <span id="total-q">/ 0</span>
        </div>
        <div id="quiz-list"></div>
        <div style="text-align:center; margin-top:20px; color:#64748b; font-size:0.9rem;">
            End of Quiz
        </div>
    </div>

    <div id="flashcard-section">
        <div class="flashcard-container" onclick="toggleFlip()">
            <div class="flashcard" id="active-card">
                <div class="front">
                    <small>QUESTION</small>
                    <h3 id="fc-front">Loading...</h3>
                    <small style="margin-top:auto;">Tap to flip</small>
                </div>
                <div class="back">
                    <small>ANSWER</small>
                    <h3 id="fc-back">...</h3>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="secondary-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
            <span id="fc-count" style="align-self:center; font-weight:700;">1/15</span>
            <button class="secondary-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <button class="action-btn" style="margin-top:15px; background:#64748b;" onclick="regenerateFlashcardsOnly()">
            <i class="fa-solid fa-rotate"></i> Regenerate New Cards
        </button>
    </div>

    <div id="chat-section">
        <div class="chat-history" id="chat-history">
            <div class="msg ai">Hello! I've read your document. Ask me anything about it! 🤖</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="upload-box">
        <i class="fa-solid fa-file-pdf" style="font-size:3rem; color:var(--primary); margin-bottom:15px;"></i>
        <h3>Upload PDF Manually</h3>
        <input type="file" id="manual-file" accept="application/pdf" onchange="handleManualUpload(this)" style="display:none">
        <button onclick="document.getElementById('manual-file').click()" class="action-btn" style="margin-top:10px;">
            Choose PDF File
        </button>
    </div>
</div>

<script>
    // --- 1. CORE FUNCTIONS ---

    function switchTab(mode) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const buttons = document.querySelectorAll('.tab-btn');
        if(mode === 'quiz') buttons[0].classList.add('active');
        if(mode === 'flashcard') buttons[1].classList.add('active');
        if(mode === 'chat') buttons[2].classList.add('active');
        
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('flashcard-section').style.display = 'none';
        document.getElementById('chat-section').style.display = 'none';
        
        const setupVisible = document.getElementById('setup-box').style.display === 'block';
        const loadingVisible = document.getElementById('loading-box').style.display === 'block';
        const uploadVisible = document.getElementById('upload-box').style.display === 'block';
        
        if(!setupVisible && !loadingVisible && !uploadVisible) {
            if (mode === 'quiz') document.getElementById('quiz-container').style.display = 'block';
            if (mode === 'flashcard') document.getElementById('flashcard-section').style.display = 'block';
            if (mode === 'chat') document.getElementById('chat-section').style.display = 'flex';
        }
    }

    // --- 2. CONFIG ---
    const API_KEY = "AIzaSyAcd64om0cgKpCVQaKigE7ShwkakWoXHNM"; 
    
    // ✅ CHANGED: Gemini 3 Preview (or 2.0 experimental) prioritized
    const AI_MODELS = [
        "gemini-3-flash-preview", 
        "gemini-2.0-flash-exp", 
        "gemini-1.5-pro",
        "gemini-1.5-flash",
        "gemini-pro"
    ];

    let pdfText = "";
    let quizData = [];
    let flashcardData = [];
    let currentCardIndex = 0;
    let score = 0;

    // --- 3. INIT ---
    window.onload = async () => {
        switchTab('quiz'); 
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('url');
        const title = params.get('title');
        
        if(title) document.getElementById('doc-title').innerText = title;

        if(fileUrl) {
            if (fileUrl.toLowerCase().includes('.doc')) {
                alert("⚠️ Word Docs not supported. Use PDF.");
                document.getElementById('upload-box').style.display = 'block';
                return;
            }
            document.getElementById('loading-box').style.display = 'block';
            await extractTextFromURL(fileUrl);
        } else {
            document.getElementById('doc-title').innerText = "Upload PDF";
            document.getElementById('upload-box').style.display = 'block';
        }
    };

    // --- 4. PDF PROCESSING ---
    async function extractTextFromURL(url) {
        try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Proxy failed");
            
            const blob = await response.blob();
            const arrayBuffer = await blob.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            await processPDF(pdf);
        } catch (error) {
            console.error(error);
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('upload-box').style.display = 'block';
        }
    }

    window.handleManualUpload = async (input) => {
        const file = input.files[0];
        if(!file) return;
        document.getElementById('upload-box').style.display = 'none';
        document.getElementById('loading-box').style.display = 'block';
        const reader = new FileReader();
        reader.onload = async function(e) {
            const typedarray = new Uint8Array(e.target.result);
            const loadingTask = pdfjsLib.getDocument(typedarray);
            const pdf = await loadingTask.promise;
            await processPDF(pdf);
        };
        reader.readAsArrayBuffer(file);
    };

    async function processPDF(pdf) {
        let fullText = "";
        const maxPages = Math.min(pdf.numPages, 15);
        for (let i = 1; i <= maxPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            fullText += textContent.items.map(item => item.str).join(" ") + "\n";
        }
        pdfText = fullText;
        document.getElementById('loading-box').style.display = 'none';
        document.getElementById('setup-box').style.display = 'block';
    }

    // --- 5. QUIZ GENERATION ---
    window.startQuizGen = async function() {
        const count = document.getElementById('q-count').value;
        document.getElementById('setup-box').style.display = 'none';
        document.getElementById('loading-box').style.display = 'block';
        document.getElementById('loading-text').innerText = `Generating ${count} Questions...`;
        
        await tryGenerateQuiz(0, count);
    }

    async function tryGenerateQuiz(modelIndex, count) {
        if (modelIndex >= AI_MODELS.length) {
            alert("AI is busy right now. Please try a lower question count.");
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('setup-box').style.display = 'block';
            return;
        }
        const model = AI_MODELS[modelIndex];
        
        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Analyze text. Return valid JSON ONLY.
                                Format: { 
                                    "quiz": [{"q":"Question string","options":["A","B","C","D"],"a":"Correct Answer String", "explanation":"Why this is correct"}], 
                                    "flashcards": [{"front":"Term","back":"Definition"}] 
                                }
                                Generate exactly ${count} quiz questions and 15 flashcards.
                                Text: ${pdfText.substring(0, 15000)}`
                            }]
                        }]
                    })
                }
            );
            if (!response.ok) throw new Error("API Error");

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
            const parsed = JSON.parse(text);

            quizData = parsed.quiz;
            flashcardData = parsed.flashcards;

            renderQuiz();
            setupFlashcards();
            
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';

        } catch (error) {
            console.log(`Model ${model} failed, trying next...`);
            await tryGenerateQuiz(modelIndex + 1, count);
        }
    }

    // --- 6. RENDERERS ---
    function renderQuiz() {
        score = 0;
        document.getElementById('current-score').innerText = score;
        document.getElementById('total-q').innerText = `/ ${quizData.length}`;
        
        const container = document.getElementById('quiz-list');
        container.innerHTML = "";

        quizData.forEach((q, i) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `q-${i}`;
            
            // Question Title
            const qTitle = document.createElement('div');
            qTitle.className = 'question';
            qTitle.innerText = `${i + 1}. ${q.q}`;
            card.appendChild(qTitle);

            // Options
            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn, opt, q.a);
                card.appendChild(btn);
            });

            // Explanation (Hidden initially)
            const expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            expDiv.innerHTML = `<strong><i class="fa-solid fa-lightbulb"></i> Explanation:</strong><br>${q.explanation || "No explanation provided."}`;
            expDiv.id = `exp-${i}`;
            card.appendChild(expDiv);

            container.appendChild(card);
        });
    }

    window.checkAnswer = (index, el, sel, cor) => {
        const card = document.getElementById(`q-${index}`);
        if(card.classList.contains('answered')) return; 
        
        card.classList.add('answered');
        
        if(sel === cor) {
            el.classList.add('correct');
            score++;
            document.getElementById('current-score').innerText = score;
        } else {
            el.classList.add('wrong');
            // Find correct
            const options = card.querySelectorAll('.option');
            options.forEach(opt => {
                if(opt.innerText === cor) opt.classList.add('correct');
            });
        }

        // Show Explanation
        document.getElementById(`exp-${index}`).style.display = 'block';
    };

    // --- 7. FLASHCARD REGENERATION ---
    window.regenerateFlashcardsOnly = async function() {
        const btn = document.querySelector('#flashcard-section .action-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating...`;
        btn.disabled = true;

        try {
            // Using standard model for quick regen
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Generate 15 NEW and DIFFERENT flashcards from this text in JSON format: { "flashcards": [{"front":"T","back":"D"}] }. Text: ${pdfText.substring(0, 15000)}`
                            }]
                        }]
                    })
                }
            );
            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
            const parsed = JSON.parse(text);

            flashcardData = parsed.flashcards;
            currentCardIndex = 0;
            updateCard();
            alert("New flashcards generated!");

        } catch (error) {
            alert("Failed to regenerate. Try again.");
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    function setupFlashcards() { if(flashcardData.length > 0) updateCard(); }
    
    function updateCard() {
        const card = flashcardData[currentCardIndex];
        document.getElementById('fc-front').innerText = card.front;
        document.getElementById('fc-back').innerText = card.back;
        document.getElementById('fc-count').innerText = `${currentCardIndex + 1}/${flashcardData.length}`;
        document.getElementById('active-card').classList.remove('flipped');
    }
    window.toggleFlip = () => document.getElementById('active-card').classList.toggle('flipped');
    window.nextCard = () => { if(currentCardIndex < flashcardData.length-1) { currentCardIndex++; updateCard(); } };
    window.prevCard = () => { if(currentCardIndex > 0) { currentCardIndex--; updateCard(); } };

    // --- 8. CHAT ---
    window.sendMessage = async function() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        const history = document.getElementById('chat-history');
        history.innerHTML += `<div class="msg user">${msg}</div>`;
        input.value = "";
        history.scrollTop = history.scrollHeight;

        const loadingId = "loading-" + Date.now();
        history.innerHTML += `<div class="msg ai" id="${loadingId}">Thinking...</div>`;

        // Start fallback chain
        await tryChat(0, msg, loadingId);
        history.scrollTop = history.scrollHeight;
    }

    async function tryChat(modelIndex, msg, loadingId) {
        if (modelIndex >= AI_MODELS.length) {
            document.getElementById(loadingId).innerText = "Error: AI is unavailable.";
            return;
        }
        const model = AI_MODELS[modelIndex];

        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are a helpful tutor. Answer this question strictly based on the provided text.
                                Context: ${pdfText.substring(0, 15000)}
                                
                                Question: ${msg}`
                            }]
                        }]
                    })
                }
            );
            
            if (!response.ok) throw new Error("API Error");

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            document.getElementById(loadingId).innerHTML = marked.parse(aiText);

        } catch (error) {
            console.warn(`Chat model ${model} failed, trying next...`);
            await tryChat(modelIndex + 1, msg, loadingId);
        }
    }
</script>

</body>
</html>
