<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Library | Campus Circle</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #4f46e5; 
            --bg: #f8fafc; 
            --text: #1e293b; 
            --text-light: #64748b;
            --surface: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 80px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { text-decoration: none; color: var(--text); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        /* SMART FILTERS */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-select { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: white; font-family: inherit; font-size: 0.9rem; color: var(--text); outline: none; }

        /* SEARCH & CATS */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 1rem; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }

        .cats { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .cat-btn { white-space: nowrap; padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: white; color: var(--text-light); font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* RESOURCE CARD */
        #resource-list { display: flex; flex-direction: column; gap: 15px; }
        .resource-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 15px; transition: transform 0.2s; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .file-icon { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .icon-pdf { background: #fee2e2; color: #ef4444; } 
        .icon-img { background: #e0e7ff; color: #4f46e5; }

        .card-info { flex: 1; margin-left: 15px; }
        .card-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 0.85rem; color: var(--text-light); }
        
        /* ACTIONS */
        .actions { display: flex; gap: 10px; }
        .btn-ai { flex: 1; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; text-decoration: none; transition: 0.2s; }
        .btn-view { width: 50px; background: #f1f5f9; color: var(--text); border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; text-decoration: none; transition: 0.2s; }
        
        .btn-free { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }
        .btn-paid { background: #10b981; color: white; width: 100%; } 
        .btn-admin { background: #f59e0b; color: white; } 

        .btn-ai:active, .btn-view:active { transform: scale(0.95); }

        /* UPLOAD BTN */
        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4); text-decoration: none; z-index: 100; }
        
        /* LOADING */
        .skeleton { height: 100px; background: #e2e8f0; border-radius: 16px; margin-bottom: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        #empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i></a>
        <h2>Library</h2>
        <div style="width:40px;"></div>
    </div>

    <div class="filter-bar">
        <select id="faculty-select" class="filter-select" onchange="updateDeptOptions()">
            <option value="All">All Faculties</option>
            <option value="Social Sciences">Social Sciences</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
            <option value="Management">Management</option>
        </select>
        
        <select id="dept-select" class="filter-select" onchange="manualFilter()">
            <option value="All">All Departments</option>
        </select>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="search" placeholder="Search textbooks..." onkeyup="manualFilter()">
    </div>

    <div class="cats">
        <button class="cat-btn active" onclick="filterLevel('all', this)">All</button>
        <button class="cat-btn" onclick="filterLevel('100L', this)">100L</button>
        <button class="cat-btn" onclick="filterLevel('200L', this)">200L</button>
        <button class="cat-btn" onclick="filterLevel('300L', this)">300L</button>
        <button class="cat-btn" onclick="filterLevel('400L', this)">400L</button>
    </div>
    <br>

    <div id="loading-area">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <div id="resource-list"></div>
    
    <div id="empty-state">
        <i class="fa-solid fa-folder-open" style="font-size:3rem; margin-bottom:10px; opacity:0.5;"></i>
        <p>No materials found.</p>
    </div>
</div>

<a href="upload-material.html" class="fab" id="admin-upload-btn"><i class="fa-solid fa-plus"></i></a>

<script>
    // --- 1. CONFIGURATION ---
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    
    // ✅ LIVE PAYSTACK PUBLIC KEY
    const PAYSTACK_KEY = 'pk_live_aff4bfc90ebf07a7c006c862bb4fac8223bd35b5'; 

    // Department Mapping
    const depts = {
        "Social Sciences": ["Sociology", "Psychology", "Political Science", "Economics", "Mass Comm"],
        "Science": ["Computer Science", "Microbiology", "Biochemistry"],
        "Arts": ["English", "History", "Philosophy"],
        "Management": ["Accounting", "Business Admin", "Banking & Finance"]
    };

    let allResources = [];
    let currentUserEmail = "";
    let isAdmin = false;
    let currentLevel = 'all';

    // --- 2. AUTH & AUTO-DETECT ---
    async function init() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            currentUserEmail = user.email;
            
            // Check Admin Status from 'admins' table
            const { data: admin } = await _supabase.from('admin_users').select('*').eq('email', user.email).single();
            if (admin) {
                isAdmin = true;
                document.getElementById('admin-upload-btn').style.display = 'flex';
            }

            // Fetch Profile for Auto-Select
            const { data: profile } = await _supabase.from('profiles').select('faculty, department').eq('id', user.id).single();
            
            if (profile) {
                if (profile.faculty) {
                    document.getElementById('faculty-select').value = profile.faculty;
                    updateDeptOptions(); 
                }
                if (profile.department) {
                    document.getElementById('dept-select').value = profile.department;
                }
            }
        }
        fetchResources();
    }

    function updateDeptOptions() {
        const faculty = document.getElementById('faculty-select').value;
        const deptSelect = document.getElementById('dept-select');
        deptSelect.innerHTML = '<option value="All">All Departments</option>';
        
        if (depts[faculty]) {
            depts[faculty].forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.innerText = d;
                deptSelect.appendChild(opt);
            });
        }
        manualFilter();
    }

    // --- 3. FETCH & FILTER ---
    async function fetchResources() {
        try {
            const { data, error } = await _supabase.from('academic_resources').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            allResources = data;
            manualFilter(); 
        } catch (err) { console.error(err); } 
        finally { document.getElementById('loading-area').style.display = 'none'; }
    }

    window.manualFilter = () => {
        const faculty = document.getElementById('faculty-select').value;
        const dept = document.getElementById('dept-select').value;
        const query = document.getElementById('search').value.toLowerCase();

        const filtered = allResources.filter(r => {
            const matchFaculty = faculty === "All" || r.faculty === faculty;
            const matchDept = dept === "All" || r.department === dept;
            const matchLevel = currentLevel === "all" || r.level === currentLevel;
            const matchSearch = r.title.toLowerCase().includes(query);
            
            return matchFaculty && matchDept && matchLevel && matchSearch;
        });

        renderList(filtered);
    };

    window.filterLevel = (level, btn) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLevel = level;
        manualFilter();
    };

    // --- 4. RENDER LIST ---
    function renderList(items) {
        const list = document.getElementById('resource-list');
        list.innerHTML = '';
        document.getElementById('empty-state').style.display = (!items || items.length === 0) ? 'block' : 'none';

        if (!items) return;

        items.forEach((item, index) => {
            const price = parseFloat(item.softcopy_price) || 0;
            const isFree = price === 0;
            const aiLink = `ai-study.html?url=${encodeURIComponent(item.file_url)}&title=${encodeURIComponent(item.title)}`;
            const isImage = item.file_url.match(/\.(jpeg|jpg|gif|png|webp)$/i);
            
            const iconHtml = isImage 
                ? `<div class="file-icon icon-img"><i class="fa-solid fa-camera"></i></div>` 
                : `<div class="file-icon icon-pdf"><i class="fa-solid fa-book"></i></div>`;
            const btnText = isImage ? "Solve with AI" : "Study with AI";
            const btnIcon = isImage ? "fa-brain" : "fa-robot";

            let actionHtml = '';

            if (isAdmin) {
                actionHtml = `
                    <a href="${aiLink}" class="btn-ai btn-admin"><i class="fa-solid fa-user-shield"></i> ${btnText} (Admin)</a>
                    <a href="${item.file_url}" target="_blank" class="btn-view"><i class="fa-solid fa-eye"></i></a>`;
            } else if (isFree) {
                actionHtml = `
                    <a href="${aiLink}" class="btn-ai btn-free"><i class="fa-solid ${btnIcon}"></i> ${btnText}</a>
                    <a href="${item.file_url}" target="_blank" class="btn-view"><i class="fa-solid fa-eye"></i></a>`;
            } else {
                actionHtml = `
                    <button onclick="payToUnlock(${index})" class="btn-ai btn-paid"><i class="fa-solid fa-lock"></i> Unlock ₦${price}</button>`;
            }

            list.innerHTML += `
                <div class="resource-card">
                    <div class="card-top">
                        ${iconHtml}
                        <div class="card-info">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta"><span>${item.level}</span> • <span>${isFree ? 'Free' : '₦' + price}</span></div>
                        </div>
                    </div>
                    <div class="actions">${actionHtml}</div>
                </div>`;
        });
    }

    // --- 5. PAYSTACK ---
    function payToUnlock(index) {
        const item = allResources[index];
        const handler = PaystackPop.setup({
            key: PAYSTACK_KEY,
            email: currentUserEmail || "student@campuscircle.com",
            amount: item.softcopy_price * 100,
            currency: "NGN",
            metadata: { custom_fields: [{ display_name: "Resource", value: item.title }] },
            callback: function(response) {
                const aiLink = `ai-study.html?url=${encodeURIComponent(item.file_url)}&title=${encodeURIComponent(item.title)}`;
                window.location.href = aiLink;
            },
            onClose: function() { alert('Payment cancelled.'); }
        });
        handler.openIframe();
    }

    init();
</script>

</body>
</html>
