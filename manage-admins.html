<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Admins | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}

        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
        .back-btn{color:var(--muted);text-decoration:none;width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0;}
        .header h1{font-size:1.05rem;font-weight:800;}
        .header .subtitle{font-size:0.78rem;color:var(--muted);margin-top:2px;}

        .form-wrap{padding:16px;}
        .section-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
        .section-card h3{font-size:0.9rem;font-weight:800;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;}

        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;}
        .form-group label span{color:var(--danger);}
        input,select{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;}
        input:focus,select:focus{border-color:var(--primary);outline:none;}

        /* SEARCH RESULTS */
        .search-results{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
        .search-result-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;}
        .search-result-item:active{transform:scale(0.98);}
        .search-result-item.selected{border-color:var(--primary);background:rgba(61,114,180,0.1);}
        .search-result-item .info strong{display:block;font-size:0.86rem;}
        .search-result-item .info span{font-size:0.72rem;color:var(--muted);}
        .admin-tag{font-size:0.65rem;font-weight:700;color:var(--accent);background:rgba(61,114,180,0.15);padding:2px 7px;border-radius:5px;}

        /* ROLE GRID */
        .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
        .role-card{background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:0.2s;}
        .role-card.selected{border-color:var(--primary);background:rgba(61,114,180,0.12);}
        .role-card .emoji{font-size:1.4rem;display:block;margin-bottom:4px;}
        .role-card .label{font-size:0.75rem;font-weight:700;color:var(--muted);}
        .role-card.selected .label{color:var(--accent);}
        .role-card .desc{font-size:0.65rem;color:var(--muted);margin-top:2px;}

        #scope-fields-admin{display:none;}
        #scope-fields-admin.show{display:block;}

        .btn-assign{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;font-weight:700;font-size:0.92rem;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 4px 14px rgba(61,114,180,0.3);display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-assign:disabled{opacity:0.5;cursor:not-allowed;}

        /* ADMIN LIST */
        .admin-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
        .admin-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-bright));display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800;color:white;flex-shrink:0;}
        .admin-info{flex:1;}
        .admin-info strong{display:block;font-size:0.88rem;}
        .admin-info span{font-size:0.72rem;color:var(--muted);display:block;margin-top:2px;}
        .role-pill{font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:4px;display:inline-block;}
        .role-super{background:rgba(245,158,11,0.15);color:var(--warning);}
        .role-election{background:rgba(124,58,237,0.15);color:#a78bfa;}
        .role-faculty{background:rgba(61,114,180,0.15);color:var(--accent);}
        .role-department{background:rgba(34,197,94,0.15);color:var(--success);}
        .remove-btn{width:32px;height:32px;border-radius:8px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.1);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

        .empty-state{text-align:center;padding:24px 20px;color:var(--muted);font-size:0.85rem;}

        .access-denied{text-align:center;padding:60px 20px;color:var(--muted);}
        .access-denied i{font-size:2.5rem;opacity:0.3;display:block;margin-bottom:12px;}

        .spinner-center{text-align:center;padding:60px 0;}
        .spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
        @keyframes spin{to{transform:rotate(360deg)}}

        #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:0.85rem;font-weight:600;display:none;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90vw;text-align:center;}
        #toast.error{border-color:rgba(239,68,68,0.4);color:var(--danger);}
        #toast.success{border-color:rgba(34,197,94,0.4);color:var(--success);}
    </style>
</head>
<body>

<div class="header">
    <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1>Manage Admins</h1>
        <div class="subtitle">Assign election, faculty &amp; department admin roles</div>
    </div>
</div>

<div id="content">
    <div class="spinner-center"><div class="spinner"></div></div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentAdmin = null;
    let allStudents = [];
    let selectedStudent = null;
    let selectedRole = 'election_admin';

    const roleLabels = {
        super_admin: '👑 Super Admin',
        election_admin: '🗳️ Election Admin',
        faculty_admin: '🎓 Faculty Admin',
        department_admin: '📚 Department Admin'
    };
    const roleClass = {
        super_admin: 'role-super',
        election_admin: 'role-election',
        faculty_admin: 'role-faculty',
        department_admin: 'role-department'
    };

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = type; t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    window.onload = () => {
        const matric = sessionStorage.getItem('voterMatric');
        if (!matric) { window.location.href = 'evoting-login.html'; return; }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'evoting-login.html'; return; }

            try {
                const studentRef = doc(db, 'students', matric);
                const studentSnap = await getDoc(studentRef);
                if (!studentSnap.exists() || studentSnap.data().authUid !== user.uid) {
                    window.location.href = 'evoting-login.html'; return;
                }

                const admin = studentSnap.data();
                currentAdmin = { matric, ...admin };

                // Only super_admin and election_admin can manage admins
                if (!admin.isAdmin || !['super_admin', 'election_admin'].includes(admin.adminRole)) {
                    document.getElementById('content').innerHTML = `
                        <div class="access-denied">
                            <i class="fa-solid fa-lock"></i>
                            <h3 style="color:var(--text);margin-bottom:6px;">Access Restricted</h3>
                            <p>Only Super Admins and Election Admins can manage admin roles.</p>
                        </div>`;
                    return;
                }

                await loadStudents();
                renderPage();

            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML = `<div class="access-denied"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong. Please try again.</p></div>`;
            }
        });
    };

    async function loadStudents() {
        const snap = await getDocs(collection(db, 'students'));
        allStudents = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    }

    function renderPage() {
        // election_admin can only assign faculty_admin / department_admin (not super or election admin roles)
        const isSuper = currentAdmin.adminRole === 'super_admin';
        const assignableRoles = isSuper
            ? ['election_admin', 'faculty_admin', 'department_admin']
            : ['faculty_admin', 'department_admin'];

        const currentAdmins = allStudents.filter(s => s.isAdmin);

        document.getElementById('content').innerHTML = `
        <div class="form-wrap">
            <div class="section-card">
                <h3><i class="fa-solid fa-user-plus"></i> Assign Admin Role</h3>

                <div class="form-group">
                    <label>Search Student <span>*</span></label>
                    <input id="search-input" placeholder="Search by matric number or name" oninput="searchStudents(this.value)">
                    <div class="search-results" id="search-results"></div>
                </div>

                <div id="role-section" style="display:none;">
                    <div class="form-group">
                        <label>Selected Student</label>
                        <div class="search-result-item selected" id="selected-student-display"></div>
                    </div>

                    <div class="form-group">
                        <label>Admin Role <span>*</span></label>
                        <div class="role-grid">
                            ${assignableRoles.map(r => `
                                <div class="role-card ${r === selectedRole ? 'selected' : ''}" data-role="${r}" onclick="selectRole(this)">
                                    <span class="emoji">${roleLabels[r].split(' ')[0]}</span>
                                    <div class="label">${roleLabels[r].split(' ').slice(1).join(' ')}</div>
                                    <div class="desc">${roleDescription(r)}</div>
                                </div>`).join('')}
                        </div>
                    </div>

                    <div id="scope-fields-admin" class="${selectedRole !== 'election_admin' ? 'show' : ''}">
                        <div class="form-group">
                            <label>Faculty <span>*</span></label>
                            <input id="admin-faculty" placeholder="e.g. Engineering">
                        </div>
                        <div class="form-group" id="admin-dept-field" style="${selectedRole === 'department_admin' ? '' : 'display:none;'}">
                            <label>Department <span>*</span></label>
                            <input id="admin-department" placeholder="e.g. Software Engineering">
                        </div>
                    </div>

                    <button class="btn-assign" onclick="assignRole()">
                        <i class="fa-solid fa-shield-halved"></i> Assign Role
                    </button>
                </div>
            </div>

            <div class="section-card">
                <h3><i class="fa-solid fa-users-gear"></i> Current Admins (${currentAdmins.length})</h3>
                ${currentAdmins.length ? currentAdmins.map(a => renderAdminCard(a)).join('') : `<div class="empty-state">No admins assigned yet besides the super admin.</div>`}
            </div>
        </div>`;

        // Pre-fill faculty if election_admin's own scope exists (for context, though they can assign cross-faculty)
    }

    function roleDescription(role) {
        const map = {
            election_admin: 'Manage all elections',
            faculty_admin: 'Manage one faculty',
            department_admin: 'Manage one department'
        };
        return map[role] || '';
    }

    window.searchStudents = function(value) {
        const results = document.getElementById('search-results');
        const term = value.trim().toLowerCase();
        if (term.length < 2) { results.innerHTML = ''; return; }

        const matches = allStudents.filter(s =>
            s.matricNumber?.toLowerCase().includes(term) ||
            s.fullName?.toLowerCase().includes(term)
        ).slice(0, 8);

        if (!matches.length) {
            results.innerHTML = `<div class="empty-state">No students found.</div>`;
            return;
        }

        results.innerHTML = matches.map(s => `
            <div class="search-result-item" onclick='selectStudent("${s.docId}")'>
                <div class="info"><strong>${s.fullName}</strong><span>${s.matricNumber} · ${s.department}, ${s.faculty}</span></div>
                ${s.isAdmin ? `<span class="admin-tag">${roleLabels[s.adminRole]?.split(' ')[0] || '⚙️'}</span>` : ''}
            </div>`).join('');
    };

    window.selectStudent = function(docId) {
        selectedStudent = allStudents.find(s => s.docId === docId);
        if (!selectedStudent) return;

        document.getElementById('search-results').innerHTML = '';
        document.getElementById('search-input').value = `${selectedStudent.fullName} (${selectedStudent.matricNumber})`;

        document.getElementById('role-section').style.display = 'block';
        document.getElementById('selected-student-display').innerHTML = `
            <div class="info"><strong>${selectedStudent.fullName}</strong><span>${selectedStudent.matricNumber} · ${selectedStudent.department}, ${selectedStudent.faculty}</span></div>
            ${selectedStudent.isAdmin ? `<span class="admin-tag">${roleLabels[selectedStudent.adminRole]}</span>` : ''}`;

        // Pre-fill faculty/department from student's own record as a starting suggestion
        const facultyInput = document.getElementById('admin-faculty');
        const deptInput = document.getElementById('admin-department');
        if (facultyInput) facultyInput.value = selectedStudent.faculty || '';
        if (deptInput) deptInput.value = selectedStudent.department || '';
    };

    window.selectRole = function(el) {
        document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedRole = el.dataset.role;

        const scopeFields = document.getElementById('scope-fields-admin');
        const deptField = document.getElementById('admin-dept-field');

        if (selectedRole === 'election_admin') {
            scopeFields.classList.remove('show');
        } else {
            scopeFields.classList.add('show');
            deptField.style.display = selectedRole === 'department_admin' ? 'block' : 'none';
        }
    };

    window.assignRole = async function() {
        if (!selectedStudent) { showToast('Select a student first', 'error'); return; }

        const adminScope = { faculty: null, department: null };
        if (selectedRole !== 'election_admin') {
            const faculty = document.getElementById('admin-faculty')?.value.trim();
            if (!faculty) { showToast('Enter faculty for this admin role', 'error'); return; }
            adminScope.faculty = faculty;
            if (selectedRole === 'department_admin') {
                const department = document.getElementById('admin-department')?.value.trim();
                if (!department) { showToast('Enter department for this admin role', 'error'); return; }
                adminScope.department = department;
            }
        }

        try {
            await updateDoc(doc(db, 'students', selectedStudent.docId), {
                isAdmin: true,
                adminRole: selectedRole,
                adminScope
            });

            showToast(`${selectedStudent.fullName} is now ${roleLabels[selectedRole]}!`, 'success');

            // Refresh local state
            await loadStudents();
            selectedStudent = null;
            document.getElementById('search-input').value = '';
            document.getElementById('role-section').style.display = 'none';
            renderPage();

        } catch (e) {
            console.error(e);
            showToast('Error: ' + e.message, 'error');
        }
    };

    function renderAdminCard(a) {
        let scopeText = '';
        if (a.adminScope?.department) scopeText = `${a.adminScope.department}, ${a.adminScope.faculty}`;
        else if (a.adminScope?.faculty) scopeText = a.adminScope.faculty;
        else scopeText = 'All elections';

        const initials = (a.fullName || '??').split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
        const canRemove = currentAdmin.adminRole === 'super_admin' && a.adminRole !== 'super_admin' && a.docId !== currentAdmin.matric;

        return `<div class="admin-card">
            <div class="admin-avatar">${initials}</div>
            <div class="admin-info">
                <span class="role-pill ${roleClass[a.adminRole] || ''}">${roleLabels[a.adminRole] || a.adminRole}</span>
                <strong>${a.fullName}</strong>
                <span>${a.matricNumber} · ${scopeText}</span>
            </div>
            ${canRemove ? `<button class="remove-btn" onclick="removeAdmin('${a.docId}','${(a.fullName||'').replace(/'/g,'')}')"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>`;
    }

    window.removeAdmin = async function(docId, name) {
        if (!confirm(`Remove admin role from ${name}? They'll become a regular voter again.`)) return;
        try {
            await updateDoc(doc(db, 'students', docId), {
                isAdmin: false,
                adminRole: null,
                adminScope: { faculty: null, department: null }
            });
            showToast(`Admin role removed from ${name}`, 'success');
            await loadStudents();
            renderPage();
        } catch (e) {
            console.error(e);
            showToast('Error: ' + e.message, 'error');
        }
    };
</script>
</body>
</html>
