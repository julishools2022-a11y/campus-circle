<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px;}

        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;position:sticky;top:0;z-index:100;}
        .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
        .logo{font-size:1.05rem;font-weight:800;}
        .logo span{color:var(--accent);}
        .logout-btn{color:var(--muted);font-size:0.78rem;font-weight:600;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:5px;}

        /* WELCOME CARD */
        .welcome-card{background:linear-gradient(135deg,#0d2240,#112236);border:1px solid var(--border);border-radius:18px;padding:20px;margin:16px;position:relative;overflow:hidden;}
        .welcome-card::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(61,114,180,0.25) 0%,transparent 70%);}
        .welcome-greeting{font-size:0.78rem;color:var(--muted);margin-bottom:4px;}
        .welcome-name{font-size:1.25rem;font-weight:800;margin-bottom:10px;position:relative;}
        .welcome-meta{display:flex;gap:8px;flex-wrap:wrap;position:relative;}
        .meta-chip{background:rgba(61,114,180,0.15);border:1px solid rgba(61,114,180,0.3);border-radius:8px;padding:5px 10px;font-size:0.72rem;color:var(--accent);display:flex;align-items:center;gap:5px;}

        /* SECTION */
        .section{padding:0 16px;margin-bottom:20px;}
        .section-title{font-size:0.95rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .section-title i{color:var(--accent);}

        /* ELECTION CARD */
        .election-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;cursor:pointer;transition:0.2s;}
        .election-card:active{transform:scale(0.98);}
        .election-card.voted{opacity:0.7;}
        .election-top{padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
        .election-type-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
        .type-sug{background:rgba(124,58,237,0.15);}
        .type-faculty{background:rgba(61,114,180,0.15);}
        .type-department{background:rgba(34,197,94,0.15);}
        .election-info{flex:1;}
        .election-title{font-size:0.92rem;font-weight:800;margin-bottom:4px;line-height:1.3;}
        .election-scope{font-size:0.75rem;color:var(--muted);}
        .election-status{font-size:0.68rem;font-weight:700;padding:4px 10px;border-radius:8px;flex-shrink:0;white-space:nowrap;}
        .status-active{background:rgba(34,197,94,0.15);color:var(--success);}
        .status-upcoming{background:rgba(245,158,11,0.15);color:var(--warning);}
        .status-closed{background:rgba(122,156,192,0.15);color:var(--muted);}

        .election-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .countdown-text{font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;}
        .countdown-text i{color:var(--accent);}
        .vote-btn{background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;border:none;padding:7px 16px;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:5px;}
        .voted-badge{background:rgba(34,197,94,0.15);color:var(--success);padding:5px 12px;border-radius:8px;font-size:0.75rem;font-weight:700;display:flex;align-items:center;gap:5px;}
        .closed-text{color:var(--muted);font-size:0.78rem;font-weight:600;}

        /* EMPTY */
        .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
        .empty-state i{font-size:2.5rem;opacity:0.2;display:block;margin-bottom:12px;}
        .empty-state p{font-size:0.85rem;}

        .spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:30px auto;}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* NOTICE BANNER */
        .notice-banner{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:12px;padding:12px 14px;margin:0 16px 16px;font-size:0.78rem;color:#fbbf24;line-height:1.5;display:flex;gap:8px;}
        .notice-banner i{margin-top:2px;flex-shrink:0;}
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="logo">Campus<span>Circle</span> Voting</div>
        <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
</div>

<div id="content">
    <div class="spinner"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const typeIcons = { sug: '🏛️', faculty: '🎓', department: '📚' };
    const typeClass = { sug: 'type-sug', faculty: 'type-faculty', department: 'type-department' };
    const typeLabel = { sug: 'SUG Election', faculty: 'Faculty Election', department: 'Departmental Election' };

    window.onload = () => {
        const matric = sessionStorage.getItem('voterMatric');
        if (!matric) {
            window.location.href = 'evoting-login.html';
            return;
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                sessionStorage.removeItem('voterMatric');
                sessionStorage.removeItem('voterEmail');
                window.location.href = 'evoting-login.html';
                return;
            }

            try {
                const studentRef = doc(db, 'students', matric);
                const studentSnap = await getDoc(studentRef);

                if (!studentSnap.exists() || studentSnap.data().authUid !== user.uid) {
                    window.location.href = 'evoting-login.html';
                    return;
                }

                const student = studentSnap.data();
                if (student.isAdmin) {
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
                await renderDashboard(student, matric);

            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong loading your dashboard. Please try again.</p></div>`;
            }
        });
    };

    async function renderDashboard(student, matric) {
        // Fetch all elections
        const electionsSnap = await getDocs(collection(db, 'elections'));
        const allElections = electionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Filter eligible elections
        const eligible = allElections.filter(e => {
            if (e.type === 'sug') return true;
            if (e.type === 'faculty') return e.scope?.faculty === student.faculty;
            if (e.type === 'department') return e.scope?.faculty === student.faculty && e.scope?.department === student.department;
            return false;
        });

        // Sort: active first, then upcoming, then closed
        const order = { active: 0, upcoming: 1, closed: 2 };
        eligible.sort((a, b) => (order[a.status] ?? 3) - (order[b.status] ?? 3));

        const hasVotedMap = {
            sug: student.hasVotedSUG,
            faculty: student.hasVotedFaculty,
            department: student.hasVotedDepartment
        };

        const content = document.getElementById('content');

        let html = `
        <div class="welcome-card">
            <div class="welcome-greeting">Welcome back,</div>
            <div class="welcome-name">${student.fullName || 'Student'}</div>
            <div class="welcome-meta">
                <div class="meta-chip"><i class="fa-solid fa-id-card"></i> ${student.matricNumber || '-'}</div>
                <div class="meta-chip"><i class="fa-solid fa-graduation-cap"></i> ${student.faculty || '-'}</div>
                <div class="meta-chip"><i class="fa-solid fa-book"></i> ${student.department || '-'}</div>
            </div>
        </div>`;

        if (!eligible.length) {
            html += `
            <div class="notice-banner">
                <i class="fa-solid fa-circle-info"></i>
                <span>There are no elections set up yet for your faculty/department. Check back when election admins create one.</span>
            </div>
            <div class="empty-state">
                <i class="fa-solid fa-box-open"></i>
                <p>No elections available right now.</p>
            </div>`;
            content.innerHTML = html;
            return;
        }

        const active = eligible.filter(e => e.status === 'active');
        const upcoming = eligible.filter(e => e.status === 'upcoming');
        const closed = eligible.filter(e => e.status === 'closed');

        if (active.length) {
            html += `<div class="section"><div class="section-title"><i class="fa-solid fa-bolt"></i> Active Elections</div>`;
            active.forEach(e => html += renderCard(e, hasVotedMap[e.type]));
            html += `</div>`;
        }

        if (upcoming.length) {
            html += `<div class="section"><div class="section-title"><i class="fa-solid fa-clock"></i> Upcoming Elections</div>`;
            upcoming.forEach(e => html += renderCard(e, hasVotedMap[e.type]));
            html += `</div>`;
        }

        if (closed.length) {
            html += `<div class="section"><div class="section-title"><i class="fa-solid fa-flag-checkered"></i> Closed Elections</div>`;
            closed.forEach(e => html += renderCard(e, hasVotedMap[e.type]));
            html += `</div>`;
        }

        content.innerHTML = html;
    }

    function renderCard(e, hasVoted) {
        const icon = typeIcons[e.type] || '🗳️';
        const cls = typeClass[e.type] || '';
        const label = typeLabel[e.type] || 'Election';
        const statusClass = `status-${e.status}`;

        let scopeText = '';
        if (e.type === 'department') scopeText = `${e.scope?.department || ''}, ${e.scope?.faculty || ''}`;
        else if (e.type === 'faculty') scopeText = e.scope?.faculty || '';
        else scopeText = 'All Students';

        let footer = '';
        if (e.status === 'active') {
            const endDate = e.endDate?.toDate ? e.endDate.toDate() : new Date(e.endDate);
            const countdown = formatCountdown(endDate);
            if (hasVoted) {
                footer = `<div class="countdown-text"><i class="fa-solid fa-clock"></i> ${countdown}</div><div class="voted-badge"><i class="fa-solid fa-check"></i> Voted</div>`;
            } else {
                footer = `<div class="countdown-text"><i class="fa-solid fa-clock"></i> ${countdown}</div><button class="vote-btn" onclick="window.location.href='ballot.html?electionId=${e.id}'"><i class="fa-solid fa-vote-yea"></i> Vote Now</button>`;
            }
        } else if (e.status === 'upcoming') {
            const startDate = e.startDate?.toDate ? e.startDate.toDate() : new Date(e.startDate);
            footer = `<div class="countdown-text"><i class="fa-solid fa-calendar"></i> Starts ${startDate.toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`;
        } else {
            footer = `<div class="closed-text"><i class="fa-solid fa-lock"></i> Election Closed</div>`;
            if (e.resultsMode === 'live' || e.status === 'closed') {
                footer += `<button class="vote-btn" style="background:var(--surface2);color:var(--accent);" onclick="window.location.href='results.html?electionId=${e.id}'"><i class="fa-solid fa-chart-bar"></i> View Results</button>`;
            }
        }

        return `<div class="election-card">
            <div class="election-top">
                <div class="election-type-icon ${cls}">${icon}</div>
                <div class="election-info">
                    <div class="election-title">${e.title}</div>
                    <div class="election-scope">${label} · ${scopeText}</div>
                </div>
                <div class="election-status ${statusClass}">${e.status?.toUpperCase()}</div>
            </div>
            <div class="election-footer">${footer}</div>
        </div>`;
    }

    function formatCountdown(endDate) {
        const diff = endDate - new Date();
        if (diff <= 0) return 'Ending soon';
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        if (days > 0) return `${days}d ${hours}h left`;
        if (hours > 0) return `${hours}h ${mins}m left`;
        return `${mins}m left`;
    }

    window.logout = async function() {
        sessionStorage.removeItem('voterMatric');
        sessionStorage.removeItem('voterEmail');
        try { await signOut(auth); } catch (e) {}
        window.location.href = 'evoting-login.html';
    };
</script>
</body>
</html>
