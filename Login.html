<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Campus Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <style>
        :root {
            --bg: #0a1628;
            --surface: #112236;
            --surface2: #1a2f4a;
            --border: rgba(61,114,180,0.25);
            --primary: #3d72b4;
            --primary-bright: #5b9bd5;
            --accent: #64b5f6;
            --text: #e2eaf4;
            --text-muted: #7a9cc0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background grid pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(61,114,180,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61,114,180,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Glow orb */
        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(61,114,180,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            display: block;
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .brand-name span { color: var(--accent); }

        .brand-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(61,114,180,0.1);
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }

        .card-sub {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: var(--text-muted); opacity: 0.6; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61,114,180,0.15); }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-bright));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #message {
            margin-top: 14px;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }

        .footer-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .google-btn {
            width: 100%;
            padding: 13px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: border-color 0.2s, background 0.2s;
        }

        .google-btn:hover { border-color: var(--primary); background: rgba(61,114,180,0.08); }
        .google-btn img { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div id="app-splash" style="position:fixed;inset:0;background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.4s ease;">
        <img src="1000367752.jpg" style="width:80px;height:80px;border-radius:20px;margin-bottom:16px;" onerror="this.style.display='none'">
        <div style="color:#e2eaf4;font-size:1.3rem;font-weight:700;">Campus Circle</div>
        <div style="color:#7a9cc0;font-size:0.85rem;margin-top:6px;">Loading...</div>
    </div>
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var s = document.getElementById('app-splash');
                if(s) { s.style.opacity='0'; setTimeout(function(){ s.remove(); }, 400); }
            }, 400);
        });
    </script>

    <div class="brand">
        <img src="1000367752.jpg" class="brand-logo" alt="Campus Circle">
        <div class="brand-name">Campus <span>Circle</span></div>
        <div class="brand-sub">UNIZIK Student Marketplace</div>
    </div>

    <div class="card">
        <div class="card-title">Welcome back 👋</div>
        <div class="card-sub">Sign in to access your library</div>

        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="you@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Your password" required>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div id="message"></div>

        <div class="divider"><span>or</span></div>

        <button class="google-btn" onclick="signInWithGoogle()">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Continue with Google
        </button>

        <div class="footer-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const loginForm = document.getElementById("login-form");
    const msg = document.getElementById("message");
    const btn = document.getElementById("loginBtn");

    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
        msg.textContent = "";

        try {
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.textContent = error.message;
                msg.style.color = "var(--danger)";
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In';
            } else {
                msg.textContent = "✓ Success! Redirecting...";
                msg.style.color = "var(--success)";
                setTimeout(() => { window.location.href = "index.html"; }, 1000);
            }
        } catch (err) {
            msg.textContent = "Connection error. Please try again.";
            msg.style.color = "var(--danger)";
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In';
        }
    };

    async function signInWithGoogle() {
        await _supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/index.html' }
        });
    }
</script>
</body>
</html>
