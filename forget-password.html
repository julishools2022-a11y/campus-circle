<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Campus Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #0f172a; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .back-link { display: block; margin-top: 15px; font-size: 13px; color: #64748b; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a recovery link.</p>
        
        <input type="email" id="email" placeholder="Enter your email address">
        <button onclick="sendResetLink()" id="btn">Send Link</button>
        <div id="msg" style="margin-top:15px; font-size:14px;"></div>
        
        <a href="sign up.html" class="back-link">Back to Login</a>
    </div>

    <script>
        const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function sendResetLink() {
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if(!email) return alert("Please enter your email.");

            btn.disabled = true;
            btn.textContent = "Sending...";

            // CRITICAL: Point this URL to your LIVE Netlify site
            // Change 'campus-circle.netlify.app' to your actual domain
            const redirectUrl = window.location.origin + 'update-password.html';

            const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                redirectTo: redirectUrl,
            });

            if (error) {
                msg.textContent = "Error: " + error.message;
                msg.style.color = "red";
                btn.disabled = false;
                btn.textContent = "Try Again";
            } else {
                msg.textContent = "Check your email! (Look in Spam too)";
                msg.style.color = "green";
                btn.textContent = "Link Sent";
            }
        }
    </script>
</body>
</html>
