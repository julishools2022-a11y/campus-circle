<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Circle | Home</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #ef4444; /* Red for Logout */
            --bg: #f8fafc; 
            --dark: #0f172a; 
            --white: #ffffff; 
            --gray: #64748b; 
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            height: 100vh; /* Forces full screen height */
            overflow: hidden; /* Prevents scrolling if content fits */
        }

        /* HEADER */
        .header {
            background: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0; /* Prevents header from shrinking */
        }

        .logo {
            font-weight: 900;
            font-size: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* LOGOUT BUTTON */
        .btn-logout {
            color: var(--danger);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #fee2e2;
            padding: 8px 16px;
            border-radius: 6px;
            background: #fef2f2;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: #fee2e2;
        }

        /* MAIN LAYOUT (Centers content) */
        .main-container {
            flex: 1; /* Takes up all remaining space */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 30px;
            flex-wrap: wrap;
            overflow-y: auto; /* Allows scrolling only inside here if needed */
        }

        /* CARDS */
        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .card-image {
            height: 70%;
            width: 100%;
            object-fit: cover;
            background: #e2e8f0;
        }

        .card-footer {
            height: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            gap: 10px;
        }

        /* Card Specific Colors */
        .market-footer { background-color: #3b82f6; } 
        .academic-footer { background-color: #22c55e; } 

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; padding: 20px; gap: 20px; }
            .card { height: 200px; max-width: 100%; }
            body { overflow: auto; } /* Allow scrolling on small phones */
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap" style="color:var(--primary);"></i>
            CampusCircle
        </div>
        
        <a href="index.html" onclick="logout()" class="btn-logout">
            Log Out <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </header>

    <div class="main-container">

            <div class="card-footer market-footer">
                <i class="fa-solid fa-store"></i>
                Marketplace Resources
            </div>
        </a>

        <a href="resources.html" class="card">
            <img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?q=80&w=1000&auto=format&fit=crop" class="card-image" alt="Library">
            <div class="card-footer academic-footer">
                <i class="fa-solid fa-book-open"></i>
                Academic Resources
            </div>
        </a>

    </div>

</body>
</html>
