<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Material | Admin Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f1f5f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0f172a; margin-top: 0; }
        
        label { display: block; margin: 15px 0 5px; font-weight: 700; font-size: 14px; color: #334155; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; box-sizing: border-box; }
        
        /* Checkbox Style */
        .checkbox-group { display: flex; align-items: center; gap: 10px; background: #eff6ff; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #bfdbfe; }
        .checkbox-group input { width: 20px; height: 20px; margin: 0; }
        .checkbox-group label { margin: 0; color: #1e40af; }

        .btn-upload { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; margin-top: 20px; cursor: pointer; }
        .btn-upload:disabled { background: #94a3b8; cursor: wait; }
        
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #64748b; font-size: 14px; }
        .error-msg { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
        
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:999; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div style="text-align:center;">
        <h3>Verifying Admin Access...</h3>
        <p>Please wait.</p>
    </div>
</div>

<div class="container" id="main-content" style="display:none;">
    <h2>Upload Study Material</h2>
    <form id="upload-form">
        <label>Faculty</label>
        <select id="faculty" onchange="loadDepartments()" required>
            <option value="" disabled selected>Select Faculty</option>
            </select>

        <label>Department</label>
        <select id="dept" disabled required>
            <option value="" disabled selected>Select Department</option>
        </select>

        <label>Level</label>
        <select id="level" required>
            <option value="100L">100L</option>
            <option value="200L">200L</option>
            <option value="300L">300L</option>
            <option value="400L">400L</option>
            <option value="500L">500L</option>
        </select>

        <label>Material Title</label>
        <input type="text" id="title" placeholder="e.g. ECO 210 Past Questions" required>

        <label>Description</label>
        <textarea id="desc" placeholder="Brief description (Optional)"></textarea>

        <div class="checkbox-group">
            <input type="checkbox" id="is_borrowed">
            <div>
                <label for="is_borrowed">Is this a Borrowed / General Course?</label>
                <small style="display:block; color:#64748b; font-weight:400; font-size:12px;">Check this if students from OTHER departments need to see this.</small>
            </div>
        </div>

        <label>Select File (PDF/Image)</label>
        <input type="file" id="file" accept=".pdf, .doc, .docx, .jpg, .png" required>

        <button type="submit" class="btn-upload" id="btn">UPLOAD MATERIAL</button>
        <p id="status" class="error-msg"></p>
    </form>
    <a href="index.html" class="back-link">Back to Home</a>
</div>

<script>
    // --- 1. CONFIGURATION ---
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // --- 2. FACULTY DATA ---
    const facultyData = {
        "Science": ["Computer Science", "Microbiology", "Physics", "Chemistry", "Biochemistry"],
        "Arts": ["History", "English", "Performing Arts", "Linguistics"],
        "Social Sciences": ["Economics", "Political Science", "Sociology", "Psychology"],
        "Engineering": ["Civil", "Mechanical", "Electrical", "Chemical"]
    };

    // --- 3. SECURITY: CHECK ADMIN STATUS ---
    async function init() {
        try {
            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                alert("Please login first.");
                window.location.href = 'login.html'; // Redirect to login
                return;
            }

            // Check 'admin_users' table
            const { data: adminRecord, error } = await _supabase
                .from('admin_users')
                .select('*')
                .eq('email', user.email)
                .single();

            // If not found in admin table or error occurs
            if (error || !adminRecord) {
                alert("Access Denied: You do not have permission to upload materials.");
                window.location.href = 'dashboard.html'; // Redirect non-admins
                return;
            }

            // If Valid Admin: Reveal the form
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            populateFaculties();

        } catch (err) {
            console.error("Auth check failed:", err);
            window.location.href = 'dashboard.html';
        }
    }

    // --- 4. DROPDOWN LOGIC ---
    function populateFaculties() {
        const facSelect = document.getElementById('faculty');
        for (const fac in facultyData) {
            let opt = document.createElement('option');
            opt.value = fac;
            opt.textContent = fac;
            facSelect.appendChild(opt);
        }
    }

    function loadDepartments() {
        const fac = document.getElementById('faculty').value;
        const deptSelect = document.getElementById('dept');
        deptSelect.innerHTML = '<option value="" disabled selected>Select Department</option>';
        
        if (fac && facultyData[fac]) {
            facultyData[fac].forEach(dept => {
                let opt = document.createElement('option');
                opt.value = dept;
                opt.textContent = dept;
                deptSelect.appendChild(opt);
            });
            deptSelect.disabled = false;
        } else {
            deptSelect.disabled = true;
        }
    }
    // Make function available to HTML
    window.loadDepartments = loadDepartments; 

    // --- 5. UPLOAD & SAVE LOGIC ---
    document.getElementById('upload-form').onsubmit = async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const fileInput = document.getElementById('file');
        const file = fileInput.files[0];

        if (!file) return alert("Please select a file.");

        btn.disabled = true;
        btn.textContent = "Uploading File...";
        status.textContent = "";

        try {
            const { data: { user } } = await _supabase.auth.getUser();

            // A. Upload File to Storage Bucket named 'materials'
            // Sanitize filename
            const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '');
            const filePath = `${Date.now()}_${cleanName}`;
            
            const { error: uploadError } = await _supabase.storage
                .from('materials') 
                .upload(filePath, file);

            if (uploadError) throw uploadError;

            // Get Public URL
            const { data: urlData } = _supabase.storage
                .from('materials')
                .getPublicUrl(filePath);

            // B. Insert Record into Database
            btn.textContent = "Saving Info...";

            const { error: dbError } = await _supabase.from('materials').insert([{
                title: document.getElementById('title').value,
                description: document.getElementById('desc').value,
                faculty: document.getElementById('faculty').value,
                department: document.getElementById('dept').value,
                level: document.getElementById('level').value,
                is_borrowed: document.getElementById('is_borrowed').checked,
                file_url: urlData.publicUrl,
                uploaded_by: user.id
            }]);

            if (dbError) throw dbError;

            status.style.color = "green";
            status.textContent = "Upload Successful!";
            
            // Clear form
            document.getElementById('upload-form').reset();
            btn.textContent = "UPLOAD MATERIAL";
            btn.disabled = false;
            
        } catch (err) {
            console.error(err);
            status.style.color = "red";
            status.textContent = "Error: " + (err.message || "Upload failed");
            btn.textContent = "UPLOAD MATERIAL";
            btn.disabled = false;
        }
    };

    // Run security check immediately
    init();

</script>

</body>
</html>
