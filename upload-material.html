<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Material</title>
    <style>
        /* --- 1. CSS STYLING --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Aligns to top for better scrolling on mobile */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .upload-card {
            background-color: white;
            width: 100%;
            max-width: 400px; /* Looks good on phone, doesn't stretch on PC */
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            font-size: 18px;
            color: #111827;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        input[type="text"], 
        select, 
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
            color: #1f2937;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }

        textarea {
            resize: vertical;
            height: 80px;
            font-family: inherit;
        }

        /* The Special Blue Checkbox Box */
        .info-box {
            background-color: #eff6ff; /* Light blue bg */
            border: 1px solid #dbeafe;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-box input[type="checkbox"] {
            margin-top: 4px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .info-text h4 {
            margin: 0;
            font-size: 13px;
            color: #1e40af; /* Darker blue text */
            font-weight: 600;
        }

        .info-text p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.4;
        }

        /* Upload Button */
        .btn-submit {
            width: 100%;
            background-color: #2563eb; /* Royal Blue */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 16px;
        }

        .footer a {
            color: #6b7280;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="upload-card">
    <h2>Upload Material</h2>
    
    <form id="uploadForm">
        <div class="form-group">
            <label>Faculty</label>
            <select id="faculty" required>
                <option value="">Select Faculty</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Engineering">Engineering</option>
                <option value="Science">Science</option>
            </select>
        </div>

        <div class="form-group">
            <label>Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option value="Agric Econ">Agricultural Economics</option>
                <option value="Computer Sci">Computer Science</option>
            </select>
        </div>

        <div class="form-group">
            <label>Level</label>
            <select id="level" required>
                <option value="100L">100L</option>
                <option value="200L">200L</option>
                <option value="300L">300L</option>
                <option value="400L">400L</option>
            </select>
        </div>

        <div class="form-group">
            <label>Material Title</label>
            <input type="text" id="title" placeholder="e.g. ECO 210 Past Questions" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="description" placeholder="Brief description..."></textarea>
        </div>

        <div class="info-box">
            <input type="checkbox" id="isBorrowed">
            <div class="info-text">
                <h4>Is this a Borrowed / General Course?</h4>
                <p>Check this if students from OTHER departments need to see this.</p>
            </div>
        </div>

        <div class="form-group">
            <label>Select File (PDF/Image)</label>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.jpg,.png" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">UPLOAD MATERIAL</button>
    </form>

    <div class="footer">
        <a href="index.html">Back to Resources</a>
    </div>
</div>

<script type="module">
    // Import Supabase from CDN
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // TODO: Paste your credentials here
    const supabaseUrl = 'YOUR_SUPABASE_URL_HERE'; 
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY_HERE';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // 1. UI Loading State
        submitBtn.disabled = true;
        submitBtn.innerText = "Uploading...";

        // 2. Gather Data
        const faculty = document.getElementById('faculty').value;
        const dept = document.getElementById('department').value;
        const level = document.getElementById('level').value;
        const title = document.getElementById('title').value;
        const desc = document.getElementById('description').value;
        const isBorrowed = document.getElementById('isBorrowed').checked;
        const file = document.getElementById('fileInput').files[0];

        if (!file) {
            alert("Please select a file");
            submitBtn.disabled = false;
            return;
        }

        try {
            // 3. Upload File to Storage Bucket
            // Note: Ensure you have a bucket named 'materials' in Supabase Storage
            const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
            
            const { data: fileData, error: uploadError } = await supabase
                .storage
                .from('materials') 
                .upload(fileName, file);

            if (uploadError) throw uploadError;

            // 4. Get Public URL
            const { data: { publicUrl } } = supabase
                .storage
                .from('materials')
                .getPublicUrl(fileName);

            // 5. Insert Info into Database
            // Note: Ensure you have a table named 'uploads'
            const { error: dbError } = await supabase
                .from('uploads')
                .insert([{
                    faculty: faculty,
                    department: dept,
                    level: level,
                    title: title,
                    description: desc,
                    is_borrowed: isBorrowed,
                    file_url: publicUrl
                }]);

            if (dbError) throw dbError;

            alert("Upload successful!");
            form.reset();

        } catch (error) {
            console.error(error);
            alert("Error uploading: " + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "UPLOAD MATERIAL";
        }
    });
</script>

</body>
</html>
