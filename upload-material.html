<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Material | Staff Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f1f5f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0f172a; margin-top: 0; }
        
        label { display: block; margin: 15px 0 5px; font-weight: 700; font-size: 14px; color: #334155; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; box-sizing: border-box; }
        
        /* Checkbox Style */
        .checkbox-group { display: flex; align-items: center; gap: 10px; background: #eff6ff; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #bfdbfe; }
        .checkbox-group input { width: 20px; height: 20px; margin: 0; }
        .checkbox-group label { margin: 0; color: #1e40af; }

        .btn-upload { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; margin-top: 20px; cursor: pointer; }
        .btn-upload:disabled { background: #94a3b8; cursor: wait; }
        
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Material</h2>
    <form id="upload-form">
        <label>Faculty</label>
        <select id="faculty" onchange="loadDepartments()" required></select>

        <label>Department</label>
        <select id="dept" disabled required></select>

        <label>Level</label>
        <select id="level" required>
            <option value="100L">100L</option>
            <option value="200L">200L</option>
            <option value="300L">300L</option>
            <option value="400L">400L</option>
            <option value="500L">500L</option>
        </select>

        <label>Material Title</label>
        <input type="text" id="title" placeholder="e.g. ECO 210 Past Questions" required>

        <label>Description</label>
        <textarea id="desc" placeholder="Brief description..."></textarea>

        <div class="checkbox-group">
            <input type="checkbox" id="is_borrowed">
            <div>
                <label for="is_borrowed">Is this a Borrowed / General Course?</label>
                <small style="display:block; color:#64748b; font-weight:400; font-size:12px;">Check this if students from OTHER departments need to see this.</small>
            </div>
        </div>

        <label>Select File (PDF/Image)</label>
        <input type="file" id="file" accept=".pdf, .doc, .docx, .jpg, .png" required>

        <button type="submit" class="btn-upload" id="btn">UPLOAD MATERIAL</button>
    </form>
    <a href="resources.html" class="back-link">Back to Resources</a>
</div>

<script>
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function checkAdmin() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) return window.location.href = 'index.html';

        // --- CRITICAL FIX: Case Insensitive Check ---
        const { data } = await _supabase
            .from('admin_users')
            .select('*')
            .ilike('email', user.email) // This allows 'Ce.offor' to match 'ce.offor'
            .maybeSingle();

        if (!data) { 
            alert("Access Denied: You are not an Admin."); 
            window.location.href = 'resources.html'; 
        }
    }
    checkAdmin();

    async function loadFaculties() {
        const { data } = await _supabase.from('faculties').select('*');
        const select = document.getElementById('faculty');
        if (data) {
            data.forEach(f => { select.innerHTML += `<option value="${f.id}">${f.name}</option>`; });
            loadDepartments(); 
        }
    }
    loadFaculties();

    window.loadDepartments = async function() {
        const facId = document.getElementById('faculty').value;
        const deptSelect = document.getElementById('dept');
        deptSelect.innerHTML = ''; deptSelect.disabled = true;
        
        const { data } = await _supabase.from('departments').select('*').eq('faculty_id', facId);
        if (data && data.length > 0) {
            data.forEach(d => { deptSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`; });
            deptSelect.disabled = false;
        }
    }

    document.getElementById('upload-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn');
        btn.disabled = true; btn.textContent = "Uploading...";

        try {
            const file = document.getElementById('file').files[0];
            const fileName = `${Date.now()}_${file.name.replace(/\s/g, '')}`;
            
            const { error: upErr } = await _supabase.storage.from('materials').upload(fileName, file);
            if (upErr) throw upErr;

            const { data: { publicUrl } } = _supabase.storage.from('materials').getPublicUrl(fileName);

            const { error: dbErr } = await _supabase.from('academic_resources').insert({
                department_id: document.getElementById('dept').value,
                title: document.getElementById('title').value,
                description: document.getElementById('desc').value,
                level: document.getElementById('level').value,
                is_borrowed: document.getElementById('is_borrowed').checked,
                
                file_url: publicUrl
            });

            if (dbErr) throw dbErr;

            alert("Uploaded Successfully!");
            window.location.reload();
    

            status.style.color = "green";
            status.textContent = "Success! Redirecting...";
            setTimeout(() => window.location.href = 'academic_resources.html', 1500);

        } catch (err) {
            alert("Error: " + err.message);
            btn.disabled = false; btn.textContent = "UPLOAD MATERIAL";
        }
    };
</script>
</body>
</html>
