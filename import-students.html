<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Import Students | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}

        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
        .back-btn{color:var(--muted);text-decoration:none;width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0;}
        .header h1{font-size:1.05rem;font-weight:800;}
        .header .subtitle{font-size:0.78rem;color:var(--muted);margin-top:2px;}

        .form-wrap{padding:16px;}
        .section-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
        .section-card h3{font-size:0.9rem;font-weight:800;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;}

        /* TEMPLATE INFO */
        .template-table{width:100%;border-collapse:collapse;font-size:0.75rem;margin-bottom:12px;overflow-x:auto;display:block;}
        .template-table th, .template-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;white-space:nowrap;}
        .template-table th{background:var(--surface2);color:var(--accent);font-weight:700;}
        .template-table td{color:var(--muted);}
        .download-template-btn{background:var(--surface2);border:1px solid var(--border);color:var(--accent);padding:8px 14px;border-radius:10px;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}

        /* UPLOAD AREA */
        .upload-area{border:2px dashed rgba(61,114,180,0.3);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:var(--surface2);transition:0.2s;}
        .upload-area:active{transform:scale(0.99);}
        .upload-area i{font-size:2.2rem;color:var(--accent);display:block;margin-bottom:10px;}
        .upload-area .title{font-size:0.92rem;font-weight:700;margin-bottom:4px;}
        .upload-area .sub{font-size:0.78rem;color:var(--muted);}
        .file-name-display{margin-top:12px;font-size:0.82rem;color:var(--accent);display:none;align-items:center;justify-content:center;gap:6px;}
        .file-name-display.show{display:flex;}

        /* PREVIEW SUMMARY */
        .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
        .summary-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
        .summary-box .val{font-size:1.4rem;font-weight:800;}
        .summary-box .val.ok{color:var(--success);}
        .summary-box .val.warn{color:var(--warning);}
        .summary-box .val.err{color:var(--danger);}
        .summary-box .val.total{color:var(--accent);}
        .summary-box .label{font-size:0.7rem;color:var(--muted);margin-top:2px;}

        /* PREVIEW TABLE */
        .preview-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;}
        .preview-table{width:100%;border-collapse:collapse;font-size:0.74rem;min-width:600px;}
        .preview-table th{background:var(--surface2);color:var(--accent);padding:8px 10px;text-align:left;font-weight:700;white-space:nowrap;position:sticky;top:0;}
        .preview-table td{padding:7px 10px;border-top:1px solid var(--border);white-space:nowrap;}
        .preview-table tr.row-error{background:rgba(239,68,68,0.06);}
        .preview-table tr.row-duplicate{background:rgba(245,158,11,0.06);}
        .row-status{font-size:0.68rem;font-weight:700;padding:2px 6px;border-radius:5px;}
        .row-status.ok{background:rgba(34,197,94,0.15);color:var(--success);}
        .row-status.error{background:rgba(239,68,68,0.15);color:var(--danger);}
        .row-status.duplicate{background:rgba(245,158,11,0.15);color:var(--warning);}
        .preview-scroll{max-height:320px;overflow-y:auto;}

        /* ERROR LIST */
        .error-list{font-size:0.78rem;color:var(--muted);line-height:1.7;max-height:200px;overflow-y:auto;}
        .error-list .err-row{color:var(--danger);}

        .btn-row{display:flex;gap:10px;}
        .btn-secondary{flex:1;padding:13px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--muted);font-weight:700;font-size:0.9rem;cursor:pointer;font-family:'Outfit',sans-serif;}
        .btn-primary{flex:2;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;font-weight:700;font-size:0.92rem;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 4px 14px rgba(61,114,180,0.3);display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}

        /* IMPORT PROGRESS */
        .import-progress{display:none;}
        .import-progress.show{display:block;}
        .progress-track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:8px;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width 0.3s ease;}
        .progress-text{font-size:0.8rem;color:var(--muted);text-align:center;}

        /* RESULT SUMMARY */
        .result-summary{text-align:center;padding:20px 0;}
        .result-summary i{font-size:2.5rem;color:var(--success);display:block;margin-bottom:12px;}
        .result-summary h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;}

        .access-denied{text-align:center;padding:60px 20px;color:var(--muted);}
        .access-denied i{font-size:2.5rem;opacity:0.3;display:block;margin-bottom:12px;}

        .spinner-center{text-align:center;padding:60px 0;}
        .spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
        @keyframes spin{to{transform:rotate(360deg)}}

        #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:0.85rem;font-weight:600;display:none;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90vw;text-align:center;}
        #toast.error{border-color:rgba(239,68,68,0.4);color:var(--danger);}
        #toast.success{border-color:rgba(34,197,94,0.4);color:var(--success);}
    </style>
</head>
<body>

<div class="header">
    <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1>Import Students</h1>
        <div class="subtitle">Bulk upload student records via Excel or CSV</div>
    </div>
</div>

<div id="content">
    <div class="spinner-center"><div class="spinner"></div></div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, writeBatch, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentAdmin = null;
    let parsedRows = []; // { matric, fullName, schoolEmail, faculty, department, level, _status, _error, _rowNum }
    let existingMatrics = new Set();

    const REQUIRED_HEADERS = ['Matric Number', 'Full Name', 'School Email', 'Faculty', 'Department'];
    const OPTIONAL_HEADERS = ['Level'];

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = type; t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    window.onload = () => {
        const matric = sessionStorage.getItem('voterMatric');
        if (!matric) { window.location.href = 'evoting-login.html'; return; }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'evoting-login.html'; return; }

            try {
                const studentRef = doc(db, 'students', matric);
                const studentSnap = await getDoc(studentRef);
                if (!studentSnap.exists() || studentSnap.data().authUid !== user.uid) {
                    window.location.href = 'evoting-login.html'; return;
                }

                const admin = studentSnap.data();
                currentAdmin = { matric, ...admin };

                // Only super_admin can do bulk imports
                if (!admin.isAdmin || admin.adminRole !== 'super_admin') {
                    document.getElementById('content').innerHTML = `
                        <div class="access-denied">
                            <i class="fa-solid fa-lock"></i>
                            <h3 style="color:var(--text);margin-bottom:6px;">Access Restricted</h3>
                            <p>Only Super Admins can bulk-import students.</p>
                        </div>`;
                    return;
                }

                renderUploadScreen();

            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML = `<div class="access-denied"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong. Please try again.</p></div>`;
            }
        });
    };

    function renderUploadScreen() {
        document.getElementById('content').innerHTML = `
        <div class="form-wrap">
            <div class="section-card">
                <h3><i class="fa-solid fa-table"></i> Required Format</h3>
                <p style="font-size:0.8rem;color:var(--muted);margin-bottom:10px;">Your Excel (.xlsx) or CSV file must have these column headers in the first row:</p>
                <div style="overflow-x:auto;">
                <table class="template-table">
                    <tr><th>Matric Number</th><th>Full Name</th><th>School Email</th><th>Faculty</th><th>Department</th><th>Level</th></tr>
                    <tr><td>2023/SE/001</td><td>John Doe</td><td>john@school.edu</td><td>Engineering</td><td>Software Engineering</td><td>300</td></tr>
                </table>
                </div>
                <button class="download-template-btn" onclick="downloadTemplate()"><i class="fa-solid fa-download"></i> Download Template (.xlsx)</button>
            </div>

            <div class="section-card">
                <h3><i class="fa-solid fa-file-arrow-up"></i> Upload File</h3>
                <div class="upload-area" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <div class="title">Tap to choose a file</div>
                    <div class="sub">Excel (.xlsx) or CSV (.csv)</div>
                    <div class="file-name-display" id="file-name-display"><i class="fa-solid fa-file"></i><span id="file-name-text"></span></div>
                </div>
                <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleFile(this)">
            </div>

            <div id="preview-container"></div>
        </div>`;
    }

    window.downloadTemplate = function() {
        const ws = XLSX.utils.aoa_to_sheet([
            ['Matric Number', 'Full Name', 'School Email', 'Faculty', 'Department', 'Level'],
            ['2023/SE/001', 'John Doe', 'john@school.edu', 'Engineering', 'Software Engineering', '300'],
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Students');
        XLSX.writeFile(wb, 'student_import_template.xlsx');
    };

    window.handleFile = function(input) {
        const file = input.files[0];
        if (!file) return;

        document.getElementById('file-name-text').textContent = file.name;
        document.getElementById('file-name-display').classList.add('show');

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });

                if (!rows.length) {
                    showToast('The file appears to be empty.', 'error');
                    return;
                }

                // Validate headers
                const headers = Object.keys(rows[0]);
                const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
                if (missing.length) {
                    showToast(`Missing required columns: ${missing.join(', ')}`, 'error');
                    return;
                }

                await validateRows(rows);
                renderPreview();

            } catch (err) {
                console.error(err);
                showToast('Could not read file. Please check the format and try again.', 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    };

    async function validateRows(rows) {
        // Load existing student matric numbers for duplicate detection
        const existingSnap = await getDocs(collection(db, 'students'));
        existingMatrics = new Set(existingSnap.docs.map(d => d.id));

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const seenInFile = new Set();

        parsedRows = rows.map((row, i) => {
            const matric = String(row['Matric Number'] || '').trim().toUpperCase();
            const fullName = String(row['Full Name'] || '').trim();
            const schoolEmail = String(row['School Email'] || '').trim().toLowerCase();
            const faculty = String(row['Faculty'] || '').trim();
            const department = String(row['Department'] || '').trim();
            const level = String(row['Level'] || '').trim();

            const docId = matric.replace(/\//g, '-');
            let status = 'ok';
            let error = null;

            if (!matric || !fullName || !schoolEmail || !faculty || !department) {
                status = 'error';
                error = 'Missing required field(s)';
            } else if (!emailRegex.test(schoolEmail)) {
                status = 'error';
                error = 'Invalid email format';
            } else if (existingMatrics.has(docId)) {
                status = 'duplicate';
                error = 'Already exists in database';
            } else if (seenInFile.has(docId)) {
                status = 'duplicate';
                error = 'Duplicate within this file';
            }

            if (status === 'ok') seenInFile.add(docId);

            return {
                matric, fullName, schoolEmail, faculty, department, level,
                docId, _status: status, _error: error, _rowNum: i + 2 // +2 = header row + 1-indexed
            };
        });
    }

    function renderPreview() {
        const total = parsedRows.length;
        const ok = parsedRows.filter(r => r._status === 'ok').length;
        const duplicates = parsedRows.filter(r => r._status === 'duplicate').length;
        const errors = parsedRows.filter(r => r._status === 'error').length;

        const container = document.getElementById('preview-container');
        container.innerHTML = `
            <div class="section-card">
                <h3><i class="fa-solid fa-magnifying-glass"></i> Import Preview</h3>
                <div class="summary-grid">
                    <div class="summary-box"><div class="val total">${total}</div><div class="label">Total Rows</div></div>
                    <div class="summary-box"><div class="val ok">${ok}</div><div class="label">Ready to Import</div></div>
                    <div class="summary-box"><div class="val warn">${duplicates}</div><div class="label">Duplicates (skipped)</div></div>
                    <div class="summary-box"><div class="val err">${errors}</div><div class="label">Errors (skipped)</div></div>
                </div>

                <div class="preview-table-wrap">
                    <div class="preview-scroll">
                        <table class="preview-table">
                            <thead><tr><th>Row</th><th>Matric</th><th>Name</th><th>Email</th><th>Faculty</th><th>Dept</th><th>Status</th></tr></thead>
                            <tbody>
                                ${parsedRows.map(r => `
                                    <tr class="${r._status === 'error' ? 'row-error' : r._status === 'duplicate' ? 'row-duplicate' : ''}">
                                        <td>${r._rowNum}</td>
                                        <td>${r.matric || '-'}</td>
                                        <td>${r.fullName || '-'}</td>
                                        <td>${r.schoolEmail || '-'}</td>
                                        <td>${r.faculty || '-'}</td>
                                        <td>${r.department || '-'}</td>
                                        <td>
                                            ${r._status === 'ok' ? `<span class="row-status ok">Ready</span>`
                                            : r._status === 'duplicate' ? `<span class="row-status duplicate">${r._error}</span>`
                                            : `<span class="row-status error">${r._error}</span>`}
                                        </td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="btn-row">
                    <button class="btn-secondary" onclick="renderUploadScreen()"><i class="fa-solid fa-arrow-left"></i> Cancel</button>
                    <button class="btn-primary" id="btn-import" onclick="startImport()" ${ok === 0 ? 'disabled' : ''}>
                        <i class="fa-solid fa-upload"></i> Import ${ok} Student${ok !== 1 ? 's' : ''}
                    </button>
                </div>

                <div class="import-progress" id="import-progress" style="margin-top:14px;">
                    <div class="progress-track"><div class="progress-fill" id="import-progress-fill" style="width:0%"></div></div>
                    <div class="progress-text" id="import-progress-text">Preparing...</div>
                </div>
            </div>`;
    }

    window.startImport = async function() {
        const toImport = parsedRows.filter(r => r._status === 'ok');
        if (!toImport.length) return;

        const btn = document.getElementById('btn-import');
        btn.disabled = true;
        document.getElementById('import-progress').classList.add('show');

        const BATCH_SIZE = 400; // Firestore batch limit is 500
        const batchId = `batch_${Date.now()}`;
        let imported = 0;

        try {
            for (let i = 0; i < toImport.length; i += BATCH_SIZE) {
                const chunk = toImport.slice(i, i + BATCH_SIZE);
                const batch = writeBatch(db);

                chunk.forEach(r => {
                    const ref = doc(db, 'students', r.docId);
                    batch.set(ref, {
                        matricNumber: r.matric,
                        fullName: r.fullName,
                        schoolEmail: r.schoolEmail,
                        faculty: r.faculty,
                        department: r.department,
                        level: r.level || null,
                        isActivated: false,
                        hasVotedSUG: false,
                        hasVotedFaculty: false,
                        hasVotedDepartment: false,
                        isAdmin: false,
                        adminRole: null,
                        adminScope: { faculty: null, department: null },
                        authUid: null,
                        createdAt: new Date(),
                        importedBy: currentAdmin.matric,
                        importBatchId: batchId
                    });
                });

                await batch.commit();
                imported += chunk.length;

                const pct = Math.round((imported / toImport.length) * 100);
                document.getElementById('import-progress-fill').style.width = pct + '%';
                document.getElementById('import-progress-text').textContent = `Imported ${imported} of ${toImport.length}...`;
            }

            // Log import batch summary
            const errorDetails = parsedRows.filter(r => r._status === 'error').map(r => ({
                row: r._rowNum, matricNumber: r.matric || '(empty)', error: r._error
            }));

            await addDoc(collection(db, 'importBatches'), {
                batchId,
                fileName: document.getElementById('file-name-text').textContent,
                uploadedBy: currentAdmin.matric,
                totalRecords: parsedRows.length,
                imported,
                duplicates: parsedRows.filter(r => r._status === 'duplicate').length,
                errors: parsedRows.filter(r => r._status === 'error').length,
                errorDetails,
                uploadedAt: new Date()
            });

            renderResult(imported, parsedRows.length, parsedRows.filter(r => r._status === 'duplicate').length, parsedRows.filter(r => r._status === 'error').length);

        } catch (e) {
            console.error(e);
            showToast('Import failed: ' + e.message, 'error');
            btn.disabled = false;
        }
    };

    function renderResult(imported, total, duplicates, errors) {
        const container = document.getElementById('preview-container');
        container.innerHTML = `
            <div class="section-card">
                <div class="result-summary">
                    <i class="fa-solid fa-circle-check"></i>
                    <h3>Import Complete!</h3>
                    <div class="summary-grid">
                        <div class="summary-box"><div class="val total">${total}</div><div class="label">Total Records</div></div>
                        <div class="summary-box"><div class="val ok">${imported}</div><div class="label">Imported</div></div>
                        <div class="summary-box"><div class="val warn">${duplicates}</div><div class="label">Duplicates</div></div>
                        <div class="summary-box"><div class="val err">${errors}</div><div class="label">Errors</div></div>
                    </div>
                    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:18px;">
                        ${imported} student${imported !== 1 ? 's' : ''} can now log in with their matric number to activate their voting account.
                    </p>
                    <div class="btn-row">
                        <button class="btn-secondary" onclick="renderUploadScreen()"><i class="fa-solid fa-file-arrow-up"></i> Import Another File</button>
                        <button class="btn-primary" onclick="window.location.href='admin-dashboard.html'"><i class="fa-solid fa-house"></i> Dashboard</button>
                    </div>
                </div>
            </div>`;
    }
</script>
</body>
</html>
