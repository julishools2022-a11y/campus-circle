<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify Email | Campus Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1628">
    <style>
        :root {
            --bg: #0a1628;
            --surface: #112236;
            --surface2: #1a2f4a;
            --border: rgba(61,114,180,0.25);
            --primary: #3d72b4;
            --primary-bright: #5b9bd5;
            --accent: #64b5f6;
            --text: #e2eaf4;
            --text-muted: #7a9cc0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(61,114,180,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61,114,180,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(61,114,180,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .brand-logo { width: 56px; height: 56px; margin: 0 auto 10px; display: block; border-radius: 14px; }
        .brand-name { font-size: 1.5rem; font-weight: 900; color: var(--text); }
        .brand-name span { color: var(--accent); }
        .brand-sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(61,114,180,0.1);
            text-align: center;
        }

        .envelope-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(61,114,180,0.12);
            border: 1px solid rgba(61,114,180,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(61,114,180,0.3); }
            50% { box-shadow: 0 0 0 10px rgba(61,114,180,0); }
        }
        .envelope-wrap i { font-size: 1.8rem; color: var(--accent); }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 10px;
        }

        .card-sub {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .email-highlight {
            color: var(--accent);
            font-weight: 700;
        }

        .info-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 16px 0 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.6;
            text-align: left;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .info-box i { color: var(--accent); margin-top: 2px; flex-shrink: 0; }

        .btn-resend {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-bright));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(61,114,180,0.3);
        }
        .btn-resend:active { transform: scale(0.98); }
        .btn-resend:disabled { opacity: 0.5; cursor: not-allowed; }

        #status-msg {
            margin-top: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
            display: none;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .footer-link a { color: var(--accent); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <div class="brand">
        <img src="1000367752.jpg" class="brand-logo" alt="Campus Circle" onerror="this.style.display='none'">
        <div class="brand-name">Campus <span>Circle</span></div>
        <div class="brand-sub">UNIZIK Student Marketplace</div>
    </div>

    <div class="card">
        <div class="envelope-wrap">
            <i class="fa-regular fa-envelope"></i>
        </div>

        <div class="card-title">Check Your Email 📬</div>
        <div class="card-sub">
            We sent a confirmation link to<br>
            <span id="user-email" class="email-highlight">your email address</span>
        </div>

        <div class="info-box">
            <i class="fa-solid fa-circle-info"></i>
            <span>Click the link in your inbox to activate your account. If you don't see it, check your <strong>Spam</strong> or <strong>Junk</strong> folder.</span>
        </div>

        <button id="resend-btn" class="btn-resend" onclick="resendEmail()">
            <i class="fa-solid fa-paper-plane"></i> Resend Confirmation Email
        </button>

        <div id="status-msg"></div>

        <div class="footer-link">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Get Email from URL
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');

        if (email) {
            document.getElementById('user-email').textContent = email;
        }

        // 2. Resend Function
        async function resendEmail() {
            if (!email) return alert("Error: No email address found.");

            const btn = document.getElementById('resend-btn');
            const msg = document.getElementById('status-msg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';

            const currentUrl = window.location.origin;

            const { error } = await _supabase.auth.resend({
                type: 'signup',
                email: email,
                options: {
                    emailRedirectTo: currentUrl + '/dashboard.html'
                }
            });

            if (error) {
                msg.style.display = 'block';
                msg.style.color = 'var(--danger)';
                msg.textContent = "Error: " + error.message;
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Resend Confirmation Email';
            } else {
                msg.style.display = 'block';
                msg.style.color = 'var(--success)';
                msg.textContent = "✅ Email sent! Check your inbox.";
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Sent!';
            }
        }
    </script>
</body>
</html>
