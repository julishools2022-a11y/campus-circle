<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Companion | Campus Circle</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --white: #ffffff; --text: #1e293b; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }

        .container { max-width: 800px; margin: 0 auto; }
        
        /* HEADER */
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { text-decoration: none; color: var(--text); font-size: 1.2rem; }
        
        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: white; border-radius: 12px; font-weight: 600; color: #64748b; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }

        /* LOADING STATE */
        #loading-box { text-align: center; padding: 50px; display: none; }
        .spinner { font-size: 40px; color: var(--primary); animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* QUIZ CARDS */
        .quiz-card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .question { font-weight: 700; font-size: 1.1rem; margin-bottom: 15px; }
        .option { display: block; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .option:hover { background: #f1f5f9; }
        .option.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; }
        .option.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

        /* FLASHCARDS */
        .flashcard-container { perspective: 1000px; height: 300px; cursor: pointer; display: none; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; font-size: 1.2rem; background: white; border-radius: 20px; flex-direction: column; }
        .front { background: white; color: var(--text); border: 2px solid var(--primary); }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }
        
        .controls { display: flex; justify-content: space-between; margin-top: 20px; display: none; }
        .ctrl-btn { padding: 10px 20px; border: none; background: white; border-radius: 8px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="resources.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
            <h2 style="margin:0">AI Study Partner</h2>
            <span style="font-size:0.9rem; color:#64748b;" id="doc-title">Analyzing Document...</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')"><i class="fa-solid fa-circle-question"></i> Quiz Mode</button>
        <button class="tab-btn" onclick="switchTab('flashcard')"><i class="fa-solid fa-layer-group"></i> Flashcards</button>
    </div>

    <div id="loading-box">
        <i class="fa-solid fa-circle-notch spinner"></i>
        <p id="loading-text">Reading PDF...</p>
    </div>

    <div id="quiz-container"></div>

    <div id="flashcard-section" style="display:none;">
        <div class="flashcard-container" onclick="this.children[0].classList.toggle('flipped')">
            <div class="flashcard" id="active-card">
                <div class="front">
                    <small style="color:#64748b; margin-bottom:10px;">QUESTION</small>
                    <h3 id="fc-front">Generating...</h3>
                    <small style="margin-top:auto; font-size:0.8rem;">Tap to flip</small>
                </div>
                <div class="back">
                    <small style="opacity:0.8; margin-bottom:10px;">ANSWER</small>
                    <h3 id="fc-back">...</h3>
                </div>
            </div>
        </div>
        
        <div class="controls" id="fc-controls">
            <button class="ctrl-btn" onclick="prevCard()">← Previous</button>
            <span id="fc-count" style="align-self:center; font-weight:600;">1 / 5</span>
            <button class="ctrl-btn" onclick="nextCard()">Next →</button>
        </div>
    </div>

</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // 🔴 REPLACE WITH YOUR GEMINI API KEY (Get from aistudio.google.com)
    const API_KEY = "AIzaSyAuUM8M2PpRiMUHiOpwrxTrv6B2xTgJwR8"; 
    const genAI = new GoogleGenerativeAI(API_KEY);

    let pdfText = "";
    let quizData = [];
    let flashcardData = [];
    let currentCardIndex = 0;

    // 1. Init: Get File URL from URL Parameters
    window.onload = async () => {
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('url');
        const title = params.get('title');
        
        if(title) document.getElementById('doc-title').innerText = title;
        if(fileUrl) {
            document.getElementById('loading-box').style.display = 'block';
            await extractTextFromPDF(fileUrl);
        } else {
            alert("No document selected!");
        }
    };

    // 2. Extract Text using PDF.js
    async function extractTextFromPDF(url) {
        try {
            const loadingTask = pdfjsLib.getDocument(url);
            const pdf = await loadingTask.promise;
            let fullText = "";

            // Read first 5 pages (to save tokens/time)
            const maxPages = Math.min(pdf.numPages, 5);
            
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + "\n";
            }

            pdfText = fullText;
            document.getElementById('loading-text').innerText = "AI is generating questions...";
            await generateAIContent();

        } catch (error) {
            console.error(error);
            alert("Could not read PDF. It might be an image scan.");
            document.getElementById('loading-box').style.display = 'none';
        }
    }

    // 3. Call Gemini AI
    async function generateAIContent() {
        try {
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            
            const prompt = `
            Analyze this text and generate study material in strict JSON format.
            Do not include Markdown formatting (like \`\`\`json). Just the raw JSON.
            
            Structure:
            {
                "quiz": [
                    {"q": "Question text?", "options": ["A", "B", "C", "D"], "a": "Correct Option Text"}
                ],
                "flashcards": [
                    {"front": "Term/Concept", "back": "Definition/Explanation"}
                ]
            }

            Generate 5 quiz questions and 5 flashcards.
            
            Text to analyze:
            ${pdfText.substring(0, 5000)} 
            `;
            // Limit text length to avoid token limits

            const result = await model.generateContent(prompt);
            const response = await result.response;
            const text = response.text();
            
            // Clean AI response (remove markdown if present)
            const cleanJson = text.replace(/```json|```/g, '').trim();
            const data = JSON.parse(cleanJson);

            quizData = data.quiz;
            flashcardData = data.flashcards;

            renderQuiz();
            setupFlashcards();
            document.getElementById('loading-box').style.display = 'none';

        } catch (error) {
            console.error("AI Error:", error);
            alert("AI generation failed. Try again.");
            document.getElementById('loading-box').style.display = 'none';
        }
    }

    // 4. Render Quiz
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = quizData.map((q, index) => `
            <div class="quiz-card">
                <div class="question">${index + 1}. ${q.q}</div>
                ${q.options.map(opt => `
                    <div class="option" onclick="checkAnswer(this, '${opt}', '${q.a}')">${opt}</div>
                `).join('')}
            </div>
        `).join('');
    }

    // Expose function to window for HTML onclick
    window.checkAnswer = (element, selected, correct) => {
        if(element.parentElement.classList.contains('answered')) return; // Prevent re-click
        
        element.parentElement.classList.add('answered');
        if (selected === correct) {
            element.classList.add('correct');
        } else {
            element.classList.add('wrong');
            // Highlight correct one
            const siblings = element.parentElement.children;
            for(let sib of siblings) {
                if(sib.innerText === correct) sib.classList.add('correct');
            }
        }
    };

    // 5. Flashcard Logic
    function setupFlashcards() {
        if(flashcardData.length > 0) {
            document.getElementById('fc-controls').style.display = 'flex';
            updateCardDisplay();
        }
    }

    function updateCardDisplay() {
        const card = flashcardData[currentCardIndex];
        document.getElementById('fc-front').innerText = card.front;
        document.getElementById('fc-back').innerText = card.back;
        document.getElementById('fc-count').innerText = `${currentCardIndex + 1} / ${flashcardData.length}`;
        
        // Reset flip
        document.getElementById('active-card').classList.remove('flipped');
    }

    window.nextCard = () => {
        if(currentCardIndex < flashcardData.length - 1) {
            currentCardIndex++;
            updateCardDisplay();
        }
    };

    window.prevCard = () => {
        if(currentCardIndex > 0) {
            currentCardIndex--;
            updateCardDisplay();
        }
    };

    // 6. Tabs
    window.switchTab = (mode) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active'); // Assumes simple click

        if(mode === 'quiz') {
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.querySelector('.flashcard-container').style.display = 'none';
        } else {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.querySelector('.flashcard-container').style.display = 'block';
        }
    };
</script>

</body>
  </html>
