<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Study Partner | Campus Circle</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; --chat-user: #4f46e5; --chat-ai: #ffffff; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 900px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        /* HEADER */
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        .back-btn { text-decoration: none; color: var(--text); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin: 0; font-size: 1.4rem; color: var(--primary); }

        /* TABS */
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; background: white; padding: 8px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .tab-btn { padding: 10px 5px; border: none; background: transparent; border-radius: 10px; font-weight: 700; color: #64748b; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.75rem; }
        .tab-btn i { font-size: 1.2rem; margin-bottom: 2px; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }

        /* SECTIONS */
        .section-view { display: none; flex: 1; flex-direction: column; animation: fadeIn 0.3s ease-out; }
        .section-view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* UI HELPERS */
        .action-btn { background: var(--primary); color: white; padding: 14px; border: none; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .secondary-btn { background: white; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
        .setup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; background: white; font-size: 1rem; }
        .style-input { width: 100%; padding: 12px; border: 1px solid #fde68a; border-radius: 10px; font-family: inherit; margin-top: 10px; }
        .theory-trainer { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        
        /* LOADING & UPLOAD */
        #loading-box { text-align: center; padding: 60px 20px; display: none; }
        .spinner { font-size: 30px; animation: spin 1s infinite linear; color: var(--primary); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #upload-box { display: none; text-align: center; padding: 40px; background: white; border-radius: 16px; margin-top: 20px; border: 2px dashed #cbd5e1; }
        .upload-area { border: 2px dashed #f59e0b; border-radius: 12px; padding: 20px; text-align: center; background: rgba(255, 251, 235, 0.5); cursor: pointer; }

        /* QUIZ & THEORY CARDS */
        .theory-card, .quiz-card { background: white; padding: 20px; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 15px; }
        .theory-q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 15px; }
        .answer-box { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 1rem; min-height: 150px; resize: vertical; margin-bottom:15px; }
        .answer-box:focus { border-color: var(--primary); outline: none; }
        .option { padding: 12px; border: 1px solid #e2e8f0; margin-top: 8px; border-radius: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .option.correct { background: #dcfce7; border-color: #22c55e; color: #166534; pointer-events: none; }
        .option.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; opacity: 0.8; pointer-events: none; }
        .explanation { display: none; margin-top: 15px; padding: 15px; background: #eff6ff; border-left: 4px solid #3b82f6; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; color: #1e3a8a; }
        .score-header { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; font-weight: 700; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }
        .result-screen { text-align: center; padding: 40px; background: white; border-radius: 20px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 20px; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; margin: 0 auto 20px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); }
        .grading-box { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; animation: slideUp 0.3s; border:1px solid #e2e8f0; }
        .grading-box.good { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
        .grading-box.avg { background: #fffbeb; border-color: #fde68a; color: #92400e; }
        .grading-box.bad { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

        /* FLASHCARDS */
        .flashcard-container { height: 300px; cursor: pointer; perspective: 1000px; margin-bottom: 20px; width: 100%; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; border-radius: 20px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1); }
        .front { background: white; border: 2px solid var(--primary); }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); overflow-y: auto; }

        /* CHAT UI FIXED */
        #chat-section { 
            height: calc(100vh - 180px); /* Fixed height calculation */
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        .chat-history { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            background: #eef2ff; 
            border-radius: 20px; 
            margin-bottom: 10px; 
        }
        .msg { padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
        .msg.user { background: var(--primary); color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 2px; }
        .msg.ai { background: white; color: var(--text); align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        
        .chat-input-area { 
            display: flex; 
            align-items: center; /* Vertically center */
            gap: 10px; 
            padding: 10px 0;
            background: var(--bg);
        }
        #chat-input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid #e2e8f0; 
            border-radius: 25px; 
            height: 50px; /* Fixed height to match button */
            font-size: 1rem;
        }
        .send-btn {
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0; /* Prevent squishing */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="resources.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
            <h2>Study Companion</h2>
            <span id="doc-title" style="font-size:0.9rem; color:#64748b;">Loading document...</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-target="quiz" onclick="switchTab('quiz')"><i class="fa-solid fa-list-check"></i> CBT Quiz</button>
        <button class="tab-btn" data-target="theory" onclick="switchTab('theory')"><i class="fa-solid fa-pen-nib"></i> Theory</button>
        <button class="tab-btn" data-target="flashcard" onclick="switchTab('flashcard')"><i class="fa-solid fa-layer-group"></i> Flash</button>
        <button class="tab-btn" data-target="chat" onclick="switchTab('chat')"><i class="fa-solid fa-robot"></i> Chat</button>
    </div>

    <div id="loading-box">
        <i class="fa-solid fa-circle-notch spinner"></i><h3 id="loading-text">Processing PDF...</h3>
    </div>

    <div id="upload-box">
        <h3>Upload PDF</h3>
        <input type="file" id="manual-file" accept="application/pdf" onchange="handleManualUpload(this)">
    </div>

    <div id="quiz-section" class="section-view active">
        <div id="quiz-setup" style="text-align:center; padding:30px; background:white; border-radius:20px;">
            <h3>CBT Practice</h3>
            <div class="setup-row">
                <div><label>Questions</label><select id="q-count"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option></select></div>
                <div><label>Difficulty</label><select id="q-diff"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
            </div>
            <button class="action-btn" onclick="startGen('quiz')">Generate Quiz</button>
        </div>
        
        <div id="quiz-active" style="display:none;">
            <div class="score-header">
                <span>Score: <span id="current-score">0</span></span>
                <span id="quiz-progress">0/0</span>
            </div>
            <div id="quiz-list"></div>
        </div>

        <div id="quiz-result" class="result-screen">
            <div class="score-circle" id="final-score">0%</div>
            <h3>Quiz Completed!</h3>
            <button class="action-btn" onclick="resetQuiz()">Start Again</button>
        </div>
    </div>

    <div id="theory-section" class="section-view">
        <div id="theory-setup">
            <div class="theory-trainer">
                <h3 style="color:#92400e; margin-top:0;">Lecturer Style</h3>
                <select id="t-diff"><option value="medium">Medium</option><option value="hard">Hard</option></select>
                <div class="upload-area" onclick="document.getElementById('style-img-input').click()" style="margin-top:10px;">
                    <i class="fa-solid fa-camera"></i> Upload Exam Image
                    <input type="file" id="style-img-input" accept="image/*" style="display:none" onchange="previewStyleImage(this)">
                    <img id="style-preview" style="max-height:80px; display:none; margin:10px auto;">
                </div>
                <textarea class="style-input" id="lecturer-style" placeholder="Or type style..."></textarea>
            </div>
            <button class="action-btn" onclick="startGen('theory')">Start Theory Exam</button>
        </div>

        <div id="theory-active" style="display:none;">
            <div class="score-header">
                <span>Total: <span id="theory-score">0</span>/<span id="theory-max">50</span></span>
                <span>Q <span id="t-num">1</span> of 5</span>
            </div>
            <div class="theory-card">
                <div class="theory-q-text" id="t-question">Loading...</div>
                <textarea class="answer-box" id="t-answer" placeholder="Type answer..."></textarea>
                <div id="t-feedback" class="grading-box"></div>
                <div style="display:flex; gap:10px;">
                    <button class="action-btn" id="btn-grade" onclick="gradeAnswer()" style="background:#0f172a;">Grade</button>
                    <button class="action-btn" id="btn-next" onclick="nextTheoryQ()" style="display:none;">Next</button>
                </div>
            </div>
        </div>

        <div id="theory-result" class="result-screen">
            <div class="score-circle" id="final-theory-score">0</div>
            <h3>Exam Completed!</h3>
            <button class="action-btn" onclick="resetTheory()">Start New Exam</button>
        </div>
    </div>

    <div id="flashcard-section" class="section-view">
        <div id="fc-setup" style="text-align:center; padding:40px; background:white; border-radius:20px;">
            <h3>Flashcards</h3>
            <button class="action-btn" onclick="startGen('flashcard')">Create Deck</button>
        </div>
        <div id="fc-active" style="display:none;">
            <div class="flashcard-container" onclick="toggleFlip()">
                <div class="flashcard" id="active-card">
                    <div class="front"><small>TERM</small><h3 id="fc-front">...</h3></div>
                    <div class="back"><small>DEFINITION</small><h3 id="fc-back">...</h3></div>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <button class="secondary-btn" onclick="prevCard()" style="width:48%;">Prev</button>
                <button class="secondary-btn" onclick="nextCard()" style="width:48%;">Next</button>
            </div>
            <button class="action-btn" onclick="resetFlashcards()" style="background:#334155;">Regenerate Deck</button>
        </div>
    </div>

    <div id="chat-section" class="section-view">
        <div class="chat-history" id="chat-history">
            <div class="msg ai">I'm ready. Ask me anything!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

</div>
                        <script>
    const API_KEY = "AIzaSyDLlBs1oVQ3ZVVBiX8QL6XPERjXvxk5FUs"; 
    const AI_MODEL = "gemini-3-flash-preview"; 

    let pdfText = "";
    let quizData = [], score = 0, answeredCount = 0;
    let theoryQuestions = [], currentTheoryIndex = 0, theoryTotalScore = 0;
    let flashcardData = [], currentCardIndex = 0;
    let styleImageBase64 = null;

    // --- INIT ---
    window.onload = async () => {
        switchTab('quiz');
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        const title = params.get('title');
        if(title) document.getElementById('doc-title').innerText = title;
        document.querySelectorAll('.section-view').forEach(el => el.style.display = 'none');

        if(url) {
            document.getElementById('loading-box').style.display = 'block';
            await extractTextFromURL(url);
        } else {
            document.getElementById('upload-box').style.display = 'block';
        }
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.tab-btn[data-target="${tabId}"]`);
        if(btn) btn.classList.add('active');

        document.querySelectorAll('.section-view').forEach(el => { el.style.display = 'none'; el.classList.remove('active'); });
        const target = document.getElementById(`${tabId}-section`);
        target.style.display = (tabId === 'chat') ? 'flex' : 'block';
        setTimeout(() => target.classList.add('active'), 10);
    }

    // --- PDF ---
    async function extractTextFromURL(url) {
        try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            const blob = await response.blob();
            const arrayBuffer = await blob.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            let fullText = "";
            for(let i=1; i<=Math.min(pdf.numPages, 15); i++){
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + "\n";
            }
            pdfText = fullText;
            document.getElementById('loading-box').style.display = 'none';
            switchTab('quiz');
        } catch (e) {
            document.getElementById('loading-box').innerHTML = "<p>Error loading PDF. Use Manual Upload.</p>";
        }
    }

    window.handleManualUpload = (input) => {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = async function(e) {
            const typedarray = new Uint8Array(e.target.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let fullText = "";
            for(let i=1; i<=Math.min(pdf.numPages, 15); i++){
                const page = await pdf.getPage(i);
                const text = await page.getTextContent();
                fullText += text.items.map(s => s.str).join(" ");
            }
            pdfText = fullText;
            document.getElementById('upload-box').style.display = 'none';
            switchTab('quiz');
        };
        reader.readAsArrayBuffer(file);
    };

    window.previewStyleImage = function(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('style-preview').src = e.target.result;
                document.getElementById('style-preview').style.display = 'block';
                styleImageBase64 = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }
    };

    // --- AI CALL ---
    async function startGen(type) {
        if(!pdfText) return alert("Upload PDF first!");
        const btn = document.querySelector(`#${type}-section .action-btn`);
        const originalText = btn.innerHTML;
        btn.innerHTML = "Generating..."; btn.disabled = true;

        let prompt = "";
        let contents = [];
        
        if(type === 'quiz') {
            const count = document.getElementById('q-count').value;
            const diff = document.getElementById('q-diff').value;
            prompt = `Generate ${count} multiple-choice questions (Diff: ${diff}). JSON format strictly: { "quiz": [{"q":"...","options":["A","B","C","D"],"a":"Correct Answer String","explanation":"Why"}] }`;
            contents = [{ parts: [{ text: `${prompt}\n\nCONTEXT:\n${pdfText.substring(0, 20000)}` }] }];
        } else if(type === 'theory') {
            const diff = document.getElementById('t-diff').value;
            const style = document.getElementById('lecturer-style').value;
            prompt = `Generate 5 theory questions (Diff: ${diff}). Style: ${style}. Return strictly a JSON Object: { "questions": ["Q1...", "Q2..."] }`;
            const parts = [{ text: prompt }, { text: `CONTEXT:\n${pdfText.substring(0, 20000)}` }];
            if(styleImageBase64) parts.push({ inlineData: { mimeType: "image/jpeg", data: styleImageBase64 } });
            contents = [{ parts: parts }];
        } else if(type === 'flashcard') {
            prompt = `Generate 15 flashcards. JSON: { "flashcards": [{"front":"Term","back":"Definition"}] }`;
            contents = [{ parts: [{ text: `${prompt}\n\nCONTEXT:\n${pdfText.substring(0, 20000)}` }] }];
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${API_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: contents })
            });
            const data = await response.json();
            
            // Clean JSON
            let rawText = data.candidates[0].content.parts[0].text;
            const jsonStart = rawText.indexOf('{');
            const jsonEnd = rawText.lastIndexOf('}');
            if (jsonStart !== -1 && jsonEnd !== -1) {
                rawText = rawText.substring(jsonStart, jsonEnd + 1);
            }
            const parsed = JSON.parse(rawText);

            if(type === 'quiz') { quizData = parsed.quiz; renderQuiz(); }
            if(type === 'theory') { theoryQuestions = parsed.questions; theoryTotalScore = 0; currentTheoryIndex = 0; renderTheory(); }
            if(type === 'flashcard') { flashcardData = parsed.flashcards; setupFlashcards(); }

        } catch(e) { 
            console.error(e);
            alert("AI Error. Model may be busy or PDF too large."); 
        }
        btn.innerHTML = originalText; btn.disabled = false;
    }

    // --- QUIZ (FIXED CLICKABLE OPTIONS) ---
    function renderQuiz() {
        score = 0; answeredCount = 0;
        document.getElementById('quiz-setup').style.display = 'none';
        document.getElementById('quiz-result').style.display = 'none';
        document.getElementById('quiz-active').style.display = 'block';
        document.getElementById('current-score').innerText = "0";
        document.getElementById('quiz-progress').innerText = `0/${quizData.length}`;
        const list = document.getElementById('quiz-list');
        list.innerHTML = "";
        
        quizData.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'quiz-card';
            div.id = `q-card-${i}`;
            
            // 1. Add Question Text
            const qText = document.createElement('div');
            qText.innerHTML = `<strong>${i+1}. ${q.q}</strong>`;
            div.appendChild(qText);

            // 2. Add Options Container (so we can find it later)
            const optsContainer = document.createElement('div');
            optsContainer.id = `opts-${i}`;
            div.appendChild(optsContainer);

            // 3. Add Options
            q.options.forEach(opt => {
                const b = document.createElement('div'); 
                b.className = 'option'; 
                b.innerText = opt;
                // Pass the specific container div to checkAns
                b.onclick = () => checkAns(i, b, opt, q.a, div);
                optsContainer.appendChild(b);
            });

            // 4. Add Explanation (Hidden by default)
            const exp = document.createElement('div');
            exp.className = 'explanation';
            exp.innerHTML = `💡 ${q.explanation || "No explanation provided."}`;
            div.appendChild(exp);

            list.appendChild(div);
        });
    }

    function checkAns(idx, el, sel, cor, parentDiv) {
        // Prevent double clicking using the options container
        const optsContainer = document.getElementById(`opts-${idx}`);
        if(optsContainer.classList.contains('answered')) return;
        
        optsContainer.classList.add('answered');
        answeredCount++;
        
        if(sel === cor) { 
            el.classList.add('correct'); 
            score++; 
        } else { 
            el.classList.add('wrong'); 
            // Highlight correct answer
            Array.from(optsContainer.children).forEach(child => {
                if(child.innerText === cor) child.classList.add('correct');
            });
        }
        
        // Show Explanation
        const expDiv = parentDiv.querySelector('.explanation');
        if(expDiv) expDiv.style.display = 'block';

        document.getElementById('current-score').innerText = score;
        document.getElementById('quiz-progress').innerText = `${answeredCount}/${quizData.length}`;

        if(answeredCount === quizData.length) {
            setTimeout(() => {
                document.getElementById('quiz-active').style.display = 'none';
                document.getElementById('quiz-result').style.display = 'block';
                document.getElementById('final-score').innerText = Math.round((score/quizData.length)*100) + "%";
            }, 1500);
        }
    }
    function resetQuiz() { document.getElementById('quiz-result').style.display = 'none'; document.getElementById('quiz-setup').style.display = 'block'; }

    // --- THEORY ---
    function renderTheory() {
        document.getElementById('theory-setup').style.display = 'none';
        document.getElementById('theory-result').style.display = 'none';
        document.getElementById('theory-active').style.display = 'block';
        
        document.getElementById('theory-score').innerText = theoryTotalScore;
        document.getElementById('theory-max').innerText = theoryQuestions.length * 10;
        document.getElementById('t-num').innerText = currentTheoryIndex + 1;
        document.getElementById('t-question').innerText = theoryQuestions[currentTheoryIndex];
        
        document.getElementById('t-answer').value = "";
        document.getElementById('t-feedback').style.display = 'none';
        document.getElementById('btn-grade').style.display = 'block';
        document.getElementById('btn-next').style.display = 'none';
    }

    async function gradeAnswer() {
        const ans = document.getElementById('t-answer').value;
        if(ans.length < 5) return alert("Please type an answer.");
        const btn = document.getElementById('btn-grade');
        btn.innerHTML = "Grading..."; btn.disabled = true;

        const prompt = `Grade this answer /10. Question: "${theoryQuestions[currentTheoryIndex]}". Answer: "${ans}". Context: ${pdfText.substring(0, 5000)}. Format Response: Score: X/10. Feedback: ...`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${API_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            
            const fbBox = document.getElementById('t-feedback');
            fbBox.innerHTML = marked.parse(text);
            fbBox.style.display = 'block';

            // Extract Score
            const scoreMatch = text.match(/(\d+)\/10/);
            if(scoreMatch) {
                theoryTotalScore += parseInt(scoreMatch[1]);
                document.getElementById('theory-score').innerText = theoryTotalScore;
            }

            btn.style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';
        } catch(e) { alert("Grading failed"); }
        btn.innerHTML = "Grade Answer"; btn.disabled = false;
    }

    function nextTheoryQ() {
        currentTheoryIndex++;
        if(currentTheoryIndex < theoryQuestions.length) {
            renderTheory();
        } else {
            document.getElementById('theory-active').style.display = 'none';
            document.getElementById('theory-result').style.display = 'block';
            document.getElementById('final-theory-score').innerText = theoryTotalScore + "/" + (theoryQuestions.length * 10);
        }
    }
    function resetTheory() { document.getElementById('theory-result').style.display = 'none'; document.getElementById('theory-setup').style.display = 'block'; }

    // --- FLASHCARDS & CHAT ---
    function setupFlashcards() {
        document.getElementById('fc-setup').style.display = 'none';
        document.getElementById('fc-active').style.display = 'block';
        updateCard();
    }
    function updateCard() {
        const c = flashcardData[currentCardIndex];
        document.getElementById('fc-front').innerText = c.front;
        document.getElementById('fc-back').innerText = c.back;
        document.getElementById('fc-count').innerText = `${currentCardIndex+1}/${flashcardData.length}`;
        document.getElementById('active-card').classList.remove('flipped');
    }
    window.toggleFlip = () => document.getElementById('active-card').classList.toggle('flipped');
    window.nextCard = () => { if(currentCardIndex < flashcardData.length-1) { currentCardIndex++; updateCard(); } };
    window.prevCard = () => { if(currentCardIndex > 0) { currentCardIndex--; updateCard(); } };
    window.resetFlashcards = () => { document.getElementById('fc-active').style.display = 'none'; document.getElementById('fc-setup').style.display = 'block'; };

    window.sendMessage = async function() {
        const input = document.getElementById('chat-input');
        const msg = input.value;
        if(!msg) return;
        const hist = document.getElementById('chat-history');
        hist.innerHTML += `<div class="msg user">${msg}</div>`;
        input.value = "";
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${API_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Context: ${pdfText.substring(0,10000)}\nUser: ${msg}` }] }] })
            });
            const data = await response.json();
            hist.innerHTML += `<div class="msg ai">${marked.parse(data.candidates[0].content.parts[0].text)}</div>`;
            hist.scrollTop = hist.scrollHeight;
        } catch(e) {}
    }
                </script>
    

</body>
