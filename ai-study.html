<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Study Partner | Campus Circle</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-dark: #4338ca;
            --bg: #f8fafc; 
            --surface: #ffffff;
            --text: #1e293b; 
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); min-height: 100vh; }

        .container { max-width: 800px; margin: 0 auto; }
        
        /* HEADER */
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
        .back-btn { 
            text-decoration: none; color: var(--text); font-size: 1.2rem; 
            width: 40px; height: 40px; border-radius: 50%; background: white;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); }
        
        .doc-meta h2 { margin: 0; font-size: 1.4rem; color: var(--primary); }
        .doc-meta span { font-size: 0.9rem; color: var(--text-light); }

        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 5px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .tab-btn { 
            flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; 
            font-weight: 600; color: var(--text-light); cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .tab-btn.active { background: var(--primary); color: white; shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }

        /* LOADING STATE */
        #loading-box { 
            text-align: center; padding: 60px 20px; background: white; border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; animation: fadeIn 0.3s;
        }
        .spinner { font-size: 40px; color: var(--primary); animation: spin 1s infinite linear; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        /* QUIZ CARDS */
        .quiz-card { 
            background: white; padding: 25px; border-radius: 16px; margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; animation: fadeIn 0.4s;
        }
        .question { font-weight: 700; font-size: 1.1rem; margin-bottom: 15px; color: var(--text); }
        .option { 
            display: block; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; 
            margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .option:active { transform: scale(0.99); }
        .option.correct { background: #dcfce7; border-color: var(--success); color: #166534; font-weight: 700; }
        .option.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; opacity: 0.7; }
        .answered { pointer-events: none; }

        /* FLASHCARDS */
        .flashcard-section { display: none; perspective: 1000px; }
        .flashcard-container { 
            height: 350px; cursor: pointer; position: relative;
        }
        .flashcard { 
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d; 
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .flipped { transform: rotateY(180deg); }
        
        .front, .back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 30px; text-align: center; border-radius: 20px; 
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1);
        }
        .front { background: white; border: 2px solid var(--primary); color: var(--text); }
        .back { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; transform: rotateY(180deg); }
        
        .card-label { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; font-weight: 700; margin-bottom: 15px; opacity: 0.7; }
        .card-content { font-size: 1.3rem; font-weight: 700; line-height: 1.5; }
        .card-hint { margin-top: auto; font-size: 0.8rem; opacity: 0.5; }

        /* CONTROLS */
        .controls { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 25px; background: white; padding: 10px; border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none;
        }
        .ctrl-btn { 
            padding: 12px 20px; border: none; background: #f1f5f9; border-radius: 10px; 
            font-weight: 600; cursor: pointer; color: var(--text); transition: 0.2s;
        }
        .ctrl-btn:active { background: #e2e8f0; }

        /* UPLOAD BOX (Fallback) */
        #upload-box { display: none; text-align: center; padding: 40px; background: white; border-radius: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="resources.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="doc-meta">
            <h2>AI Study Partner</h2>
            <span id="doc-title">Initializing...</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')"><i class="fa-solid fa-circle-question"></i> Quiz Mode</button>
        <button class="tab-btn" onclick="switchTab('flashcard')"><i class="fa-solid fa-layer-group"></i> Flashcards</button>
    </div>

    <div id="loading-box">
        <i class="fa-solid fa-circle-notch spinner"></i>
        <h3 id="loading-text" style="margin:0; color:var(--text);">Reading Document...</h3>
        <p style="color:var(--text-light); margin-top:5px; font-size:0.9rem;">This may take a few seconds.</p>
    </div>

    <div id="quiz-container"></div>

    <div id="flashcard-section" class="flashcard-section">
        <div class="flashcard-container" onclick="toggleFlip()">
            <div class="flashcard" id="active-card">
                <div class="front">
                    <span class="card-label">Question</span>
                    <div class="card-content" id="fc-front">Loading...</div>
                    <span class="card-hint">Tap to flip</span>
                </div>
                <div class="back">
                    <span class="card-label">Answer</span>
                    <div class="card-content" id="fc-back">...</div>
                </div>
            </div>
        </div>
        
        <div class="controls" id="fc-controls">
            <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-chevron-left"></i> Prev</button>
            <span id="fc-count" style="font-weight:700; color:var(--primary);">1 / 5</span>
            <button class="ctrl-btn" onclick="nextCard()">Next <i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="upload-box">
        <i class="fa-solid fa-file-circle-exclamation" style="font-size:3rem; color:var(--text-light); margin-bottom:15px;"></i>
        <h3>Couldn't Load Automatically</h3>
        <p style="color:var(--text-light); margin-bottom:20px;">Please upload the PDF manually to continue.</p>
        <input type="file" id="manual-file" accept="application/pdf" onchange="handleManualUpload(this)" style="display:none">
        <button onclick="document.getElementById('manual-file').click()" class="ctrl-btn" style="background:var(--primary); color:white; width:100%;">
            Choose PDF File
        </button>
    </div>

</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // 🔴 YOUR GEMINI API KEY
    const API_KEY = "AIzaSyAuUM8M2PpRiMUHiOpwrxTrv6B2xTgJwR8"; 
    const genAI = new GoogleGenerativeAI(API_KEY);

    let pdfText = "";
    let quizData = [];
    let flashcardData = [];
    let currentCardIndex = 0;

    // 1. INIT
    window.onload = async () => {
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('url');
        const title = params.get('title');
        
        if(title) document.getElementById('doc-title').innerText = title;
        
        if(fileUrl) {
            document.getElementById('loading-box').style.display = 'block';
            await extractTextFromURL(fileUrl);
        } else {
            document.getElementById('doc-title').innerText = "Upload a Document";
            document.getElementById('upload-box').style.display = 'block';
        }
    };

    // 2. FETCH PDF (With NEW PROXY: allorigins.win)
    async function extractTextFromURL(url) {
        try {
            document.getElementById('loading-text').innerText = "Downloading PDF...";
            
            // ✅ NEW PROXY: 'allorigins.win' is more reliable than corsproxy.io
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Network error");
            
            const blob = await response.blob();
            const arrayBuffer = await blob.arrayBuffer();

            // Load into PDF.js
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            await processPDF(pdf);

        } catch (error) {
            console.error("Fetch Error:", error);
            // Show upload fallback if auto-fetch fails
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('upload-box').style.display = 'block';
        }
    }

    // 3. MANUAL UPLOAD HANDLER
    window.handleManualUpload = async (input) => {
        const file = input.files[0];
        if(!file) return;

        document.getElementById('upload-box').style.display = 'none';
        document.getElementById('loading-box').style.display = 'block';
        document.getElementById('doc-title').innerText = file.name;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const typedarray = new Uint8Array(e.target.result);
            const loadingTask = pdfjsLib.getDocument(typedarray);
            const pdf = await loadingTask.promise;
            await processPDF(pdf);
        };
        reader.readAsArrayBuffer(file);
    };

    // 4. EXTRACT TEXT
    async function processPDF(pdf) {
        document.getElementById('loading-text').innerText = "Analyzing Text...";
        let fullText = "";
        const maxPages = Math.min(pdf.numPages, 10); // Limit to 10 pages for speed
        
        for (let i = 1; i <= maxPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += pageText + "\n";
        }

        pdfText = fullText;
        document.getElementById('loading-text').innerText = "Generating Quiz & Cards...";
        await generateAIContent();
    }

    // 5. CALL GEMINI AI
    async function generateAIContent() {
        try {
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            const prompt = `
            Analyze this text. Return ONLY valid JSON. No markdown.
            Format:
            {
                "quiz": [
                    {"q": "Question?", "options": ["A", "B", "C", "D"], "a": "Correct String"}
                ],
                "flashcards": [
                    {"front": "Term", "back": "Definition"}
                ]
            }
            Generate 5 questions and 5 flashcards.
            Text: ${pdfText.substring(0, 10000)}`;

            const result = await model.generateContent(prompt);
            const text = result.response.text().replace(/```json|```/g, '').trim();
            const data = JSON.parse(text);

            quizData = data.quiz;
            flashcardData = data.flashcards;

            renderQuiz();
            setupFlashcards();
            document.getElementById('loading-box').style.display = 'none';

        } catch (error) {
            console.error("AI Error:", error);
            alert("AI generation failed. Please try again.");
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('upload-box').style.display = 'block';
        }
    }

    // 6. RENDER QUIZ
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = quizData.map((q, i) => `
            <div class="quiz-card">
                <div class="question">${i + 1}. ${q.q}</div>
                ${q.options.map(opt => `
                    <div class="option" onclick="checkAnswer(this, '${opt}', '${q.a}')">${opt}</div>
                `).join('')}
            </div>
        `).join('');
    }

    window.checkAnswer = (el, sel, cor) => {
        if(el.parentElement.classList.contains('answered')) return;
        el.parentElement.classList.add('answered');
        if(sel === cor) el.classList.add('correct');
        else {
            el.classList.add('wrong');
            Array.from(el.parentElement.children).forEach(c => {
                if(c.innerText === cor) c.classList.add('correct');
            });
        }
    };

    // 7. FLASHCARD LOGIC
    function setupFlashcards() {
        if(flashcardData.length > 0) {
            document.getElementById('fc-controls').style.display = 'flex';
            updateCardDisplay();
        }
    }

    function updateCardDisplay() {
        const card = flashcardData[currentCardIndex];
        document.getElementById('fc-front').innerText = card.front;
        document.getElementById('fc-back').innerText = card.back;
        document.getElementById('fc-count').innerText = `${currentCardIndex + 1} / ${flashcardData.length}`;
        document.getElementById('active-card').classList.remove('flipped');
    }

    window.toggleFlip = () => document.getElementById('active-card').classList.toggle('flipped');
    window.nextCard = () => { if(currentCardIndex < flashcardData.length-1) { currentCardIndex++; updateCardDisplay(); } };
    window.prevCard = () => { if(currentCardIndex > 0) { currentCardIndex--; updateCardDisplay(); } };

    // 8. TABS
    window.switchTab = (mode) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.closest('.tab-btn').classList.add('active'); // Fix for icon click

        if(mode === 'quiz') {
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
        } else {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
        }
    };
</script>

</body>
    </html>
