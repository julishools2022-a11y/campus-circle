<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Campus Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-dark: #1d4ed8;
            --dark: #0f172a; 
            --bg: #f8fafc; 
            --text: #334155;
            --text-light: #64748b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .brand { margin-bottom: 30px; text-align: center; }
        .brand-text { font-size: 24px; font-weight: 900; color: var(--primary); letter-spacing: -0.5px; }
        .brand-sub { font-size: 14px; color: var(--text-light); margin-top: 5px; }
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid #e2e8f0;
        }
        h2 { color: var(--dark); margin: 0 0 20px 0; font-size: 1.5rem; font-weight: 700; text-align: center; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text); font-size: 0.85rem; font-weight: 600; }
        input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 16px; color: var(--dark); outline: none; background: #f8fafc;
            font-family: inherit; transition: all 0.2s;
        }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-login {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            margin-top: 1rem; font-family: inherit;
        }
        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        /* DIVIDER */
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-light); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

        /* GOOGLE BUTTON */
        .btn-google {
            width: 100%; padding: 13px; background: white; color: var(--dark);
            border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; transition: background 0.2s, border-color 0.2s, transform 0.1s;
            font-family: inherit;
        }
        .btn-google:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-google:active { transform: scale(0.98); }
        .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .google-icon { width: 20px; height: 20px; flex-shrink: 0; }

        #message { margin-top: 1.2rem; font-size: 0.9rem; text-align: center; min-height: 1.2rem; font-weight: 500; }
        .forgot-link { display: block; text-align: right; font-size: 0.82rem; color: var(--primary); text-decoration: none; margin-top: 6px; font-weight: 500; }
        .forgot-link:hover { text-decoration: underline; }
        .footer-text { margin-top: 2rem; font-size: 0.9rem; color: var(--text-light); text-align: center; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <div class="brand">
        <div class="brand-text">&#127891; Campus Circle</div>
        <div class="brand-sub">The Exclusive Student Marketplace</div>
    </div>

    <div class="login-container">
        <h2>Welcome Back</h2>

        <!-- GOOGLE LOGIN -->
        <button class="btn-google" id="googleBtn" onclick="signInWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider">or sign in with email</div>

        <!-- EMAIL LOGIN -->
        <form id="login-form">
            <div class="form-group">
                <label for="loginEmail">University Email</label>
                <input type="email" id="loginEmail" placeholder="Email address" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
                <a href="forget-password.html" class="forgot-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Log In</button>
        </form>

        <div id="message"></div>

        <div class="footer-text">
            New to Campus Circle? <a href="signin.html">Create an Account</a>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const msg  = document.getElementById("message");
        const btn  = document.getElementById("loginBtn");
        const gBtn = document.getElementById("googleBtn");

        // ── GOOGLE SIGN IN ────────────────────────────────────────────────────
        async function signInWithGoogle() {
            gBtn.disabled   = true;
            gBtn.textContent = 'Connecting to Google...';
            msg.textContent  = '';

            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });

            if (error) {
                msg.textContent = error.message;
                msg.style.color = '#ef4444';
                gBtn.disabled   = false;
                gBtn.textContent = 'Continue with Google';
            }
            // No error = Supabase redirects to Google automatically
        }

        // ── EMAIL SIGN IN ─────────────────────────────────────────────────────
        document.getElementById("login-form").onsubmit = async (e) => {
            e.preventDefault();
            const email    = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            btn.disabled    = true;
            btn.textContent = "Verifying...";
            msg.textContent = "";

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    msg.textContent = error.message;
                    msg.style.color = "#ef4444";
                    btn.disabled    = false;
                    btn.textContent = "Log In";
                } else {
                    // Sync profile email on every login
                    await _supabase.from('profiles').upsert({
                        id:    data.user.id,
                        email: data.user.email,
                    }, { onConflict: 'id' });

                    msg.textContent = "Success! Redirecting...";
                    msg.style.color = "#16a34a";
                    setTimeout(() => { window.location.href = "index.html"; }, 900);
                }
            } catch(err) {
                msg.textContent = "Connection error. Please try again.";
                msg.style.color = "#ef4444";
                btn.disabled    = false;
                btn.textContent = "Log In";
            }
        };

        // ── HANDLE GOOGLE REDIRECT CALLBACK ──────────────────────────────────
        // After Google redirects back, sync profile and navigate
        _supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session) {
                await _supabase.from('profiles').upsert({
                    id:    session.user.id,
                    email: session.user.email,
                    name:  session.user.user_metadata?.full_name || session.user.user_metadata?.name || '',
                }, { onConflict: 'id' });
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
