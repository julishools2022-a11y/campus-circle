<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Student (Test) | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 24px;max-width:420px;width:100%;}
        h1{font-size:1.25rem;font-weight:800;margin-bottom:4px;text-align:center;}
        .subtitle{text-align:center;color:var(--muted);font-size:0.82rem;margin-bottom:24px;line-height:1.5;}
        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;}
        input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;}
        input:focus{border-color:var(--primary);outline:none;}
        .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;font-weight:700;font-size:0.95rem;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 4px 14px rgba(61,114,180,0.3);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
        #msg{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.82rem;display:none;align-items:center;gap:8px;}
        #msg.success{display:flex;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--success);}
        #msg.error{display:flex;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--danger);}
        .warning-box{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:0.78rem;color:#fbbf24;line-height:1.5;}
        .warning-box i{margin-right:6px;}
        .link-row{text-align:center;margin-top:18px;}
        .link-row a{color:var(--accent);font-size:0.82rem;font-weight:600;text-decoration:none;}
    </style>
</head>
<body>

<div class="card">
    <h1>🧪 Add Test Student</h1>
    <div class="subtitle">Quick tool to add a student record to Firestore so you can test the login flow.</div>

    <div class="warning-box">
        <i class="fa-solid fa-triangle-exclamation"></i>
        This is a temporary testing tool. Once the real bulk-import system is built, students will be uploaded via Excel/CSV instead.
    </div>

    <div id="msg"></div>

    <div class="form-group">
        <label>Matric Number</label>
        <input id="f-matric" placeholder="e.g. 2023/SE/001">
    </div>
    <div class="form-group">
        <label>Full Name</label>
        <input id="f-name" placeholder="e.g. John Doe">
    </div>
    <div class="form-group">
        <label>School Email</label>
        <input id="f-email" type="email" placeholder="e.g. john@school.edu">
    </div>
    <div class="form-group">
        <label>Faculty</label>
        <input id="f-faculty" placeholder="e.g. Engineering">
    </div>
    <div class="form-group">
        <label>Department</label>
        <input id="f-department" placeholder="e.g. Software Engineering">
    </div>
    <div class="form-group">
        <label>Level</label>
        <input id="f-level" placeholder="e.g. 300">
    </div>

    <button class="btn-primary" id="btn-add" onclick="addStudent()">
        <i class="fa-solid fa-user-plus"></i> Add Student
    </button>

    <div class="link-row">
        <a href="evoting-login.html"><i class="fa-solid fa-arrow-right"></i> Go to Login Page</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = type;
    }

    window.addStudent = async function() {
        const matric = document.getElementById('f-matric').value.trim().toUpperCase();
        const fullName = document.getElementById('f-name').value.trim();
        const schoolEmail = document.getElementById('f-email').value.trim().toLowerCase();
        const faculty = document.getElementById('f-faculty').value.trim();
        const department = document.getElementById('f-department').value.trim();
        const level = document.getElementById('f-level').value.trim();

        if (!matric || !fullName || !schoolEmail || !faculty || !department) {
            showMsg('Please fill in all required fields.', 'error');
            return;
        }

        const btn = document.getElementById('btn-add');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Adding...';

        try {
            const docId = matric.replace(/\//g, '-');
            const studentRef = doc(db, 'students', docId);
            const existing = await getDoc(studentRef);

            if (existing.exists()) {
                showMsg(`Student ${matric} already exists. Record updated.`, 'success');
            } else {
                showMsg(`Student ${matric} added successfully!`, 'success');
            }

            await setDoc(studentRef, {
                matricNumber: matric,
                fullName,
                schoolEmail,
                faculty,
                department,
                level: level || null,
                isVerified: false,
                hasVotedSUG: false,
                hasVotedFaculty: false,
                hasVotedDepartment: false,
                createdAt: serverTimestamp(),
                importedBy: 'manual_test_tool',
                importBatchId: 'manual'
            }, { merge: true });

            // Clear form
            document.getElementById('f-matric').value = '';
            document.getElementById('f-name').value = '';
            document.getElementById('f-email').value = '';
            document.getElementById('f-faculty').value = '';
            document.getElementById('f-department').value = '';
            document.getElementById('f-level').value = '';

        } catch (e) {
            console.error(e);
            showMsg('Error: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Add Student';
        }
    };
</script>
</body>
</html>
