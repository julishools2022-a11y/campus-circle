<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Setup | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 24px;max-width:420px;width:100%;}
        .logo-wrap{text-align:center;margin-bottom:20px;}
        .logo-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary-bright));display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 12px;box-shadow:0 8px 24px rgba(61,114,180,0.35);}
        h1{font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:6px;}
        .subtitle{text-align:center;color:var(--muted);font-size:0.83rem;margin-bottom:22px;line-height:1.5;}
        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;}
        .form-group label span{color:var(--danger);}
        input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;}
        input:focus{border-color:var(--primary);outline:none;}
        .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;font-weight:700;font-size:0.95rem;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 4px 14px rgba(61,114,180,0.3);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
        #msg{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.82rem;display:none;align-items:flex-start;gap:8px;line-height:1.5;}
        #msg.success{display:flex;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--success);}
        #msg.error{display:flex;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--danger);}
        .info-box{background:rgba(61,114,180,0.08);border:1px solid rgba(61,114,180,0.2);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:0.8rem;color:var(--muted);line-height:1.5;}
        .info-box i{color:var(--accent);margin-right:6px;}
        .lock-state{text-align:center;padding:20px 0;}
        .lock-state i{font-size:2.5rem;color:var(--success);margin-bottom:12px;display:block;}
        .lock-state h2{font-size:1.1rem;font-weight:800;margin-bottom:6px;}
        .lock-state p{color:var(--muted);font-size:0.85rem;line-height:1.6;}
        .link-row{text-align:center;margin-top:16px;}
        .link-row a{color:var(--accent);font-size:0.85rem;font-weight:700;text-decoration:none;}
        .spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:24px auto;}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="spinner"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const card = document.getElementById('card');

    function sanitizeMatric(m) {
        return m.trim().toUpperCase().replace(/\s+/g, '');
    }

    async function checkExistingSuperAdmin() {
        const q = query(collection(db, 'students'), where('adminRole', '==', 'super_admin'), limit(1));
        const snap = await getDocs(q);
        return !snap.empty;
    }

    function renderLocked() {
        card.innerHTML = `
            <div class="lock-state">
                <i class="fa-solid fa-circle-check"></i>
                <h2>Setup Already Complete</h2>
                <p>A Super Admin account already exists for Campus Circle E-Voting. This setup page is now locked for security.</p>
                <div class="link-row"><a href="evoting-login.html"><i class="fa-solid fa-arrow-right"></i> Go to Login</a></div>
            </div>`;
    }

    function renderForm() {
        card.innerHTML = `
            <div class="logo-wrap">
                <div class="logo-icon">🗳️</div>
                <h1>Campus<span style="color:var(--accent)">Circle</span> E-Voting Setup</h1>
                <div class="subtitle">Create the first Super Admin account. This page will lock itself after this account is created.</div>
            </div>

            <div class="info-box">
                <i class="fa-solid fa-shield-halved"></i>
                This account can manage all elections, faculties, departments and other admins. Use your real matric number and school email — you'll log in with the normal matric + OTP flow afterwards.
            </div>

            <div id="msg"></div>

            <div class="form-group">
                <label>Matric Number <span>*</span></label>
                <input id="f-matric" placeholder="e.g. 2021/SS/123">
            </div>
            <div class="form-group">
                <label>Full Name <span>*</span></label>
                <input id="f-name" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label>School Email <span>*</span></label>
                <input id="f-email" type="email" placeholder="e.g. john@school.edu">
            </div>
            <div class="form-group">
                <label>Faculty <span>*</span></label>
                <input id="f-faculty" placeholder="e.g. Social Sciences">
            </div>
            <div class="form-group">
                <label>Department <span>*</span></label>
                <input id="f-department" placeholder="e.g. Sociology/Anthropology">
            </div>
            <div class="form-group">
                <label>Level</label>
                <input id="f-level" placeholder="e.g. 400">
            </div>

            <button class="btn-primary" id="btn-create" onclick="window.createSuperAdmin()">
                <i class="fa-solid fa-shield-halved"></i> Create Super Admin
            </button>`;
    }

    window.createSuperAdmin = async function() {
        const msg = document.getElementById('msg');
        const matricRaw = document.getElementById('f-matric').value;
        const matric = sanitizeMatric(matricRaw);
        const fullName = document.getElementById('f-name').value.trim();
        const schoolEmail = document.getElementById('f-email').value.trim().toLowerCase();
        const faculty = document.getElementById('f-faculty').value.trim();
        const department = document.getElementById('f-department').value.trim();
        const level = document.getElementById('f-level').value.trim();

        if (!matric || !fullName || !schoolEmail || !faculty || !department) {
            msg.className = 'error';
            msg.textContent = 'Please fill in all required fields.';
            return;
        }

        const btn = document.getElementById('btn-create');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';

        try {
            // Double-check no super admin exists (race condition guard)
            const exists = await checkExistingSuperAdmin();
            if (exists) {
                renderLocked();
                return;
            }

            const docId = matric.replace(/\//g, '-');
            await setDoc(doc(db, 'students', docId), {
                matricNumber: matric,
                fullName,
                schoolEmail,
                faculty,
                department,
                level: level || null,
                isActivated: false,
                hasVotedSUG: false,
                hasVotedFaculty: false,
                hasVotedDepartment: false,
                isAdmin: true,
                adminRole: 'super_admin',
                adminScope: { faculty: null, department: null },
                authUid: null,
                createdAt: serverTimestamp(),
                importedBy: 'setup_page',
                importBatchId: 'bootstrap'
            });

            card.innerHTML = `
                <div class="lock-state">
                    <i class="fa-solid fa-circle-check"></i>
                    <h2>Super Admin Created!</h2>
                    <p>Your account (<strong>${matric}</strong>) has been created as Super Admin. Go to the login page, enter this matric number, and check your school email for a one-time activation code to set your password.</p>
                    <div class="link-row"><a href="evoting-login.html"><i class="fa-solid fa-arrow-right"></i> Go to Login</a></div>
                </div>`;

        } catch (e) {
            console.error(e);
            msg.className = 'error';
            msg.textContent = 'Error: ' + e.message;
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Create Super Admin';
        }
    };

    // ── INIT ─────────────────────────────────────────────────────────────────
    (async () => {
        try {
            const exists = await checkExistingSuperAdmin();
            if (exists) renderLocked();
            else renderForm();
        } catch (e) {
            console.error(e);
            card.innerHTML = `<div class="lock-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i><h2>Error</h2><p>Could not check setup status: ${e.message}</p></div>`;
        }
    })();
</script>
</body>
</html>
