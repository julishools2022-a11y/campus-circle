<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; script-src * data: blob: 'unsafe-inline' 'unsafe-eval';">
    <title>Sell an Item</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f1f1f2; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-post { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">Post New Ad</h2>
    <form id="listing-form">
        <label>Photo</label>
        <input type="file" id="file-input" required accept="image/*">
        
        <label>Item Name</label>
        <input type="text" id="title" required placeholder="e.g. iPhone 12">
        
        <label>Price (₦)</label>
        <input type="number" id="price" required placeholder="Price">
        
        <label>Category</label>
        <select id="category" required>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Books">Books</option>
            <option value="Housing">Housing</option>
            <option value="Other">Other</option>
        </select>

        <label>Location</label>
        <input type="text" id="location" required placeholder="e.g. Hostel A">
        
        <label>WhatsApp</label>
        <input type="tel" id="whatsapp" required placeholder="080...">
        
        <label>Description</label>
        <textarea id="description" required placeholder="Details..."></textarea>

        <button type="submit" class="btn-post" id="submit-btn">PAY ₦500 TO POST</button>
    </form>
    <p id="status" style="text-align:center; margin-top:10px;"></p>
    <a href="dashboard.html" style="display:block; text-align:center; margin-top:20px; text-decoration:none; color:#666;">Cancel</a>
</div>

<script>
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const PAYSTACK_KEY = 'pk_live_aff4bfc90ebf07a7c006c862bb4fac8223bd35b5'; 

    let isAdmin = false;

    // 1. Check if Admin immediately on load
    async function checkAdmin() {
        const { data: { user } } = await _supabase.auth.getUser();
        if(user) {
            // Check admin status (case-insensitive)
            const { data } = await _supabase.from('admin_users').select('id').ilike('email', user.email).maybeSingle();
            if(data) {
                isAdmin = true;
                document.getElementById('submit-btn').innerText = "POST ITEM (FREE)";
                document.getElementById('submit-btn').style.backgroundColor = "#10b981"; // Green
            }
        }
    }
    checkAdmin();

    document.getElementById('listing-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "Processing...";

        const { data: { user } } = await _supabase.auth.getUser();
        if(!user) return window.location.href = 'index.html';

        if(isAdmin) {
            // Free for Admin
            uploadData("ADMIN_FREE");
        } else {
            // Pay for Student
            payWithPaystack(user.email);
        }
    };

    function payWithPaystack(email) {
        const handler = PaystackPop.setup({
            key: PAYSTACK_KEY,
            email: email,
            amount: 50000, // 500 Naira
            currency: 'NGN',
            callback: function(response) {
                uploadData(response.reference);
            },
            onClose: function() {
                alert("Payment cancelled");
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').innerText = "PAY ₦500 TO POST";
            }
        });
        handler.openIframe();
    }

    async function uploadData(ref) {
        try {
            const file = document.getElementById('file-input').files[0];
            const fileName = Date.now() + "_" + file.name.replace(/\s/g, '');
            
            // Upload Image
            const { error: upErr } = await _supabase.storage.from('listing-images').upload(fileName, file);
            if(upErr) throw upErr;
            
            const { data: { publicUrl } } = _supabase.storage.from('listing-images').getPublicUrl(fileName);
            const { data: { user } } = await _supabase.auth.getUser();

            // Save to DB
            const { error: dbErr } = await _supabase.from('listings').insert({
                name: document.getElementById('title').value,
                price: document.getElementById('price').value,
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                seller_phone: document.getElementById('whatsapp').value,
                description: document.getElementById('description').value,
                image_url: publicUrl,
                user_id: user.id,
                seller_email: user.email,
                payment_ref: ref
            });

            if(dbErr) throw dbErr;

            alert("Posted Successfully!");
            window.location.href = 'dashboard.html';

        } catch(err) {
            alert("Error: " + err.message);
            document.getElementById('submit-btn').disabled = false;
        }
    }
</script>
</body>
</html>
