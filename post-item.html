<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; script-src * data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src * data: blob: 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src * data: blob: 'unsafe-inline'; style-src * data: blob: 'unsafe-inline';">

    <title>Sell an Item | Campus Circle</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #2563eb; --dark: #0c1a32; --bg: #f1f1f2; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: var(--bg); padding-bottom: 50px; }
        
        header { background: var(--dark); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .form-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #475569; }
        input, textarea, select { 
            width: 100%; padding: 12px; margin-bottom: 20px; 
            border: 1px solid #e2e8f0; border-radius: 8px; font-size: 16px; 
            box-sizing: border-box; background: white;
        }

        .image-picker {
            border: 2px dashed #cbd5e1; padding: 20px; text-align: center;
            border-radius: 10px; cursor: pointer; margin-bottom: 20px; background: #f8fafc;
        }
        #preview-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; justify-content: center; }
        .preview-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; flex-shrink: 0; }

        .btn-post { 
            width: 100%; padding: 16px; background: var(--primary); 
            color: white; border: none; border-radius: 8px; 
            font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-post:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0;">Post New Ad</h2>
</header>

<div class="container">
    <div class="form-card">
        <form id="listing-form">
            <label>Product Photos (Max 4)</label>
            <div class="image-picker" onclick="document.getElementById('file-input').click()">
                <div id="preview-container">
                    <span id="placeholder-text" style="color:#64748b; font-size:14px; align-self:center;">📸 Tap to select photos</span>
                </div>
                <input type="file" id="file-input" multiple accept="image/*" style="display:none" onchange="handleFileSelect(event)">
            </div>

            <label>Item Name</label>
            <input type="text" id="title" placeholder="e.g. iPhone 12 Pro" required>

            <label>Price (₦)</label>
            <input type="number" id="price" placeholder="Price" min="0" required>

            <label>Category</label>
            <select id="category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Books">Books & Handouts</option>
                <option value="Electronics">Electronics & Gadgets</option>
                <option value="Fashion">Clothing & Fashion</option>
                <option value="Housing">Hostel & Appliances</option>
                <option value="Services">Services (Tutoring, etc.)</option>
                <option value="Other">Other</option>
            </select>

            <label>Condition</label>
            <select id="condition">
                <option value="Used">Used</option>
                <option value="New">Brand New</option>
                <option value="Refurbished">Refurbished</option>
            </select>

            <label>Location / Landmark</label>
            <input type="text" id="location" placeholder="e.g. Science Block, Hostel A" required>

            <label>WhatsApp Number</label>
            <input type="tel" id="whatsapp" placeholder="e.g. 08012345678" required>

            <label>Description</label>
            <textarea id="description" rows="3" placeholder="Tell buyers more..."></textarea>

            <div style="opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1;">
                <input type="text" id="website_trap" name="website_trap" autocomplete="off">
            </div>

            <button type="submit" class="btn-post" id="submit-btn">
                <span>PAY ₦500 TO PUBLISH</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            </button>
        </form>
        <p id="status" style="text-align:center; margin-top:15px; font-size:14px; font-weight:500;"></p>
    </div>
</div>

<script>
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // --- YOUR LIVE PAYSTACK KEY ---
    const PAYSTACK_PUBLIC_KEY = 'pk_live_aff4bfc90ebf07a7c006c862bb4fac8223bd35b5'; 
    const PUBLISHING_FEE = 500; 
    // ------------------------------

    let selectedFiles = [];

    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        if (files.length > 4) return alert("Maximum 4 images allowed");
        
        const MAX_SIZE = 2 * 1024 * 1024; // 2MB
        for (let file of files) {
            if (file.size > MAX_SIZE) return alert(`File "${file.name}" is too large! Max 2MB.`);
        }
        
        selectedFiles = files;
        const container = document.getElementById('preview-container');
        container.innerHTML = ''; 
        
        if (files.length > 0) {
            container.style.justifyContent = 'flex-start';
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-thumb';
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
    }

    // --- MAIN SUBMIT LOGIC ---
    document.getElementById('listing-form').onsubmit = async (e) => {
        e.preventDefault();
        
        // Security checks
        if (document.getElementById("website_trap").value !== "") return;
        if (selectedFiles.length === 0) return alert("Please add at least one photo!");

        const btn = document.getElementById('submit-btn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.textContent = "Verifying Admin Status...";

        try {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) { alert("Please login first"); window.location.href='index.html'; return; }

            // 1. CHECK IF USER IS ADMIN (Updated Logic)
            // We use .ilike for case-insensitive matching (Admin@gmail.com == admin@gmail.com)
            const { data: adminData, error: adminError } = await _supabase
                .from('admin_users')
                .select('id')
                .ilike('email', user.email) 
                .maybeSingle();

            if (adminData) {
                // -> IS ADMIN: Skip Paystack
                btn.textContent = "Admin Verified! Uploading...";
                // Pass a special flag so we know it was free
                uploadListingData("ADMIN_FREE_POST"); 
            } else {
                // -> NOT ADMIN
                console.log("Admin check failed:", adminError);
                btn.textContent = "Initiating Payment...";
                payWithPaystack(user.email);
            }

        } catch (err) {
            console.error("Error during check:", err);
            btn.disabled = false;
            btn.innerHTML = originalText;
            alert("Error verifying user. Please check console.");
        }
    };

    function payWithPaystack(email) {
        const handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: email,
            amount: PUBLISHING_FEE * 100, // Kobo
            currency: 'NGN',
            ref: '' + Math.floor((Math.random() * 1000000000) + 1),
            
            callback: function(response) {
                const btn = document.getElementById('submit-btn');
                btn.textContent = "Payment Verified! Uploading...";
                uploadListingData(response.reference);
            },
            
            onClose: function() {
                alert('Transaction cancelled.');
                const btn = document.getElementById('submit-btn');
                btn.disabled = false;
                btn.innerHTML = '<span>PUBLISH LISTING</span>';
            }
        });
        handler.openIframe();
    }

    async function uploadListingData(paymentRef) {
        const status = document.getElementById('status');
        try {
            const { data: { user } } = await _supabase.auth.getUser();
            const sellerName = user.user_metadata.full_name || "Student Seller";
            
            // Upload Images
            const uploadedUrls = [];
            for (const file of selectedFiles) {
                const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '');
                const fileName = `${Date.now()}-${Math.floor(Math.random() * 1000)}-${cleanName}`;
                const { error: uploadError } = await _supabase.storage.from('listing-images').upload(fileName, file);
                if (uploadError) throw uploadError;
                const { data } = _supabase.storage.from('listing-images').getPublicUrl(fileName);
                uploadedUrls.push(data.publicUrl);
            }

            // Get IP
            let userIP = "Unknown";
            try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); userIP = d.ip; } catch(e){}

            // Insert to Supabase
            const { error: dbError } = await _supabase.from('listings').insert([{
                name: document.getElementById('title').value,
                price: parseInt(document.getElementById('price').value),
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                seller_name: sellerName,
                condition: document.getElementById('condition').value,
                seller_phone: document.getElementById('whatsapp').value,
                description: document.getElementById('description').value,
                image_url: uploadedUrls[0],
                gallery: uploadedUrls,
                user_id: user.id,
                seller_email: user.email,
                ip_address: userIP,
                payment_ref: paymentRef
            }]);

            if (dbError) throw dbError;

            status.style.color = "green";
            status.textContent = "Success! Published.";
            setTimeout(() => window.location.href = 'dashboard.html', 1500);

        } catch (err) {
            status.style.color = "red";
            status.textContent = "Error: " + err.message;
            document.getElementById('submit-btn').disabled = false;
        }
    }
</script>

</body>
                </html>
