<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up | Campus Circle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1628">
    <style>
        :root {
            --bg: #0a1628;
            --surface: #112236;
            --surface2: #1a2f4a;
            --border: rgba(61,114,180,0.25);
            --primary: #3d72b4;
            --primary-bright: #5b9bd5;
            --accent: #64b5f6;
            --text: #e2eaf4;
            --text-muted: #7a9cc0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(61,114,180,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61,114,180,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(61,114,180,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .brand-logo { width: 56px; height: 56px; margin: 0 auto 10px; display: block; }
        .brand-name { font-size: 1.5rem; font-weight: 900; color: var(--text); }
        .brand-name span { color: var(--accent); }
        .brand-sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(61,114,180,0.1);
        }

        .card-title { font-size: 1.3rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .card-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 22px; }

        .form-group { margin-bottom: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        input, select {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 11px;
            font-size: 0.92rem;
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        select { padding-left: 38px; }
        input::placeholder { color: var(--text-muted); opacity: 0.6; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61,114,180,0.15); }

        select option { background: var(--surface2); color: var(--text); }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-bright));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #message {
            margin-top: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .footer-link a { color: var(--accent); text-decoration: none; font-weight: 700; }

        /* honeypot */
        .hp { opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1; }
    </style>
</head>
<body>

    <div class="brand">
        <img src="https://nijjgpgxdhsrtftuqcoy.supabase.co/storage/v1/object/public/listing-images/1000389657-removebg-preview.png" class="brand-logo" alt="Campus Circle">
        <div class="brand-name">Campus <span>Circle</span></div>
        <div class="brand-sub">UNIZIK Student Marketplace</div>
    </div>

    <div class="card">
        <div class="card-title">Create Account 🎓</div>
        <div class="card-sub">Join thousands of UNIZIK students</div>

        <form id="signup-form">

            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="fullName" placeholder="Your full name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="margin-bottom:0">
                    <label>Department</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-building-columns"></i>
                        <input type="text" id="dept" placeholder="e.g. Comp Sci" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:0">
                    <label>Level</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="level" required>
                            <option value="" disabled selected>Select</option>
                            <option value="100L">100L</option>
                            <option value="200L">200L</option>
                            <option value="300L">300L</option>
                            <option value="400L">400L</option>
                            <option value="500L">500L</option>
                            <option value="PG">PG</option>
                            <option value="Graduate">Alumni</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-top:14px">
                <label>Email Address</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="signupEmail" placeholder="you@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signupPassword" placeholder="Min. 6 characters" required>
                </div>
            </div>

            <!-- Honeypot -->
            <div class="hp">
                <input type="text" id="website_trap" name="website_trap" autocomplete="off">
            </div>

            <button type="submit" id="submitBtn" class="btn">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <div id="message"></div>

        <div class="footer-link">
            Already have an account? <a href="Login.html">Sign In</a>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://nijjgpgxdhsrtftuqcoy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pampncGd4ZGhzcnRmdHVxY295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTM1OTAsImV4cCI6MjA4MzUyOTU5MH0.v0pcYyNBjD_FeBVJCJHICEvbLwP1Q2Hjp08Jo_5ii3g';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const signupForm = document.getElementById("signup-form");
    const msg = document.getElementById("message");
    const btn = document.getElementById("submitBtn");

    signupForm.onsubmit = async (e) => {
        e.preventDefault();

        if (document.getElementById("website_trap").value !== "") return;

        const name = document.getElementById("fullName").value;
        const dept = document.getElementById("dept").value;
        const level = document.getElementById("level").value;
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;

        msg.textContent = "";
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

        try {
            const { data, error } = await _supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: name, department: dept, level: level } }
            });

            if (error) {
                msg.textContent = error.message;
                msg.style.color = "var(--danger)";
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
            } else {
                msg.textContent = "✓ Account created! Redirecting...";
                msg.style.color = "var(--success)";
                setTimeout(() => { window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`; }, 1000);
            }
        } catch (err) {
            msg.textContent = "Connection error. Try again.";
            msg.style.color = "var(--danger)";
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        }
    };
</script>
</body>
</html>
