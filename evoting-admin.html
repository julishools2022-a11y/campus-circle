<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Election | Campus Circle E-Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#0a1628;--surface:#112236;--surface2:#1a2f4a;--primary:#3d72b4;--primary-bright:#5b9bd5;--accent:#64b5f6;--text:#e2eaf4;--muted:#7a9cc0;--border:rgba(61,114,180,0.2);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}

        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;position:sticky;top:0;z-index:100;}
        .header h1{font-size:1.05rem;font-weight:800;}
        .header .subtitle{font-size:0.78rem;color:var(--muted);margin-top:2px;}

        .form-wrap{padding:16px;}
        .section-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
        .section-card h3{font-size:0.9rem;font-weight:800;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;}

        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;}
        .form-group label span{color:var(--danger);}
        input,select,textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;}
        input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;}
        textarea{resize:none;}

        .type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
        .type-card{background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;transition:0.2s;}
        .type-card.selected{border-color:var(--primary);background:rgba(61,114,180,0.12);}
        .type-card .emoji{font-size:1.4rem;display:block;margin-bottom:4px;}
        .type-card .label{font-size:0.7rem;font-weight:700;color:var(--muted);}
        .type-card.selected .label{color:var(--accent);}

        #scope-fields{display:none;}
        #scope-fields.show{display:block;}

        .positions-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
        .position-chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:0.78rem;display:flex;align-items:center;gap:6px;}
        .position-chip button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.8rem;padding:0;}
        .add-position-row{display:flex;gap:8px;}
        .add-position-row input{flex:1;}
        .add-position-row button{background:var(--primary);color:white;border:none;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer;font-family:inherit;}

        .btn-publish{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:white;font-weight:800;font-size:1rem;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 6px 20px rgba(61,114,180,0.35);display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-publish:disabled{opacity:0.5;cursor:not-allowed;}

        /* CANDIDATE SECTION */
        .candidate-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
        .candidate-item-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
        .candidate-item-row strong{flex:1;font-size:0.88rem;}
        .candidate-item-row .pos-tag{font-size:0.7rem;color:var(--accent);background:rgba(61,114,180,0.15);padding:3px 8px;border-radius:6px;}
        .remove-btn{width:28px;height:28px;border-radius:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

        #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:0.85rem;font-weight:600;display:none;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90vw;text-align:center;}
        #toast.error{border-color:rgba(239,68,68,0.4);color:var(--danger);}
        #toast.success{border-color:rgba(34,197,94,0.4);color:var(--success);}

        /* ELECTIONS LIST */
        .existing-list{padding:16px;}
        .existing-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
        .existing-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
        .existing-item-top strong{font-size:0.9rem;}
        .existing-meta{font-size:0.75rem;color:var(--muted);}
        .status-pill{font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:6px;}
        .status-active{background:rgba(34,197,94,0.15);color:var(--success);}
        .status-upcoming{background:rgba(245,158,11,0.15);color:var(--warning);}
        .status-closed{background:rgba(122,156,192,0.15);color:var(--muted);}
        .existing-actions{display:flex;gap:8px;margin-top:10px;}
        .existing-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;}
        .existing-actions button.danger{border-color:rgba(239,68,68,0.3);color:var(--danger);}
        .existing-actions button.success{border-color:rgba(34,197,94,0.3);color:var(--success);}
    </style>
</head>
<body>

<div class="header">
    <h1>🗳️ Election Admin (Test Tool)</h1>
    <div class="subtitle">Create elections, set scope, add positions &amp; candidates</div>
</div>

<div class="form-wrap">

    <!-- ELECTION TYPE -->
    <div class="section-card">
        <h3><i class="fa-solid fa-layer-group"></i> Election Type</h3>
        <div class="type-grid">
            <div class="type-card selected" data-type="department" onclick="selectType(this)">
                <span class="emoji">📚</span>
                <div class="label">Departmental</div>
            </div>
            <div class="type-card" data-type="faculty" onclick="selectType(this)">
                <span class="emoji">🎓</span>
                <div class="label">Faculty</div>
            </div>
            <div class="type-card" data-type="sug" onclick="selectType(this)">
                <span class="emoji">🏛️</span>
                <div class="label">SUG</div>
            </div>
        </div>

        <div class="form-group">
            <label>Election Title <span>*</span></label>
            <input id="f-title" placeholder="e.g. Software Engineering Departmental Election 2025">
        </div>

        <div id="scope-fields" class="show">
            <div class="form-group">
                <label>Faculty <span>*</span></label>
                <input id="f-faculty" placeholder="e.g. Engineering">
            </div>
            <div class="form-group" id="dept-field">
                <label>Department <span>*</span></label>
                <input id="f-department" placeholder="e.g. Software Engineering">
            </div>
        </div>

        <div class="form-group">
            <label>Start Date &amp; Time <span>*</span></label>
            <input id="f-start" type="datetime-local">
        </div>
        <div class="form-group">
            <label>End Date &amp; Time <span>*</span></label>
            <input id="f-end" type="datetime-local">
        </div>
        <div class="form-group">
            <label>Initial Status</label>
            <select id="f-status">
                <option value="upcoming">🟡 Upcoming</option>
                <option value="active">🟢 Active (open for voting now)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Results Mode</label>
            <select id="f-results-mode">
                <option value="hidden">🔒 Hidden until election closes</option>
                <option value="live">📊 Live results during voting</option>
            </select>
        </div>
    </div>

    <!-- POSITIONS -->
    <div class="section-card">
        <h3><i class="fa-solid fa-list-check"></i> Positions</h3>
        <div class="positions-list" id="positions-list"></div>
        <div class="add-position-row">
            <input id="new-position" placeholder="e.g. President" onkeypress="if(event.key==='Enter'){event.preventDefault();addPosition();}">
            <button onclick="addPosition()">Add</button>
        </div>
    </div>

    <!-- CANDIDATES -->
    <div class="section-card">
        <h3><i class="fa-solid fa-user-plus"></i> Candidates</h3>
        <div id="candidates-list"></div>
        <div class="form-group">
            <label>Position</label>
            <select id="cand-position"><option value="">Add positions first</option></select>
        </div>
        <div class="form-group">
            <label>Candidate Full Name</label>
            <input id="cand-name" placeholder="e.g. Jane Smith">
        </div>
        <div class="form-group">
            <label>Manifesto (short)</label>
            <textarea id="cand-manifesto" rows="2" placeholder="Brief manifesto / campaign promise"></textarea>
        </div>
        <button onclick="addCandidate()" style="width:100%;padding:11px;border:none;border-radius:10px;background:var(--success);color:white;font-weight:700;cursor:pointer;font-family:inherit;">
            <i class="fa-solid fa-plus"></i> Add Candidate
        </button>
    </div>

    <button class="btn-publish" id="btn-publish" onclick="publishElection()">
        <i class="fa-solid fa-rocket"></i> Create Election
    </button>
</div>

<!-- EXISTING ELECTIONS -->
<div class="existing-list">
    <div class="section-card" style="margin-bottom:0;">
        <h3><i class="fa-solid fa-list"></i> Existing Elections</h3>
        <div id="existing-elections"><p style="color:var(--muted);font-size:0.85rem;">Loading...</p></div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOHwOgJn80vtEyhy70D0VP4z6cAYgEsu8",
        authDomain: "campuscircle-49461.firebaseapp.com",
        projectId: "campuscircle-49461",
        storageBucket: "campuscircle-49461.firebasestorage.app",
        messagingSenderId: "920560772166",
        appId: "1:920560772166:web:e53d6a3c22fbd56b4c5647"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedType = 'department';
    let positions = [];
    let candidates = []; // { position, fullName, manifesto }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = type; t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    window.selectType = function(el) {
        document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedType = el.dataset.type;

        const scopeFields = document.getElementById('scope-fields');
        const deptField = document.getElementById('dept-field');

        if (selectedType === 'sug') {
            scopeFields.classList.remove('show');
        } else {
            scopeFields.classList.add('show');
            deptField.style.display = selectedType === 'department' ? 'block' : 'none';
        }
    };

    window.addPosition = function() {
        const input = document.getElementById('new-position');
        const val = input.value.trim();
        if (!val) return;
        if (positions.includes(val)) { showToast('Position already added', 'error'); return; }
        positions.push(val);
        input.value = '';
        renderPositions();
        renderCandidatePositionOptions();
    };

    window.removePosition = function(i) {
        positions.splice(i, 1);
        renderPositions();
        renderCandidatePositionOptions();
    };

    function renderPositions() {
        document.getElementById('positions-list').innerHTML = positions.map((p, i) =>
            `<div class="position-chip">${p} <button onclick="removePosition(${i})"><i class="fa-solid fa-xmark"></i></button></div>`
        ).join('');
    }

    function renderCandidatePositionOptions() {
        const sel = document.getElementById('cand-position');
        if (!positions.length) {
            sel.innerHTML = '<option value="">Add positions first</option>';
            return;
        }
        sel.innerHTML = positions.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    window.addCandidate = function() {
        const position = document.getElementById('cand-position').value;
        const fullName = document.getElementById('cand-name').value.trim();
        const manifesto = document.getElementById('cand-manifesto').value.trim();
        if (!position) { showToast('Add a position first', 'error'); return; }
        if (!fullName) { showToast('Enter candidate name', 'error'); return; }

        candidates.push({ position, fullName, manifesto });
        document.getElementById('cand-name').value = '';
        document.getElementById('cand-manifesto').value = '';
        renderCandidates();
    };

    window.removeCandidate = function(i) {
        candidates.splice(i, 1);
        renderCandidates();
    };

    function renderCandidates() {
        document.getElementById('candidates-list').innerHTML = candidates.map((c, i) => `
            <div class="candidate-item">
                <div class="candidate-item-row">
                    <strong>${c.fullName}</strong>
                    <span class="pos-tag">${c.position}</span>
                    <button class="remove-btn" onclick="removeCandidate(${i})"><i class="fa-solid fa-xmark"></i></button>
                </div>
                ${c.manifesto ? `<div style="font-size:0.78rem;color:var(--muted);">${c.manifesto}</div>` : ''}
            </div>`).join('');
    }

    window.publishElection = async function() {
        const title = document.getElementById('f-title').value.trim();
        const start = document.getElementById('f-start').value;
        const end = document.getElementById('f-end').value;
        const status = document.getElementById('f-status').value;
        const resultsMode = document.getElementById('f-results-mode').value;

        if (!title) { showToast('Enter election title', 'error'); return; }
        if (!start || !end) { showToast('Set start and end dates', 'error'); return; }
        if (new Date(end) <= new Date(start)) { showToast('End date must be after start date', 'error'); return; }
        if (!positions.length) { showToast('Add at least one position', 'error'); return; }

        const scope = {};
        if (selectedType !== 'sug') {
            const faculty = document.getElementById('f-faculty').value.trim();
            if (!faculty) { showToast('Enter faculty', 'error'); return; }
            scope.faculty = faculty;
            if (selectedType === 'department') {
                const department = document.getElementById('f-department').value.trim();
                if (!department) { showToast('Enter department', 'error'); return; }
                scope.department = department;
            }
        }

        const btn = document.getElementById('btn-publish');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';

        try {
            const electionDoc = await addDoc(collection(db, 'elections'), {
                title,
                type: selectedType,
                scope,
                status,
                resultsMode,
                startDate: new Date(start),
                endDate: new Date(end),
                positions,
                createdBy: 'admin_test_tool',
                createdAt: new Date()
            });

            // Add candidates
            for (const c of candidates) {
                await addDoc(collection(db, 'candidates'), {
                    electionId: electionDoc.id,
                    fullName: c.fullName,
                    position: c.position,
                    manifesto: c.manifesto || '',
                    biography: '',
                    campaignAgenda: '',
                    photoUrl: '',
                    faculty: scope.faculty || '',
                    department: scope.department || '',
                    socialLinks: {},
                    voteCount: 0,
                    createdAt: new Date()
                });
            }

            // Initialize vote counter
            const candidateCounts = {};
            await addDoc(collection(db, 'voteCounters'), {
                electionId: electionDoc.id,
                totalVotesCast: 0,
                candidateCounts,
                lastUpdated: new Date()
            });

            showToast('Election created successfully!', 'success');

            // Reset form
            document.getElementById('f-title').value = '';
            document.getElementById('f-faculty').value = '';
            document.getElementById('f-department').value = '';
            document.getElementById('f-start').value = '';
            document.getElementById('f-end').value = '';
            positions = [];
            candidates = [];
            renderPositions();
            renderCandidates();
            renderCandidatePositionOptions();

            loadExistingElections();

        } catch (e) {
            console.error(e);
            showToast('Error: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-rocket"></i> Create Election';
        }
    };

    async function loadExistingElections() {
        const snap = await getDocs(collection(db, 'elections'));
        const elections = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const container = document.getElementById('existing-elections');

        if (!elections.length) {
            container.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;">No elections created yet.</p>';
            return;
        }

        const typeLabel = { sug: 'SUG', faculty: 'Faculty', department: 'Departmental' };

        container.innerHTML = elections.map(e => {
            const scopeText = e.type === 'department' ? `${e.scope?.department || ''}, ${e.scope?.faculty || ''}`
                : e.type === 'faculty' ? e.scope?.faculty || '' : 'All Students';
            return `<div class="existing-item">
                <div class="existing-item-top">
                    <strong>${e.title}</strong>
                    <span class="status-pill status-${e.status}">${e.status?.toUpperCase()}</span>
                </div>
                <div class="existing-meta">${typeLabel[e.type] || e.type} · ${scopeText} · ${e.positions?.length || 0} positions</div>
                <div class="existing-actions">
                    ${e.status !== 'active' ? `<button class="success" onclick="setElectionStatus('${e.id}','active')"><i class="fa-solid fa-play"></i> Activate</button>` : ''}
                    ${e.status !== 'closed' ? `<button onclick="setElectionStatus('${e.id}','closed')"><i class="fa-solid fa-lock"></i> Close</button>` : ''}
                    <button class="danger" onclick="deleteElection('${e.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>`;
        }).join('');
    }

    window.setElectionStatus = async function(id, status) {
        await updateDoc(doc(db, 'elections', id), { status });
        showToast(`Election ${status === 'active' ? 'activated' : 'closed'}!`, 'success');
        loadExistingElections();
    };

    window.deleteElection = async function(id) {
        if (!confirm('Delete this election and its candidates? This cannot be undone.')) return;

        // Delete candidates for this election
        const candSnap = await getDocs(query(collection(db, 'candidates'), where('electionId', '==', id)));
        for (const c of candSnap.docs) await deleteDoc(c.ref);

        // Delete vote counter
        const counterSnap = await getDocs(query(collection(db, 'voteCounters'), where('electionId', '==', id)));
        for (const c of counterSnap.docs) await deleteDoc(c.ref);

        await deleteDoc(doc(db, 'elections', id));
        showToast('Election deleted', 'success');
        loadExistingElections();
    };

    // Init
    renderCandidatePositionOptions();
    loadExistingElections();
</script>
</body>
</html>
